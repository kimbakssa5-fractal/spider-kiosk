<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; media-src 'self' blob:; img-src 'self' data: blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<meta name="google" content="notranslate">
<script>/*__saveToDesktopShim*/(function(){if(window.__saveShimOn)return;window.__saveShimOn=1;
var oc=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){
var self=this;if(self.download&&window.showSaveFilePicker&&/^(blob|data):/.test(self.href)){
var href=self.href,name=self.download;(async function(){try{
var h=await window.showSaveFilePicker({suggestedName:name,startIn:'desktop'});
var b=await(await fetch(href)).blob();var w=await h.createWritable();await w.write(b);await w.close();
}catch(e){if(e&&e.name==='AbortError')return;try{oc.call(self)}catch(_){}}
finally{try{window.__enterFullscreen&&window.__enterFullscreen()}catch(_){}}})();return;}
return oc.apply(self,arguments);};})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111418">
<title>딜레이 카메라 — 89_camera_delay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<script src="js/fullscreen.js"></script>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="rot">
<div id="stage">
  <!-- 지연 화면 (MSE 모드는 video, 프레임 모드는 canvas) -->
  <video id="delayed" muted playsinline autoplay></video>
  <canvas id="delayCanvas" class="hide"></canvas>

  <!-- 좌상단: 몇 초 전 화면인지 -->
  <div id="delayBadge"><b id="delayBadgeNum">10</b><span data-i="ago">초 전</span></div>

  <!-- 우상단: 실시간 작은 화면 -->
  <div id="pip" class="rot270">
    <video id="live" muted playsinline autoplay></video>
    <span data-i="now">지금</span>
  </div>

  <!-- 버퍼 채우는 중 -->
  <div id="fill" class="hide">
    <div class="card">
      <div class="t" data-i="fillT">지연 버퍼 채우는 중</div>
      <div class="bar"><i id="fillBar"></i></div>
      <div class="s"><span id="fillNow">0</span> / <span id="fillMax">10</span><span data-i="sU">초</span></div>
    </div>
  </div>

  <!-- 카메라 오류 -->
  <div id="err" class="hide">
    <div class="card">
      <div class="t" id="errTitle">카메라를 열 수 없습니다</div>
      <div class="s" id="errMsg"></div>
      <button id="errRetry" class="pill" data-i="retry">다시 시도</button>
    </div>
  </div>

  <div id="frozenBadge" class="hide" data-i="frozen">일시정지</div>
</div>

<!-- 하단 컨트롤 -->
<div id="controls">
  <div class="row chips" id="presets">
    <button class="chip" data-d="3">3초</button>
    <button class="chip" data-d="5">5초</button>
    <button class="chip on" data-d="10">10초</button>
    <button class="chip" data-d="15">15초</button>
    <button class="chip" data-d="20">20초</button>
    <button class="chip" data-d="25">25초</button>
    <button class="chip" data-d="30">30초</button>
    <button class="chip" data-d="35">35초</button>
    <button class="chip" data-d="40">40초</button>
    <button class="chip" data-d="45">45초</button>
    <button class="chip" data-d="60">60초</button>
  </div>
  <div class="row">
    <input type="range" id="delayRange" min="1" max="120" step="1" value="10">
    <div id="delayNum"><b>10</b><span data-i="sU">초</span></div>
  </div>
  <div class="row btns">
    <button id="btnFreeze" class="pill">⏸ 정지</button>
    <button id="btnFlip"  class="pill" data-i="camera">🔄 카메라</button>
    <button id="btnMirror" class="pill" data-i="mirrorB">↔ 미러</button>
    <button id="btnFit"   class="pill">⛶ 채우기</button>
    <button id="btnOrient" class="pill">📱 180°</button>
    <button id="btnShot"  class="pill" data-i="shot">📸 스냅샷</button>
    <button id="btnRec"   class="pill">⏺ 대기</button>
    <button id="btnAuto"  class="pill">🔴 자동녹화 ON</button>
    <button id="btnLang"  class="pill">🌐 English</button>
  </div>
  <div id="statusLine"></div>
</div>
</div><!-- /rot -->

<!-- 첫 진입 비밀번호 게이트 (1회 통과 = 기기 영구 개방) -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-title" data-i="gateT">비밀번호 4자리</div>
    <div class="gate-dots"><span></span><span></span><span></span><span></span></div>
    <div class="gate-keys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <span></span><button data-k="0">0</button><button data-k="del">&#9003;</button>
    </div>
    <div class="gate-msg"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
