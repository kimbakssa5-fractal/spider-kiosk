<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pose Skeleton — 실시간 골격 인식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --panel:rgba(20,26,36,.72);
    --line:#00e5ff;
    --joint:#ff2d78;
    --accent:#00e5ff;
    --text:#e8eef5;
    --muted:#8a99ab;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#12202e 0%,var(--bg) 60%);
    color:var(--text);
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    overflow-x:hidden;
  }
  header{
    text-align:center;padding:22px 16px 8px;
  }
  header h1{font-weight:700;font-size:clamp(20px,4vw,30px);letter-spacing:-.5px}
  header h1 span{color:var(--accent)}
  header p{color:var(--muted);font-weight:300;font-size:14px;margin-top:6px}

  .stage{
    position:relative;width:min(94vw,900px);aspect-ratio:16/10;
    margin:14px 0;border-radius:16px;overflow:hidden;
    background:#05080d;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05) inset;
  }
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{transform:scaleX(-1)}          /* 거울 모드 */
  canvas{transform:scaleX(-1)}
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;text-align:center;padding:24px;
    background:rgba(5,8,13,.82);backdrop-filter:blur(4px);z-index:5;transition:opacity .4s;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .badge{
    position:absolute;top:12px;left:12px;z-index:6;display:flex;gap:8px;align-items:center;
    background:var(--panel);backdrop-filter:blur(8px);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:500;
    border:1px solid rgba(255,255,255,.08);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#ff4040}
  .dot.live{background:#28e07a;box-shadow:0 0 10px #28e07a}
  .fps{position:absolute;top:12px;right:12px;z-index:6;background:var(--panel);backdrop-filter:blur(8px);
    padding:7px 12px;border-radius:999px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;border:1px solid rgba(255,255,255,.08)}

  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
  button{
    font-family:inherit;font-weight:500;font-size:14px;color:var(--text);
    background:var(--panel);border:1px solid rgba(255,255,255,.12);
    padding:11px 20px;border-radius:12px;cursor:pointer;transition:.18s;backdrop-filter:blur(8px);
  }
  button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  button.primary{background:var(--accent);color:#05080d;border-color:var(--accent);font-weight:700}
  button.primary:hover{filter:brightness(1.1);color:#05080d}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;border-color:rgba(255,255,255,.12);color:var(--text)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 4px}
  .toggle input{width:38px;height:20px;appearance:none;background:#2a3442;border-radius:999px;position:relative;cursor:pointer;transition:.2s}
  .toggle input:checked{background:var(--accent)}
  .toggle input::after{content:"";position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
  .toggle input:checked::after{left:20px}

  footer{color:var(--muted);font-size:12px;font-weight:300;padding:10px 16px 26px;text-align:center;line-height:1.7}
  code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px;font-size:11px}
</style>
</head>
<body>
  <header>
    <h1><span>●</span> 실시간 골격 인식 <span>Skeleton</span></h1>
    <p>웹캠 한 대로 사람의 관절 33개를 실시간 추적합니다 · MediaPipe Pose</p>
  </header>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="badge"><span class="dot" id="statusDot"></span><span id="statusText">대기 중</span></div>
    <div class="fps" id="fps">-- FPS</div>
    <div class="overlay" id="overlay">
      <div class="spinner" id="spinner" style="display:none"></div>
      <div id="overlayMsg" style="max-width:420px;line-height:1.7">
        <strong style="font-size:18px">웹캠으로 골격을 인식합니다</strong><br>
        <span style="color:var(--muted);font-weight:300;font-size:14px">아래 <b>시작</b> 버튼을 누르고 카메라 사용을 허용하세요.<br>전신이 화면에 들어올수록 정확합니다.</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">▶ 시작</button>
    <button id="stopBtn" disabled>■ 정지</button>
    <label class="toggle"><input type="checkbox" id="wingsChk" checked>🪽 날개 장착</label>
    <label class="toggle"><input type="checkbox" id="particleChk" checked>✨ 파티클</label>
    <label class="toggle"><input type="checkbox" id="skelChk" checked>골격 표시</label>
    <label class="toggle"><input type="checkbox" id="mirrorChk" checked>거울 모드</label>
    <label class="toggle"><input type="checkbox" id="videoChk" checked>영상 표시</label>
  </div>

  <footer>
    모든 처리는 <b>브라우저 안에서</b> 실행됩니다 — 영상은 서버로 전송되지 않습니다.<br>
    붉은 점 = 관절 · 파란 선 = 뼈대 &nbsp;|&nbsp; 권장 브라우저: Chrome / Edge
  </footer>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video   = document.getElementById('video');
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const spinner = document.getElementById('spinner');
const omsg    = document.getElementById('overlayMsg');
const startBtn= document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const mirrorChk=document.getElementById('mirrorChk');
const videoChk =document.getElementById('videoChk');
const wingsChk =document.getElementById('wingsChk');
const skelChk  =document.getElementById('skelChk');
const particleChk=document.getElementById('particleChk');
const statusDot=document.getElementById('statusDot');
const statusText=document.getElementById('statusText');
const fpsEl   =document.getElementById('fps');

let poseLandmarker=null, drawUtils=null, running=false, stream=null, raf=null;
let lastVideoTime=-1, lastT=performance.now(), frames=0, fps=0;

// 오프스크린: 인물(전경) 분리용
const personCv=document.createElement('canvas'), personCtx=personCv.getContext('2d');
const maskCv  =document.createElement('canvas'), maskCtx  =maskCv.getContext('2d');
let maskId=null;
// 세그멘테이션 마스크들 → 인물만 남긴 레이어 만들기(등 뒤 합성용)
function buildPersonLayer(masks,w,h){
  if(!masks||!masks.length) return null;
  const m0=masks[0], mw=m0.width, mh=m0.height;
  if(!maskId || maskId.width!==mw || maskId.height!==mh){
    maskCv.width=mw; maskCv.height=mh; maskId=maskCtx.createImageData(mw,mh);
  }
  const d=maskId.data;
  // 여러 명이면 마스크 합집합(최댓값)
  let acc=masks[0].getAsFloat32Array();
  const tmp=[];
  for(let k=1;k<masks.length;k++) tmp.push(masks[k].getAsFloat32Array());
  for(let i=0;i<acc.length;i++){
    let v=acc[i];
    for(let k=0;k<tmp.length;k++) if(tmp[k][i]>v) v=tmp[k][i];
    // 0.35~0.65 구간만 부드럽게(배경 배어나옴 방지 + 가장자리 앤티앨리어싱)
    let a=(v-0.35)/0.30; a=a<0?0:a>1?1:a;
    d[i*4+3]=(a*255)|0;
  }
  maskCtx.putImageData(maskId,0,0);
  // 인물 = 현재 영상 ∩ 마스크
  if(personCv.width!==w||personCv.height!==h){ personCv.width=w; personCv.height=h; }
  personCtx.globalCompositeOperation='source-over';
  personCtx.clearRect(0,0,w,h);
  personCtx.drawImage(video,0,0,w,h);
  personCtx.globalCompositeOperation='destination-in';
  personCtx.drawImage(maskCv,0,0,w,h);
  personCtx.globalCompositeOperation='source-over';
  return personCv;
}

function setOverlay(html,showSpin){ omsg.innerHTML=html; spinner.style.display=showSpin?'block':'none'; overlay.classList.remove('hidden'); }
function hideOverlay(){ overlay.classList.add('hidden'); }
function setStatus(text,live){ statusText.textContent=text; statusDot.classList.toggle('live',!!live); }

async function loadModel(){
  setOverlay('AI 모델을 불러오는 중…<br><span style="color:var(--muted);font-weight:300;font-size:13px">최초 1회만 로드됩니다 (수 초 소요)</span>',true);
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  poseLandmarker = await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
      delegate:"GPU"
    },
    runningMode:"VIDEO",
    numPoses:2,
    minPoseDetectionConfidence:0.5,
    minPosePresenceConfidence:0.5,
    minTrackingConfidence:0.5,
    outputSegmentationMasks:true          // 인물 분할(날개를 등 뒤로 합성)
  });
  drawUtils = new DrawingUtils(ctx);
}

async function openCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw new DOMException('이 브라우저/환경에서는 카메라 API를 쓸 수 없습니다 (HTTPS 필요).','NotSupportedError');
  // 해상도를 점점 낮춰 재시도 — OverconstrainedError 대비
  const tries=[
    {video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false},
    {video:{width:{ideal:640},height:{ideal:480}},audio:false},
    {video:true,audio:false}
  ];
  let lastErr=null;
  for(const c of tries){
    try{ return await navigator.mediaDevices.getUserMedia(c); }
    catch(e){ lastErr=e; if(e.name==='NotAllowedError'||e.name==='NotFoundError'||e.name==='NotReadableError'||e.name==='SecurityError') throw e; }
  }
  throw lastErr;
}

function cameraErrorMsg(e){
  const sub=s=>'<br><span style="color:var(--muted);font-weight:300;font-size:13px">'+s+'</span>';
  switch(e.name){
    case 'NotAllowedError': return '카메라 접근이 <b>차단</b>되어 있습니다.'+sub('주소창의 🔒/카메라 아이콘 → 카메라 <b>허용</b> 후 다시 시작.<br>Windows: 설정 → 개인정보 → 카메라 → "앱이 카메라 액세스" 켜기.');
    case 'NotFoundError':  return '연결된 <b>카메라를 찾지 못했습니다.</b>'+sub('웹캠이 연결/활성화돼 있는지 확인해 주세요.');
    case 'NotReadableError': return '<b>다른 앱이 카메라를 사용 중</b>입니다.'+sub('Zoom · Teams · 카메라 앱 · 다른 탭 등을 모두 끄고 다시 시작해 주세요. (가장 흔한 원인)');
    case 'OverconstrainedError': return '카메라가 요청 설정을 지원하지 않습니다.'+sub('해상도를 낮춰 재시도했지만 실패했습니다: '+(e.constraint||''));
    case 'SecurityError':
    case 'NotSupportedError': return '보안 컨텍스트가 아니라 카메라를 못 엽니다.'+sub('https:// 또는 localhost 에서 열어야 합니다.');
    default: return '카메라를 열 수 없습니다.'+sub('['+(e.name||'Error')+'] '+(e.message||''));
  }
}

async function start(){
  startBtn.disabled=true;
  try{
    if(!poseLandmarker) await loadModel();
    setOverlay('카메라를 켜는 중…',true);
    stream = await openCamera();
    video.srcObject=stream;
    await video.play();
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    running=true;
    stopBtn.disabled=false;
    setStatus('인식 중',true);
    hideOverlay();
    loop();
  }catch(e){
    console.error(e);
    setOverlay(cameraErrorMsg(e)+'<br><br><button id="retryBtn" style="font-family:inherit;font-weight:600;font-size:13px;color:#05080d;background:var(--accent);border:none;padding:9px 18px;border-radius:10px;cursor:pointer">다시 시도</button>',false);
    document.getElementById('retryBtn')?.addEventListener('click',start);
    setStatus('오류'); startBtn.disabled=false;
  }
}

function stop(){
  running=false;
  if(raf) cancelAnimationFrame(raf);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  startBtn.disabled=false; stopBtn.disabled=true;
  setStatus('정지'); fpsEl.textContent='-- FPS';
  setOverlay('정지되었습니다. 다시 <b>시작</b>을 눌러 재개하세요.',false);
}

function loop(){
  if(!running) return;
  const now=performance.now();
  if(video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    const res=poseLandmarker.detectForVideo(video,now);
    const w=canvas.width, h=canvas.height;
    ctx.clearRect(0,0,w,h);
    if(res.landmarks){
      const lms=res.landmarks;
      const decorate = wingsChk.checked || particleChk.checked;
      const front = lms.map(facingFront);   // 각 사람이 카메라를 보는가(정면)
      // ① 정면인 사람의 날개 → 사람보다 뒤(등 뒤)
      if(wingsChk.checked) for(let i=0;i<lms.length;i++) if(front[i]) drawWings(lms[i]);
      if(particleChk.checked) for(const lm of lms) emitParticles(lm);
      stepParticles();
      // ② 인물(전경)을 마스크로 잘라 위에 덮음
      if(decorate){
        const person=buildPersonLayer(res.segmentationMasks,w,h);
        if(person) ctx.drawImage(person,0,0,w,h);
      }
      // ③ 뒤돌아선 사람의 날개 → 사람보다 앞(등이 카메라를 향하므로)
      if(wingsChk.checked) for(let i=0;i<lms.length;i++) if(!front[i]) drawWings(lms[i]);
      // ④ 골격 (맨 앞)
      if(skelChk.checked)
        for(const lm of res.landmarks){
          drawUtils.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,
            {color:getCss('--line'),lineWidth:4});
          drawUtils.drawLandmarks(lm,
            {color:getCss('--joint'),fillColor:getCss('--joint'),radius:5,lineWidth:1});
        }
      setStatus(res.landmarks.length>0?`인식 중 · ${res.landmarks.length}명`:'사람을 찾는 중',res.landmarks.length>0);
    }
  }
  // fps
  frames++;
  if(now-lastT>=500){ fps=Math.round(frames*1000/(now-lastT)); frames=0; lastT=now; fpsEl.textContent=fps+' FPS'; }
  raf=requestAnimationFrame(loop);
}

const cssCache={};
function getCss(v){ return cssCache[v] ?? (cssCache[v]=getComputedStyle(document.documentElement).getPropertyValue(v).trim()); }

/* ── 자동 날개 장착 ──────────────────────────────────────────────
   실제 날개 이미지(wing_white.png)를 어깨(11=왼,12=오른)에 맞춰
   부착·회전·펄럭이며 그린다. 로딩 전에는 벡터 날개로 폴백. */
const WING_AX=0.985, WING_AY=0.458, WING_K=1.55;  // 부착점(뿌리) + 크기(몸통길이 배수)

/* ── 파티클(불씨/빛가루) ── 어깨·날개 주변에서 피어올라 발광 */
let particles=[];
// 카메라를 정면으로 보는가? 어깨 좌우 순서로 판별(랜드마크는 원본영상 좌표).
// 실측: 정면일 때 lm11.x - lm12.x < 0, 뒤돌면 > 0. (옆모습 깜빡임 방지 히스테리시스)
let faceState=true;
function facingFront(lm){
  const L=lm[11], R=lm[12];
  if(!L||!R) return faceState;
  const d=L.x-R.x;
  if(d< -0.02) faceState=true;       // 정면 → 날개 등 뒤
  else if(d> 0.02) faceState=false;  // 후면 → 날개 앞
  return faceState;
}
// 어깨(11·12)+엉덩이(23·24)로 안정적인 부착점/크기 계산.
// 크기 기준을 몸통 길이로 → 몸을 좌우로 틀어도 날개가 붕괴하지 않음.
function poseFrame(lm){
  const w=canvas.width,h=canvas.height, L=lm[11],R=lm[12],Hl=lm[23],Hr=lm[24];
  if(!L||!R) return null;
  const lx=L.x*w,ly=L.y*h,rx=R.x*w,ry=R.y*h;
  const smx=(lx+rx)/2, smy=(ly+ry)/2;               // 어깨 중앙
  const shoulder=Math.hypot(lx-rx,ly-ry);
  let hmx,hmy;
  if(Hl&&Hr){ hmx=(Hl.x+Hr.x)/2*w; hmy=(Hl.y+Hr.y)/2*h; }
  else { hmx=smx; hmy=smy+shoulder*1.4; }
  const torso=Math.hypot(hmx-smx,hmy-smy);
  const scale=Math.max(torso, shoulder*1.1);        // 회전에 강한 크기 기준
  // 정면도(yaw): 어깨폭/몸통. 정면=1, 옆으로 틀수록 0 → 날개 가로 압축
  const frontal=Math.min(1,Math.max(0.12, shoulder/(0.62*(torso||1))));
  // 기울기: 어깨선이 아니라 '척추(어깨중앙→엉덩이중앙)' 기준 → 옆으로 돌아도 안 무너짐
  const ang=Math.atan2(smx-hmx, hmy-smy);           // 정면=0, 몸 기울면 그만큼
  const ax=smx+(hmx-smx)*0.18, ay=smy+(hmy-smy)*0.18; // 부착점: 등 위쪽
  const zL=(L.z==null?0:L.z), zR=(R.z==null?0:R.z);   // 어깨 깊이(음수=카메라쪽)
  const nose=lm[0]; const nx=(nose?nose.x*w:smx);
  const faceLeft = nx < smx-2;                        // 얼굴이 화면 왼쪽 → 등은 오른쪽
  return {ax,ay,scale,ang,shoulder,frontal,zL,zR,faceLeft};
}
function emitParticles(lm){
  const F=poseFrame(lm); if(!F||F.scale<10) return;
  const s=F.scale, ca=Math.cos(F.ang), sa=Math.sin(F.ang);
  const count=Math.min(3,Math.max(1,Math.round(s/90)));
  for(let i=0;i<count;i++){
    const side=Math.random()<0.5?-1:1, t=Math.random();
    const ox=side*(0.25+t*0.95)*s;                          // 좌우로 날개 폭만큼
    const oy=(0.1-t*0.5)*s+(Math.random()-0.5)*0.2*s;
    const px=F.ax+ox*ca-oy*sa, py=F.ay+ox*sa+oy*ca;
    const warm=Math.random()<0.55;
    particles.push({x:px,y:py,vx:(Math.random()-0.5)*0.5+side*0.12,vy:-0.4-Math.random()*1.1,
      life:1,decay:0.010+Math.random()*0.014,size:(0.6+Math.random()*1.5)*(s/300),warm});
  }
  if(particles.length>320) particles.splice(0,particles.length-320);
}
function stepParticles(){
  if(!particles.length) return;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy-=0.008; p.vx*=0.985; p.life-=p.decay;
    if(p.life<=0){ particles.splice(i,1); continue; }
    const a=Math.min(0.75,p.life*0.85), r=p.size*(1.1+(1-p.life)*1.3);
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2.5);
    if(p.warm){ g.addColorStop(0,`rgba(255,225,150,${a})`); g.addColorStop(.4,`rgba(255,140,40,${a*.4})`); g.addColorStop(1,'rgba(255,70,0,0)'); }
    else      { g.addColorStop(0,`rgba(215,245,255,${a})`); g.addColorStop(.4,`rgba(110,210,255,${a*.4})`); g.addColorStop(1,'rgba(70,170,255,0)'); }
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r*2.5,0,7); ctx.fill();
  }
  ctx.restore();
}
const wingImg=new Image(); let wingReady=false;
wingImg.onload=()=>{ wingReady=true; };
wingImg.src='wing_white.png';
// 머그샷 참고: 옆으로 틀면 쓰는 '프로필(측면)' 날개
const wingProf=new Image(); let profReady=false;
wingProf.onload=()=>{ profReady=true; };
wingProf.src='wing_profile.png';
const PROF_AX=0.454, PROF_AY=0.06, PROF_K=0.9;

let wingMode='spread';   // 'spread'(정면/후면) ↔ 'profile'(측면), 히스테리시스
function drawWings(lm){
  const L=lm[11], R=lm[12];
  if(!L||!R || (L.visibility!=null && L.visibility<0.3 && R.visibility<0.3)) return;
  const F=poseFrame(lm); if(!F || F.scale<10) return;
  const flap=Math.sin(performance.now()/260)*0.11;   // ±약6° 펄럭임
  // 얼마나 틀었나(정면도)로 모드 전환 — 깜빡임 방지 히스테리시스
  if(F.frontal < 0.34) wingMode='profile';
  else if(F.frontal > 0.52) wingMode='spread';

  ctx.save();
  ctx.translate(F.ax,F.ay);                 // 등 위쪽 부착점
  ctx.rotate(F.ang);                        // 몸 기울기
  if(wingMode==='profile' && profReady){
    // 측면: 한쪽 날개가 등 뒤로 드리움 (머그샷 PROFILE)
    const dw=F.scale*PROF_K, dh=dw*wingProf.height/wingProf.width;
    const axp=PROF_AX*dw, ayp=PROF_AY*dh;
    ctx.shadowColor='rgba(140,225,255,0.5)'; ctx.shadowBlur=F.scale*0.2;
    ctx.rotate(flap*0.4);                   // 살랑임
    if(!F.faceLeft) ctx.scale(-1,1);        // 얼굴이 오른쪽이면 좌우반전(등이 왼쪽)
    ctx.drawImage(wingProf, -axp, -ayp, dw, dh);
  } else if(wingReady){
    ctx.scale(F.frontal,1);                 // yaw: 살짝 틀면 가로 압축
    ctx.shadowColor='rgba(140,225,255,0.5)';
    ctx.shadowBlur=F.scale*0.2;
    const rightNear = F.zR < F.zL;          // 가까운 어깨 날개를 크게+위에 → 원근감
    const near=1.12, far=0.9;
    if(rightNear){
      wingBlit(F.scale*far ,false,flap);
      wingBlit(F.scale*near,true ,flap);
    }else{
      wingBlit(F.scale*far ,true ,flap);
      wingBlit(F.scale*near,false,flap);
    }
  }else{
    ctx.shadowColor='rgba(120,220,255,0.55)';
    ctx.shadowBlur=F.scale*0.3;
    const f=(Math.sin(performance.now()/230)+1)/2;
    drawOneWing(F.scale*1.9,F.scale,f, 1);
    drawOneWing(F.scale*1.9,F.scale,f,-1);
  }
  ctx.restore();
}

// 이미지 날개 한 장: 부착점을 원점에 두고 ±13° 벌려 그림
function wingBlit(scale,mirror,flap){
  const dw=scale*WING_K, dh=dw*wingImg.height/wingImg.width;
  const axp=WING_AX*dw, ayp=WING_AY*dh;
  const rot=(30*Math.PI/180)+flap;   // 어깨 위로 아치지게 벌림
  ctx.save();
  ctx.rotate(mirror? -rot : rot);
  ctx.scale(mirror? -1 : 1, 1);             // scale이 안쪽(먼저 적용)=뒤집고 나서 회전
  ctx.drawImage(wingImg, -axp, -ayp, dw, dh);
  ctx.restore();
}

function drawOneWing(span,shoulder,flap,dir){
  const feathers=8;
  const baseAngle=-0.12 - flap*0.55;        // 전체 각도(펄럭임에 따라 위로)
  const base=shoulder*0.14;                 // 등 쪽 시작점
  ctx.save();
  ctx.scale(dir,1);
  const grad=ctx.createLinearGradient(0,0,span,-span*0.5);
  grad.addColorStop(0,'rgba(255,255,255,0.96)');
  grad.addColorStop(0.6,'rgba(200,245,255,0.7)');
  grad.addColorStop(1,'rgba(110,215,255,0.18)');
  for(let i=0;i<feathers;i++){
    const t=i/(feathers-1);
    const len=span*(0.5+0.5*Math.sin(t*Math.PI));   // 가운데 깃털이 가장 김
    const a=baseAngle - t*0.95;                       // 위·뒤로 부채꼴
    const fx=base+Math.cos(a)*len, fy=Math.sin(a)*len;
    const wid=span*0.11*(0.55+0.45*Math.sin(t*Math.PI));
    const nx=-Math.sin(a), ny=Math.cos(a);            // 깃털 폭 방향
    ctx.beginPath();
    ctx.moveTo(base,0);
    ctx.quadraticCurveTo((base+fx)/2 + nx*wid,(0+fy)/2 + ny*wid, fx,fy);
    ctx.quadraticCurveTo((base+fx)/2 - nx*wid,(0+fy)/2 - ny*wid, base,0);
    ctx.closePath();
    ctx.fillStyle=grad; ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.restore();
}

mirrorChk.addEventListener('change',()=>{
  const t = mirrorChk.checked?'scaleX(-1)':'none';
  video.style.transform=t; canvas.style.transform=t;
});
videoChk.addEventListener('change',()=>{ video.style.opacity=videoChk.checked?'1':'0'; });

startBtn.addEventListener('click',start);
stopBtn.addEventListener('click',stop);
</script>
