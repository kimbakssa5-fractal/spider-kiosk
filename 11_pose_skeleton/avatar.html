<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pose Avatar — 포즈 동기화 아바타</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#070b12; --text:#e8eef5; --muted:#8a99ab; --accent:#38e0ff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans KR',sans-serif;background:radial-gradient(1200px 800px at 50% -10%,#10202e 0%,var(--bg) 60%);
    color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
  header{text-align:center;padding:20px 16px 6px}
  header h1{font-weight:700;font-size:clamp(20px,4vw,30px);letter-spacing:-.5px}
  header h1 span{color:var(--accent)}
  header p{color:var(--muted);font-weight:300;font-size:14px;margin-top:6px}
  .stage{position:relative;width:min(94vw,900px);aspect-ratio:16/10;margin:14px 0;border-radius:16px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%,#0c1622 0%,#05080d 70%);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05) inset}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{transform:scaleX(-1);opacity:0;transition:opacity .3s}
  canvas{transform:scaleX(-1)}
  .badge{position:absolute;top:12px;left:12px;z-index:6;display:flex;gap:8px;align-items:center;
    background:rgba(20,26,36,.72);backdrop-filter:blur(8px);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid rgba(255,255,255,.08)}
  .dot{width:8px;height:8px;border-radius:50%;background:#ff4040}
  .dot.live{background:#28e07a;box-shadow:0 0 10px #28e07a}
  .fps{position:absolute;top:12px;right:12px;z-index:6;background:rgba(20,26,36,.72);backdrop-filter:blur(8px);
    padding:7px 12px;border-radius:999px;font-size:12px;font-variant-numeric:tabular-nums;border:1px solid rgba(255,255,255,.08)}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px;
    background:rgba(5,8,13,.82);backdrop-filter:blur(4px);z-index:5;transition:opacity .4s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
  button{font-family:inherit;font-weight:500;font-size:14px;color:var(--text);background:rgba(20,26,36,.72);border:1px solid rgba(255,255,255,.12);
    padding:11px 20px;border-radius:12px;cursor:pointer;transition:.18s;backdrop-filter:blur(8px)}
  button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  button.primary{background:var(--accent);color:#05080d;border-color:var(--accent);font-weight:700}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 4px}
  .toggle input{width:38px;height:20px;appearance:none;background:#2a3442;border-radius:999px;position:relative;cursor:pointer;transition:.2s}
  .toggle input:checked{background:var(--accent)}
  .toggle input::after{content:"";position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
  .toggle input:checked::after{left:20px}
  footer{color:var(--muted);font-size:12px;font-weight:300;padding:10px 16px 26px;text-align:center;line-height:1.7}
</style>
</head>
<body>
  <header>
    <h1><span>◈</span> 포즈 동기화 <span>아바타</span></h1>
    <p>웹캠 앞에서 움직이면 아바타가 당신을 그대로 따라 합니다 · MediaPipe Pose</p>
  </header>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="badge"><span class="dot" id="dot"></span><span id="statusText">대기 중</span></div>
    <div class="fps" id="fps">-- FPS</div>
    <div class="overlay" id="overlay">
      <div class="spinner" id="spinner" style="display:none"></div>
      <div id="overlayMsg" style="max-width:420px;line-height:1.7">
        <strong style="font-size:18px">포즈를 따라 하는 아바타</strong><br>
        <span style="color:var(--muted);font-weight:300;font-size:14px">아래 <b>시작</b>을 누르고 카메라를 허용하세요.<br>전신이 화면에 들어올수록 자연스럽습니다.</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">▶ 시작</button>
    <button id="stopBtn" disabled>■ 정지</button>
    <label class="toggle"><input type="checkbox" id="mirrorChk" checked>거울 모드</label>
    <label class="toggle"><input type="checkbox" id="ghostChk">웹캠 비침</label>
    <label class="toggle"><input type="checkbox" id="hueChk">색상 순환</label>
  </div>

  <footer>
    모든 처리는 <b>브라우저 안에서</b> 실행됩니다 — 영상은 서버로 전송되지 않습니다. &nbsp;|&nbsp; 권장: Chrome / Edge
  </footer>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'), spinner=document.getElementById('spinner'), omsg=document.getElementById('overlayMsg');
const startBtn=document.getElementById('startBtn'), stopBtn=document.getElementById('stopBtn');
const mirrorChk=document.getElementById('mirrorChk'), ghostChk=document.getElementById('ghostChk'), hueChk=document.getElementById('hueChk');
const dot=document.getElementById('dot'), statusText=document.getElementById('statusText'), fpsEl=document.getElementById('fps');

let poseLandmarker=null, running=false, stream=null, raf=null;
let lastVideoTime=-1, lastT=performance.now(), frames=0, fpsV=0, frameDt=0.016, tLast=performance.now();

function setOverlay(html,sp){ omsg.innerHTML=html; spinner.style.display=sp?'block':'none'; overlay.classList.remove('hidden'); }
function hideOverlay(){ overlay.classList.add('hidden'); }
function setStatus(t,live){ statusText.textContent=t; dot.classList.toggle('live',!!live); }

async function loadModel(){
  setOverlay('AI 모델을 불러오는 중…<br><span style="color:var(--muted);font-weight:300;font-size:13px">최초 1회만 로드됩니다</span>',true);
  const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  poseLandmarker=await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",delegate:"GPU"},
    runningMode:"VIDEO", numPoses:1, minPoseDetectionConfidence:0.5, minPosePresenceConfidence:0.5, minTrackingConfidence:0.5
  });
}
async function openCamera(){
  if(!navigator.mediaDevices?.getUserMedia) throw new DOMException('카메라 API 사용 불가 (HTTPS 필요).','NotSupportedError');
  const tries=[{video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false},{video:{width:{ideal:640},height:{ideal:480}},audio:false},{video:true,audio:false}];
  let last=null;
  for(const c of tries){ try{ return await navigator.mediaDevices.getUserMedia(c); }catch(e){ last=e; if(['NotAllowedError','NotFoundError','NotReadableError','SecurityError'].includes(e.name)) throw e; } }
  throw last;
}
function camMsg(e){
  const s=t=>'<br><span style="color:var(--muted);font-weight:300;font-size:13px">'+t+'</span>';
  switch(e.name){
    case 'NotAllowedError': return '카메라 접근이 <b>차단</b>되어 있습니다.'+s('주소창의 카메라 아이콘 → 허용 / Windows 설정 → 개인정보 → 카메라 확인');
    case 'NotFoundError': return '<b>카메라를 찾지 못했습니다.</b>'+s('웹캠 연결을 확인하세요.');
    case 'NotReadableError': return '<b>다른 앱이 카메라 사용 중</b>입니다.'+s('Zoom·Teams·카메라 앱·다른 탭을 모두 끄고 다시 시작.');
    default: return '카메라를 열 수 없습니다.'+s('['+(e.name||'Error')+'] '+(e.message||''));
  }
}

async function start(){
  startBtn.disabled=true;
  try{
    if(!poseLandmarker) await loadModel();
    setOverlay('카메라를 켜는 중…',true);
    stream=await openCamera(); video.srcObject=stream; await video.play();
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    running=true; stopBtn.disabled=false; setStatus('동기화 중',true); hideOverlay(); tLast=performance.now(); loop();
  }catch(e){
    console.error(e);
    setOverlay(camMsg(e)+'<br><br><button id="rb" style="font-family:inherit;font-weight:600;font-size:13px;color:#05080d;background:var(--accent);border:none;padding:9px 18px;border-radius:10px;cursor:pointer">다시 시도</button>',false);
    document.getElementById('rb')?.addEventListener('click',start); setStatus('오류'); startBtn.disabled=false;
  }
}
function stop(){
  running=false; if(raf) cancelAnimationFrame(raf);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null; ctx.clearRect(0,0,canvas.width,canvas.height);
  startBtn.disabled=false; stopBtn.disabled=true; setStatus('정지'); fpsEl.textContent='-- FPS';
  setOverlay('정지되었습니다. 다시 <b>시작</b>을 누르세요.',false);
}

// ── 시간 기반 스무딩(지터 제거, 빠른 동작엔 즉각) ──
const SM={}; let lostFrames=0;
function smooth(lm){
  const w=canvas.width,h=canvas.height, P=new Array(33);
  for(let i=0;i<lm.length;i++){
    const tx=lm[i].x*w, ty=lm[i].y*h, tv=lm[i].visibility==null?1:lm[i].visibility;
    let s=SM[i]; if(!s){ s=SM[i]={x:tx,y:ty,v:tv}; }
    const dx=tx-s.x, dy=ty-s.y, sp=Math.hypot(dx,dy);
    const rate=7+Math.min(55, sp*0.55);           // 빠를수록 더 빨리 추종
    const a=1-Math.exp(-frameDt*rate);
    s.x+=dx*a; s.y+=dy*a; s.v+=(tv-s.v)*(1-Math.exp(-frameDt*9));
    P[i]={x:s.x,y:s.y,v:s.v};
  }
  return P;
}

// ── 귀여운 마스코트 아바타 ──
let hue=14;                 // 몸통 색상(코랄). 색상순환 토글로 회전
function scaleOf(P){
  const sm={x:(P[11].x+P[12].x)/2,y:(P[11].y+P[12].y)/2};
  const hp={x:(P[23].x+P[24].x)/2,y:(P[23].y+P[24].y)/2};
  const torso=Math.hypot(sm.x-hp.x,sm.y-hp.y);
  const sh=Math.hypot(P[11].x-P[12].x,P[11].y-P[12].y);
  return Math.max(torso, sh*1.1, 40);
}
function vis(P,i){ return P[i]&&P[i].v>0.35; }
function mid(A,B){ return {x:(A.x+B.x)/2,y:(A.y+B.y)/2}; }

const OUTLINE='rgba(60,40,44,0.92)';
// 눈 깜빡임/표정 상태
let blinkT=0, nextBlink=2.2;

// 팔/다리 실루엣 그리기(a→중간→b, 라운드). mode:'out'=아웃라인 두껍게 / 'fill'=색 채움
function limbPass(P,a,b,c,w,O,mode,col){
  if(!vis(P,a)||!vis(P,c)) return;
  const A=P[a], B=vis(P,b)?P[b]:mid(P[a],P[c]), C=P[c];
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle = mode==='out'?OUTLINE:col;
  ctx.lineWidth = mode==='out'? w+O*2 : w;
  ctx.beginPath(); ctx.moveTo(A.x,A.y);
  ctx.quadraticCurveTo(B.x,B.y, C.x,C.y); ctx.stroke();
}
function blob(cx,cy,rx,ry,rot,O,mode,col){
  ctx.fillStyle = mode==='out'?OUTLINE:col;
  ctx.beginPath(); ctx.ellipse(cx,cy,rx+(mode==='out'?O:0),ry+(mode==='out'?O:0),rot,0,6.2832); ctx.fill();
}

function drawAvatar(P){
  const S=scaleOf(P);
  const sm=mid(P[11],P[12]), hp=mid(P[23],P[24]);
  const bodyC=`hsl(${hue},85%,64%)`, bodyD=`hsl(${hue},70%,54%)`;
  const CREAM='#ffe9d6', SHOE='#5b4636', BLUSH='#ff8f7d', INK='#3a2b2c';
  const O=Math.max(3,S*0.045);                       // 아웃라인 두께
  const spineAng=Math.atan2(sm.x-hp.x, hp.y-sm.y);   // 척추 기울기(직립=0, 머리 기울임용)

  // 몸통 중심/치수(통통한 콩 모양)
  const bodyMid=mid(sm,hp);
  const bodyLen=Math.hypot(sm.x-hp.x,sm.y-hp.y);
  const bodyW=S*0.62;
  const bodyRot=Math.atan2(hp.y-sm.y,hp.x-sm.x)-Math.PI/2;

  // 머리(큰 원)
  let hc;
  if(vis(P,7)&&vis(P,8)) hc=mid(P[7],P[8]);
  else if(vis(P,0)) hc={x:P[0].x,y:P[0].y};
  else hc={x:sm.x,y:sm.y-S*0.5};
  const hr=S*0.56;                                   // 큰 머리(치비 비율)
  hc={x:hc.x, y:hc.y - S*0.10};                      // 살짝 위로

  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';

  // 바닥 그림자
  const feetY=Math.max(vis(P,27)?P[27].y:0, vis(P,28)?P[28].y:0)||hp.y+S;
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(hp.x,feetY+S*0.08,S*0.62,S*0.15,0,0,6.2832); ctx.fill();

  // 부드러운 드롭섀도(스티커 느낌)
  ctx.shadowColor='rgba(20,10,15,0.28)'; ctx.shadowBlur=S*0.14; ctx.shadowOffsetY=S*0.05;

  // ===== 아웃라인 패스(어두운 실루엣) =====
  for(const [a,b,c] of [[23,25,27],[24,26,28]]) limbPass(P,a,b,c,S*0.19,O,'out');   // 다리
  for(const i of [27,28]) if(vis(P,i)) blob(P[i].x,P[i].y+S*0.02,S*0.14,S*0.10,0,O,'out',0); // 발
  for(const [a,b,c] of [[11,13,15],[12,14,16]]) limbPass(P,a,b,c,S*0.16,O,'out');   // 팔
  for(const i of [15,16]) if(vis(P,i)) blob(P[i].x,P[i].y,S*0.12,S*0.12,0,O,'out',0); // 손
  blob(bodyMid.x,bodyMid.y,bodyW/2,bodyLen/2+bodyW*0.35,bodyRot,O,'out',0);          // 몸통
  blob(hc.x,hc.y,hr,hr,0,O,'out',0);                                                 // 머리
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;

  // ===== 색 채움 패스 =====
  for(const [a,b,c] of [[23,25,27],[24,26,28]]) limbPass(P,a,b,c,S*0.19,O,'fill',bodyD);
  for(const i of [27,28]) if(vis(P,i)) blob(P[i].x,P[i].y+S*0.02,S*0.14,S*0.10,0,O,'fill',SHOE);
  for(const [a,b,c] of [[11,13,15],[12,14,16]]) limbPass(P,a,b,c,S*0.16,O,'fill',bodyC);
  for(const i of [15,16]) if(vis(P,i)) blob(P[i].x,P[i].y,S*0.12,S*0.12,0,O,'fill',CREAM);
  blob(bodyMid.x,bodyMid.y,bodyW/2,bodyLen/2+bodyW*0.35,bodyRot,O,'fill',bodyC);
  // 배 하이라이트
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(bodyMid.x,bodyMid.y+bodyLen*0.05,bodyW*0.28,bodyLen*0.28,bodyRot,0,6.2832); ctx.fill();
  // 머리
  blob(hc.x,hc.y,hr,hr,0,O,'fill',CREAM);

  // ===== 얼굴 =====
  // 시선: 두 손목 평균 쪽을 본다
  let look={x:0,y:0.1};
  const ws=[P[15],P[16]].filter((_,i)=>vis(P,15+i));
  if(ws.length){ const wc=ws.length===2?mid(P[15],P[16]):ws[0]; const dx=wc.x-hc.x, dy=wc.y-hc.y; const d=Math.hypot(dx,dy)||1; look={x:dx/d,y:dy/d}; }
  ctx.save();
  ctx.translate(hc.x,hc.y); ctx.rotate(spineAng*0.5);
  const eyeDX=hr*0.4, eyeY=-hr*0.05, eyeR=hr*0.24, pupR=hr*0.15;
  const excited = (armRaiseLite(P))>0.5;
  // 깜빡임
  blinkT+=frameDt; const blinking = blinkT>nextBlink && blinkT<nextBlink+0.12;
  if(blinkT>nextBlink+0.12){ nextBlink=blinkT+1.6+Math.random()*2.4; }
  for(const sgn of [-1,1]){
    const ex=sgn*eyeDX;
    if(blinking){ ctx.strokeStyle=INK; ctx.lineWidth=hr*0.08; ctx.beginPath(); ctx.moveTo(ex-eyeR*0.7,eyeY); ctx.quadraticCurveTo(ex,eyeY+eyeR*0.5,ex+eyeR*0.7,eyeY); ctx.stroke(); }
    else{
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(ex,eyeY,eyeR*0.8,eyeR,0,0,6.2832); ctx.fill();
      ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(ex+look.x*eyeR*0.35, eyeY+look.y*eyeR*0.35, pupR,0,6.2832); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(ex+look.x*eyeR*0.35-pupR*0.3, eyeY+look.y*eyeR*0.35-pupR*0.35, pupR*0.35,0,6.2832); ctx.fill();
    }
  }
  // 볼터치
  ctx.fillStyle=BLUSH; ctx.globalAlpha=0.8;
  for(const sgn of [-1,1]){ ctx.beginPath(); ctx.ellipse(sgn*hr*0.62, hr*0.28, hr*0.16, hr*0.11,0,0,6.2832); ctx.fill(); }
  ctx.globalAlpha=1;
  // 입
  ctx.strokeStyle=INK; ctx.lineWidth=hr*0.07; ctx.lineCap='round';
  if(excited){ ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(0,hr*0.42,hr*0.16,hr*0.2,0,0,Math.PI); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(-hr*0.16,hr*0.36); ctx.quadraticCurveTo(0,hr*0.5, hr*0.16,hr*0.36); ctx.stroke(); }
  // 앞머리 곱슬(장식)
  ctx.fillStyle=bodyC; ctx.beginPath(); ctx.arc(0,-hr*0.92,hr*0.16,0,6.2832); ctx.fill();
  ctx.strokeStyle=OUTLINE; ctx.lineWidth=O; ctx.beginPath(); ctx.arc(0,-hr*0.92,hr*0.16,0,6.2832); ctx.stroke();
  ctx.restore();

  ctx.restore();
}
// 얼굴 표정용 가벼운 팔들기 감지
function armRaiseLite(P){
  if(!vis(P,11)||!vis(P,12)) return 0;
  const sy=(P[11].y+P[12].y)/2; let up=0;
  if(vis(P,15)&&P[15].y<sy) up++; if(vis(P,16)&&P[16].y<sy) up++;
  return up/2;
}

function loop(){
  if(!running) return;
  const now=performance.now();
  frameDt=Math.min(0.05,(now-tLast)/1000); tLast=now;
  if(video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    const res=poseLandmarker.detectForVideo(video,now);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(hueChk.checked) hue=(hue+frameDt*40)%360;
    const lm=res.landmarks&&res.landmarks[0];
    if(lm){
      lostFrames=0;
      const P=smooth(lm);
      drawAvatar(P);
      setStatus('동기화 중',true);
    }else{
      if(++lostFrames>30){ for(const k in SM) delete SM[k]; }  // 오래 놓치면 리셋
      setStatus('사람을 찾는 중',false);
    }
  }
  frames++;
  if(now-lastT>=500){ fpsV=Math.round(frames*1000/(now-lastT)); frames=0; lastT=now; fpsEl.textContent=fpsV+' FPS'; }
  raf=requestAnimationFrame(loop);
}

mirrorChk.addEventListener('change',()=>{ const t=mirrorChk.checked?'scaleX(-1)':'none'; video.style.transform=t; canvas.style.transform=t; });
ghostChk.addEventListener('change',()=>{ video.style.opacity=ghostChk.checked?'0.28':'0'; });
startBtn.addEventListener('click',start);
stopBtn.addEventListener('click',stop);
</script>
