<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>물결 Trace</title>
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- 우측 상단 구석 빈곳: 누르면 메뉴 토글 -->
  <div id="menuHotspot" title="메뉴"></div>

  <div id="fps" class="hidden">FPS --</div>

  <!-- 중앙 터치 유도 (잔잔히 물결치며 터치 유도) -->
  <div id="hint" class="icon-off">
    <div class="tap">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <svg class="hand" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z"/>
      </svg>
    </div>
  </div>

  <div id="toolbar" class="hidden">
    <label class="btn" for="bgInput">Background image</label>
    <input type="file" id="bgInput" accept="image/*" hidden>
    <button id="soundBtn" class="btn">Sound (S)</button>
    <label class="btn slider-wrap" title="물소리 볼륨 ( [ 작게 / ] 크게 )">물소리&nbsp;<input id="splashVolSlider" type="range" min="0" max="100" value="10"></label>
    <button id="camBtn" class="btn">Camera (C)</button>
    <button id="fishMinusBtn" class="btn">Fish &minus; (9)</button>
    <button id="fishPlusBtn" class="btn">Fish + (0)</button>
    <label class="btn slider-wrap" title="카메라 센싱 민감도 (왼쪽=매우 둔감/프로젝터 오작동 방지, 오른쪽=매우 예민)">Cam&nbsp;<input id="sensSlider" type="range" min="0" max="100" value="35"></label>
    <button id="videoBgBtn" class="btn">Video bg (V)</button>
    <button id="groupBtn" class="btn">Transform (T)</button>
    <button id="glitterBtn" class="btn">윤슬 ON (Y)</button>
    <label class="btn slider-wrap" title="윤슬 강도">윤슬&nbsp;<input id="glitterSlider" type="range" min="0" max="100" value="50"></label>
    <button id="kbdBtn" class="btn">⌨ Shortcut (K)</button>
    <button id="fsBtn" class="btn">Full screen (F)</button>
    <button id="hideBtn" class="btn">Menu (M)</button>
  </div>

  <!-- 가상 키보드(K 토글): 버튼이 키 입력을 발생시켜 모든 단축키를 터치로 사용 -->
  <div id="vkbd" class="hidden"></div>

  <!-- 단축키 모음 도움말(H 토글) -->
  <div id="help" class="hidden"></div>

  <audio id="ambient" src="assets/ambient.mp3" loop preload="auto"></audio>

  <!-- 첫 진입 비밀번호 게이트 (임시 배포용). 비번 변경 시 기존 체험자 자동 무효화. -->
  <div id="gate">
    <div class="gate-card">
      <div class="gate-title">비밀번호 4자리</div>
      <div class="gate-dots"><span></span><span></span><span></span><span></span></div>
      <div class="gate-keys">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <span></span><button data-k="0">0</button><button data-k="del">&#9003;</button>
      </div>
      <div class="gate-msg"></div>
    </div>
  </div>
  <script>
  (function () {
    function _todayStr(){var d=new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');} function _dayCode(){var d=new Date();var m=String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');return m.split('').map(function(c){return(+c+1)%10;}).join('');} function _instantOK(){try{return new URLSearchParams(location.search).get('g')==='ins';}catch(e){return false;}}               // ← 임시 비밀번호(4자리). 바꾸면 기존 체험자 무효화됨.
    var KEY = "kiosk_daily";        // 통과 기록(입력 비번 저장 → CODE 와 일치해야 통과)
    var gate = document.getElementById("gate");
    if (localStorage.getItem(KEY) === _todayStr() || _instantOK()) { gate.remove(); return; }
    var entry = "";
    var dots = gate.querySelectorAll(".gate-dots span");
    var msg = gate.querySelector(".gate-msg");
    function render() { for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < entry.length); }
    function check() {
      if (entry.length < 4) return;
      if (entry === _dayCode()) {
        try { localStorage.setItem(KEY, _todayStr()); } catch (e) {}
        gate.classList.add("ok");
        // 비번 통과(진짜 제스처) 순간 전체화면 진입 — setTimeout/합성키로는 막힘
        try { var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); } catch (e) {}
        setTimeout(function () { if (gate.parentNode) gate.remove(); }, 350);
      } else {
        gate.classList.add("err"); msg.textContent = "비밀번호가 틀렸습니다";
        setTimeout(function () { gate.classList.remove("err"); msg.textContent = ""; entry = ""; render(); }, 550);
      }
    }
    function press(k) {
      if (k === "del") entry = entry.slice(0, -1);
      else if (entry.length < 4) entry += k;
      render(); check();
    }
    var keys = gate.querySelectorAll(".gate-keys button");
    for (var i = 0; i < keys.length; i++) {
      keys[i].addEventListener("click", function () { press(this.getAttribute("data-k")); });
    }
    window.addEventListener("keydown", function (e) {
      if (!gate.parentNode) return;
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === "Backspace") press("del");
    });
    render();
  })();
  </script>

  <script src="app.js?v=94"></script>
</body>
</html>
