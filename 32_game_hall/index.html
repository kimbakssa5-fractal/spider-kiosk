<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>두더지 게임 · 드라큘라 편</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a3b36;
    --ink-soft:#8a746c;
    --accent:#e8604c;
    --accent-deep:#c94a38;
    --cream:#fff8f3;
    --pink:#fdeae4;
    --teal:#5b8f8a;
    --blue:#4a90d9;
    --good:#57a773;
    --gold:#e8a13c;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--cream); }
  body{ font-family:'Noto Sans KR','Malgun Gothic',sans-serif; color:var(--ink); }

  /* ===== 1920x1080 stage, scaled to fit ===== */
  #stage{
    position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center; overflow:hidden;
    background:
      radial-gradient(1200px 700px at 50% -10%, #fff3ea 0%, transparent 60%),
      radial-gradient(900px 600px at 8% 108%, #fdeade 0%, transparent 55%),
      radial-gradient(900px 600px at 92% 108%, #fce4dc 0%, transparent 55%),
      linear-gradient(180deg, #fffaf5 0%, #fdeee6 100%);
  }
  /* soft confetti dots */
  #stage::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(circle 7px at 6% 22%, #f6c7bb 99%, transparent),
      radial-gradient(circle 5px at 13% 74%, #b9d8d4 99%, transparent),
      radial-gradient(circle 6px at 90% 30%, #f3d9a7 99%, transparent),
      radial-gradient(circle 5px at 95% 78%, #f0b9ac 99%, transparent),
      radial-gradient(circle 4px at 27% 12%, #c6cdea 99%, transparent),
      radial-gradient(circle 4px at 78% 10%, #bcd9c4 99%, transparent),
      radial-gradient(circle 5px at 45% 90%, #f6c7bb 99%, transparent);
    opacity:.8;
  }

  /* ===== soft theme decor ===== */
  .decor{ position:absolute; pointer-events:none; }
  #moon{ width:150px; right:70px; top:44px; opacity:.9; }
  #castle{ width:340px; left:-20px; bottom:-14px; opacity:.9; }
  .bat{ position:absolute; pointer-events:none; animation:batFly linear infinite; opacity:.85; }
  @keyframes batFly{
    0%{ transform:translate(0,0) }
    25%{ transform:translate(70px,-18px) scale(.95) }
    50%{ transform:translate(140px,8px) scale(1.03) }
    75%{ transform:translate(70px,22px) }
    100%{ transform:translate(0,0) }
  }
  #bigBat{ animation:batSwim ease-in-out infinite; opacity:.95; }
  @keyframes batSwim{
    0%  { transform:translate(0,0) rotate(-6deg); }
    22% { transform:translate(120px,-70px) rotate(4deg) scale(1.05); }
    45% { transform:translate(230px,-20px) rotate(8deg) scale(.96); }
    68% { transform:translate(130px,55px) rotate(-3deg) scale(1.02); }
    100%{ transform:translate(0,0) rotate(-6deg); }
  }

  /* ===== header ===== */
  header{ position:absolute; left:0; right:0; top:0; text-align:center; padding-top:30px; z-index:3; }
  .h-tag{
    display:inline-block; font-size:21px; font-weight:500; letter-spacing:.14em;
    color:#fff; background:var(--accent); border-radius:999px; padding:6px 28px 9px;
    box-shadow:0 4px 14px rgba(232,96,76,.35); margin-bottom:14px;
  }
  h1{ line-height:0; margin-top:18px; }
  h1 img{ height:84px; }
  .h-en{ margin-top:12px; font-size:18px; font-weight:500; letter-spacing:.8em; text-indent:.8em; color:var(--ink-soft); }

  /* ===== rules bubble (white, 31-style) ===== */
  #rules{
    position:absolute; right:20px; top:200px; z-index:5; text-align:center;
    background:#fff; border-radius:26px; padding:20px 34px 22px;
    font-size:22px; font-weight:700; line-height:1.65;
    box-shadow:0 12px 30px rgba(90,60,50,.13);
  }
  #rules::after{
    content:''; position:absolute; left:48px; bottom:-14px; width:26px; height:26px;
    background:#fff; border-radius:0 0 6px 0;
    transform:rotate(45deg);
    box-shadow:8px 8px 16px rgba(90,60,50,.08);
  }
  #rules .r1{ color:var(--accent-deep); }
  #rules .r2{ color:var(--blue); }

  /* ===== board: white panel + 16 perfect-circle holes ===== */
  #board{
    position:absolute; left:430px; top:196px;
    width:1060px; height:660px; z-index:4;
    display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
    padding:36px 44px;
  }
  .cell{ position:relative; cursor:pointer; }
  .hole, .holeFront{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:118px; height:118px; border-radius:50%;
    background:radial-gradient(circle at 44% 34%, #5c4a42 0%, #453630 48%, #32261f 100%);
  }
  .hole{
    box-shadow:inset 0 10px 18px rgba(30,15,8,.55), inset 0 -4px 8px rgba(255,235,220,.12),
      0 6px 0 -2px rgba(74,59,54,.22),
      0 12px 22px rgba(90,60,50,.22);
  }
  .holeFront{                       /* bottom half redrawn above the mole */
    z-index:3; pointer-events:none;
    clip-path:inset(50% 0 0 0);
    box-shadow:inset 0 -6px 10px rgba(255,235,220,.14);
  }
  .popWrap{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-100%);
    width:150px; height:168px; overflow:hidden; pointer-events:none; z-index:2;
    /* 하부 절단선을 0까지 투명 그라데이션으로 융화 */
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 74%,transparent 99%);
    mask-image:linear-gradient(180deg,#000 0%,#000 74%,transparent 99%);
  }
  .mole{
    position:absolute; left:50%; bottom:-16px; width:108px; height:108px;
    transform:translateX(-50%) translateY(115%);
    transition:transform .18s cubic-bezier(.2,.9,.3,1.2);
    pointer-events:none;      /* 터치는 셀 전체(243×147)가 받는다 */
  }
  .mole img{ width:100%; height:100%; object-fit:contain; pointer-events:none;
    filter:drop-shadow(0 6px 8px rgba(90,60,50,.35)); }
  .mole.up  { transform:translateX(-50%) translateY(0); }
  .mole.hit { transition:transform .28s ease-in; transform:translateX(-50%) translateY(10%) scale(.08) rotate(320deg); }
  .mole.oops{ animation:shake .3s; }
  @keyframes shake{ 0%,100%{transform:translateX(-50%) translateY(0)} 25%{transform:translateX(-62%) translateY(0)} 75%{transform:translateX(-38%) translateY(0)} }

  .burst{ position:absolute; left:50%; top:40%; width:12px; height:12px; border-radius:50%; pointer-events:none;
    animation:burst .45s ease-out forwards; }
  @keyframes burst{ from{transform:translate(-50%,-50%) scale(.4); opacity:1} to{transform:translate(-50%,-50%) scale(8); opacity:0} }

  .floatScore{
    position:absolute; left:50%; top:2%; transform:translateX(-50%); z-index:20; pointer-events:none;
    font-weight:900; font-size:42px; text-shadow:0 2px 0 #fff;
    animation:floatUp .8s ease-out forwards;
  }
  @keyframes floatUp{ from{transform:translate(-50%,0); opacity:1} to{transform:translate(-50%,-80px); opacity:0} }

  /* ===== right HUD (31-style white cards) ===== */
  #panel{ position:absolute; right:20px; top:392px; width:400px; z-index:6; text-align:center; }
  .pbox{
    background:#fff; border-radius:26px; padding:14px 10px 18px; margin-bottom:20px;
    box-shadow:0 12px 30px rgba(90,60,50,.13);
  }
  .pbox .lbl{ font-size:19px; font-weight:700; letter-spacing:.3em; text-indent:.3em; color:var(--ink-soft); }
  #score{ font-size:66px; font-weight:900; color:var(--accent); line-height:1.12; }
  #time { font-size:66px; font-weight:900; color:var(--blue); line-height:1.12; }
  #time.hurry{ color:var(--accent-deep); animation:pulse .5s infinite alternate; }
  @keyframes pulse{ from{transform:scale(1)} to{transform:scale(1.1)} }
  #timeBox.hurry{ background:#fdeae4; animation:cardShake .45s infinite; box-shadow:0 12px 30px rgba(232,96,76,.35); }
  @keyframes cardShake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  /* 종료 임박: 화면 가장자리 붉은 맥동 */
  #urgent{ position:absolute; inset:0; pointer-events:none; z-index:25; opacity:0;
    box-shadow:inset 0 0 220px rgba(232,96,76,.55); }
  #urgent.on{ animation:urgentPulse 1s ease-in-out infinite; }
  @keyframes urgentPulse{ 0%,100%{opacity:.12} 50%{opacity:1} }
  #best { font-size:36px; font-weight:900; color:var(--good); line-height:1.25; }
  #bestBox{ background:none; box-shadow:none; }

  #startBtn{
    margin-top:42px; border:none; cursor:pointer; font-family:inherit;
    font-size:40px; font-weight:900; color:#fff; letter-spacing:.12em; text-indent:.12em;
    background:linear-gradient(160deg,#f07a5e,var(--accent-deep));
    border-radius:999px; padding:24px 74px 27px;
    box-shadow:0 10px 28px rgba(232,96,76,.5);
    animation:joinblink 1.8s ease-in-out infinite;
    transition:transform .1s;
  }
  /* 진동 버스트(0~30%) 후 숨쉬기 펄스 — 시작 버튼 존재감 강조 */
  @keyframes joinblink{
    0%  { transform:scale(1) rotate(0deg);    box-shadow:0 10px 28px rgba(232,96,76,.5); }
    5%  { transform:scale(1.05) rotate(-5deg); }
    10% { transform:scale(1.06) rotate(5deg); }
    15% { transform:scale(1.06) rotate(-4deg); }
    20% { transform:scale(1.05) rotate(4deg); }
    25% { transform:scale(1.04) rotate(-2deg); }
    30% { transform:scale(1.02) rotate(0deg); }
    60% { transform:scale(1.09) rotate(0deg); box-shadow:0 16px 44px rgba(232,96,76,.9); }
    100%{ transform:scale(1) rotate(0deg);    box-shadow:0 10px 28px rgba(232,96,76,.5); }
  }
  #startBtn:active{ transform:scale(.94); }
  #startBtn.playing{ /* 게임 중: '다시 시작' — 차분한 보조 톤, 블링크 정지 */
    animation:none;
    background:linear-gradient(160deg,#a08a80,#8a746c);
    box-shadow:0 8px 20px rgba(90,60,50,.3);
  }

  /* ===== legend (white cards, colored badges) ===== */
  #legend{
    position:absolute; left:0; right:0; bottom:76px; z-index:5;
    display:flex; align-items:flex-end; justify-content:center; gap:36px;
  }
  .lgGroup{
    display:flex; align-items:center; gap:30px;
    background:#fff; border-radius:30px; padding:18px 38px;
    box-shadow:0 12px 30px rgba(90,60,50,.13);
  }
  .lgHead{
    font-size:24px; font-weight:900; color:#fff; border-radius:999px; padding:10px 28px 12px; white-space:nowrap;
  }
  .lgGroup.bad  .lgHead{ background:var(--accent); box-shadow:0 4px 12px rgba(232,96,76,.4); }
  .lgGroup.good .lgHead{ background:var(--teal);   box-shadow:0 4px 12px rgba(91,143,138,.4); }
  .lgItem{ text-align:center; }
  .lgItem img{ height:94px; filter:drop-shadow(0 4px 6px rgba(90,60,50,.25)); }
  .lgItem .pt{ font-size:24px; font-weight:900; margin-top:-2px; }
  .lgItem .pt.plus { color:var(--good); }
  .lgItem .pt.minus{ color:var(--accent-deep); }

  footer{
    position:absolute; left:0; right:0; bottom:24px; text-align:center; padding-bottom:0; z-index:3;
    font-size:14px; font-weight:500; letter-spacing:.3em; text-indent:.3em; color:#c9b3a9;
  }
  footer b{ color:var(--accent); font-weight:700; }

  /* ===== attract demo (idle 30s auto how-to) ===== */
  #demoCap{
    position:absolute; left:50%; top:466px; transform:translateX(-50%); z-index:26; display:none;
    background:var(--ink); color:#fff; font-size:30px; font-weight:700; white-space:nowrap;
    border-radius:999px; padding:16px 46px 19px;
    box-shadow:0 10px 26px rgba(40,20,15,.3);
  }
  #demoCap.on{ display:block; animation:capPop .3s ease; }
  @keyframes capPop{ from{ transform:translateX(-50%) scale(.7); opacity:0 } }
  #demoHand{
    position:absolute; left:960px; top:700px; z-index:27; font-size:96px; display:none; pointer-events:none;
    transition:left .7s ease, top .7s ease, transform .15s ease;
    filter:drop-shadow(0 6px 10px rgba(40,20,15,.35));
  }
  #demoHand.on{ display:block; }

  /* ===== password gate (최초 1회) ===== */
  #gate{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#fffaf5 0%,#fdeee6 100%);
  }
  #gate.ok{ opacity:0; transition:opacity .35s ease; pointer-events:none; }
  .gate-card{
    display:flex; flex-direction:column; align-items:center; gap:20px;
    padding:42px 50px; background:#fff; border-radius:32px;
    box-shadow:0 16px 40px rgba(90,60,50,.16);
  }
  .gate-title{ color:var(--ink); font-size:24px; font-weight:900; letter-spacing:.06em; }
  .gate-dots{ display:flex; gap:16px; }
  .gate-dots span{
    width:16px; height:16px; border-radius:50%;
    border:2px solid #d8c3ba; transition:background .1s;
  }
  .gate-dots span.on{ background:var(--accent); border-color:var(--accent); }
  .gate-keys{ display:grid; grid-template-columns:repeat(3, 84px); gap:12px; }
  .gate-keys button{
    height:84px; border-radius:16px; border:none; cursor:pointer;
    background:var(--pink); color:var(--ink);
    font-size:30px; font-weight:700; font-family:inherit;
  }
  .gate-keys button:active{ background:#f6cfc2; }
  .gate-msg{ color:var(--accent); font-size:16px; height:20px; font-weight:500; }
  #gate.err .gate-dots{ animation:gshake .45s; }
  @keyframes gshake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-9px); } 40%{ transform:translateX(9px); }
    60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); }
  }

  /* ===== overlay ===== */
  #overlay{
    position:absolute; inset:0; z-index:30; display:none;
    background:rgba(255,248,243,.94); backdrop-filter:blur(4px);
    align-items:center; justify-content:center; flex-direction:column; text-align:center;
  }
  #overlay.show{ display:flex; }
  #ovTitle{ font-size:64px; font-weight:900; color:var(--ink); }
  #ovScore{ font-size:150px; font-weight:900; color:var(--accent); line-height:1.15; }
  #ovBest { font-size:34px; font-weight:700; color:var(--ink-soft); margin-bottom:36px; }
  #ovBest.newRecord{ color:var(--good); animation:pulse .5s infinite alternate; }
  #ovHint{
    display:inline-block; font-size:26px; font-weight:700; color:#fff;
    background:var(--ink); border-radius:999px; padding:16px 44px 18px;
    box-shadow:0 10px 26px rgba(40,20,15,.3);
  }
</style>
</head>
<body>
<div id="stage">
  <img class="decor" id="moon"   src="assets/moon.png"   alt="">
  <img class="decor" id="castle" src="assets/castle.png" alt="">
  <img class="bat" src="assets/bat.png" style="width:54px; left:420px; top:64px;  animation-duration:10s;" alt="">
  <img class="bat" src="assets/bat.png" style="width:38px; left:1370px; top:150px; animation-duration:13s;" alt="">
  <img class="bat" id="bigBat" src="assets/bat.png" style="width:150px; left:70px; top:640px; animation-duration:16s;" alt="">

  <header>
    <div class="h-tag">터치 게임 · 드라큘라 편</div>
    <h1><img src="assets/title.png" alt="두더지 게임"></h1>
    <div class="h-en">WHACK &middot; A &middot; MOLE</div>
  </header>

  <div id="rules">
    <div class="r1">몬스터를 터치하면 <b>점수 획득!</b></div>
    <div class="r2">퇴치 아이템을 터치하면 <b>감점!</b></div>
  </div>

  <div id="board"></div>

  <div id="panel">
    <div class="pbox"><div class="lbl">점수</div><div id="score">0</div></div>
    <div class="pbox" id="timeBox"><div class="lbl">남은 시간</div><div id="time">60</div></div>
    <div class="pbox" id="bestBox"><div class="lbl">최고 점수</div><div id="best">0</div></div>
    <button id="startBtn">게임 시작</button>
  </div>

  <div id="legend">
    <div class="lgGroup bad">
      <div class="lgHead">몬스터</div>
      <div class="lgItem"><img src="assets/dracula.png"  alt=""><div class="pt plus">+300</div></div>
      <div class="lgItem"><img src="assets/werewolf.png" alt=""><div class="pt plus">+200</div></div>
      <div class="lgItem"><img src="assets/skull.png"    alt=""><div class="pt plus">+100</div></div>
    </div>
    <div class="lgGroup good">
      <div class="lgHead">아이템</div>
      <div class="lgItem"><img src="assets/garlic.png"    alt=""><div class="pt minus">-100</div></div>
      <div class="lgItem"><img src="assets/stake.png"     alt=""><div class="pt minus">-100</div></div>
      <div class="lgItem"><img src="assets/holywater.png" alt=""><div class="pt minus">-100</div></div>
    </div>
  </div>

  <footer>TOUCH THE MONSTERS &middot; <b>DRACULA EDITION</b> &middot; F = FULLSCREEN</footer>

  <div id="urgent"></div>
  <div id="demoCap"></div>
  <div id="demoHand">&#128070;</div>

  <div id="overlay">
    <div id="ovTitle">게임 종료!</div>
    <div id="ovScore">0</div>
    <div id="ovBest"></div>
    <div id="ovHint">게임 시작 버튼을 눌러 다시 도전하세요</div>
  </div>
</div>

<div id="gate">
  <div class="gate-card">
    <div class="gate-title">비밀번호 4자리</div>
    <div class="gate-dots"><span></span><span></span><span></span><span></span></div>
    <div class="gate-keys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <span></span><button data-k="0">0</button><button data-k="del">&#9003;</button>
    </div>
    <div class="gate-msg"></div>
  </div>
</div>

<script>
'use strict';
/* ================= layout scale ================= */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ================= audio (WebAudio, no assets) ================= */
let AC=null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, dur, type='sine', vol=0.25, when=0, slide=0){
  const c=ac(), t=c.currentTime+when;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol=0.3, when=0){
  const c=ac(), t=c.currentTime+when;
  const n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const g=c.createGain(); g.gain.value=vol;
  src.connect(g).connect(c.destination); src.start(t);
}
const sfx = {
  pop(){ tone(420,.08,'square',.08,0,180); },
  hitBad(){ noise(.09,.28); tone(660,.12,'triangle',.3,0,300); tone(990,.16,'sine',.22,.05,200); },
  hitGood(){ tone(180,.3,'sawtooth',.3,0,-120); tone(90,.35,'square',.22,.02,-40); },
  tick(){ tone(880,.06,'square',.12); },
  heartbeat(){ tone(110,.14,'sine',.5,0,-30); tone(85,.12,'sine',.4,.18,-15); },
  start(){ [523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.3,i*.11)); },
  end(){ [784,659,523,392].forEach((f,i)=>tone(f,.2,'triangle',.3,i*.15)); noise(.4,.12,.6); }
};

/* ================= game data ================= */
const TYPES = [
  { id:'dracula',   img:'assets/dracula.png',   bad:true,  pts:+300, w:14 },
  { id:'werewolf',  img:'assets/werewolf.png',  bad:true,  pts:+200, w:22 },
  { id:'skull',     img:'assets/skull.png',     bad:true,  pts:+100, w:28 },
  { id:'garlic',    img:'assets/garlic.png',    bad:false, pts:-100, w:12 },
  { id:'stake',     img:'assets/stake.png',     bad:false, pts:-100, w:12 },
  { id:'holywater', img:'assets/holywater.png', bad:false, pts:-100, w:12 },
];
const W_SUM = TYPES.reduce((s,t)=>s+t.w,0);
function pickType(){
  let r=Math.random()*W_SUM;
  for(const t of TYPES){ if((r-=t.w)<0) return t; }
  return TYPES[0];
}

const GAME_SEC = 60;
const board = document.getElementById('board');
const cells = [];
for(let i=0;i<16;i++){
  const cell = document.createElement('div');
  cell.className='cell';
  cell.innerHTML = `<div class="hole"></div>
    <div class="popWrap"><div class="mole"><img draggable="false" alt=""></div></div>
    <div class="holeFront"></div>`;
  board.appendChild(cell);
  const mole = cell.querySelector('.mole');
  const state = { el:cell, mole, img:mole.querySelector('img'), busy:false, type:null, downTimer:0 };
  cell.addEventListener('pointerdown', e=>{ e.preventDefault(); whack(state); });  // 셀 전체가 터치 영역
  cells.push(state);
}

const $score=document.getElementById('score'), $time=document.getElementById('time'),
      $best=document.getElementById('best'), $btn=document.getElementById('startBtn'),
      $ov=document.getElementById('overlay'), $ovScore=document.getElementById('ovScore'),
      $ovBest=document.getElementById('ovBest');

let score=0, timeLeft=GAME_SEC, playing=false, spawnTimer=0, clockTimer=0, elapsed=0;
let best = +(localStorage.getItem('dracula_whack_best')||0);
$best.textContent = best;

/* ================= spawn / despawn ================= */
function spawn(){
  if(!playing) return;
  const p = Math.min(1, elapsed/GAME_SEC);                // 0 → 1 difficulty ramp
  const free = cells.filter(c=>!c.busy);
  if(free.length){
    let n = 1;                                            // more simultaneous moles over time
    if(Math.random() < 0.15 + 0.75*p) n = 2;
    if(p > 0.5 && Math.random() < (p-0.5)*1.3) n = 3;
    for(let k=0;k<Math.min(n,free.length);k++){
      const c = free.splice(Math.floor(Math.random()*free.length),1)[0];
      const t = pickType();
      c.busy=true; c.type=t;
      c.img.src=t.img;
      c.mole.classList.remove('hit','oops');
      requestAnimationFrame(()=>c.mole.classList.add('up'));
      sfx.pop();
      const stay = 1350 - 850*p + Math.random()*150;      // 1350ms → 500ms
      c.downTimer = setTimeout(()=>hide(c), stay);
    }
  }
  const gap = 800 - 560*p + Math.random()*80;             // 800ms → 240ms
  spawnTimer = setTimeout(spawn, gap);
}
function hide(c){
  clearTimeout(c.downTimer);
  c.mole.classList.remove('up');
  setTimeout(()=>{ c.busy=false; c.type=null; }, 200);
}

/* ================= whack ================= */
function whack(c){
  if(!playing || !c.busy || !c.type) return;
  const t=c.type;
  c.type=null; clearTimeout(c.downTimer);   // cell stays busy until the hit animation ends
  addScore(t.pts, c.el);
  if(t.bad){
    sfx.hitBad();
    c.mole.classList.add('hit');
    burst(c.el, '#f3d9a7');
    setTimeout(()=>{ c.mole.classList.remove('up','hit'); c.busy=false; }, 300);
  }else{
    sfx.hitGood();
    c.mole.classList.add('oops');
    burst(c.el, '#e8604c');
    setTimeout(()=>{ c.mole.classList.remove('up','oops'); setTimeout(()=>{ c.busy=false; },200); }, 260);
  }
}
function floatText(cellEl, text, color){
  const f=document.createElement('div');
  f.className='floatScore';
  f.textContent=text; f.style.color=color;
  cellEl.appendChild(f);
  setTimeout(()=>f.remove(), 850);
}
function addScore(pts, cellEl){
  score += pts;
  $score.textContent = score;
  floatText(cellEl, (pts>0?'+':'')+pts, pts>0 ? 'var(--good)' : 'var(--accent-deep)');
}
function burst(cellEl, color){
  const b=document.createElement('div');
  b.className='burst';
  b.style.background=`radial-gradient(circle, ${color} 0%, transparent 70%)`;
  cellEl.appendChild(b);
  setTimeout(()=>b.remove(), 500);
}

/* ================= game flow ================= */
function setHurry(on){
  $time.classList.toggle('hurry', on);
  document.getElementById('timeBox').classList.toggle('hurry', on);
  document.getElementById('urgent').classList.toggle('on', on);
}
function start(){
  ac();
  stopDemo();
  clearTimeout(spawnTimer); clearInterval(clockTimer);   // 게임 중 '다시 시작' 대비 리셋
  cells.forEach(hide);
  score=0; timeLeft=GAME_SEC; elapsed=0; playing=true;
  $score.textContent='0';
  $time.textContent=timeLeft; setHurry(false);
  $ov.classList.remove('show');
  $btn.textContent='다시 시작'; $btn.classList.add('playing');
  sfx.start();
  spawnTimer = setTimeout(spawn, 600);
  clockTimer = setInterval(()=>{
    timeLeft--; elapsed++;
    $time.textContent=timeLeft;
    if(timeLeft<=5 && timeLeft>0){ setHurry(true); sfx.tick(); sfx.heartbeat(); }
    if(timeLeft<=0) end();
  },1000);
}
function end(){
  playing=false;
  clearTimeout(spawnTimer); clearInterval(clockTimer);
  cells.forEach(hide);
  setHurry(false);
  sfx.end();
  const isNew = score>best;
  if(isNew){ best=score; localStorage.setItem('dracula_whack_best',best); $best.textContent=best; }
  $ovScore.textContent = score+'점';
  $ovBest.textContent = isNew ? '🎉 신기록 달성!' : `최고 점수 ${best}점`;
  $ovBest.classList.toggle('newRecord', isNew);
  $ov.classList.add('show');
  $btn.textContent='게임 시작'; $btn.classList.remove('playing');
}
$btn.addEventListener('click', start);
$ov.addEventListener('pointerdown', ()=>{ if(!playing) $ov.classList.remove('show'); });
document.addEventListener('contextmenu', e=>e.preventDefault());

/* ================= fullscreen (F key) ================= */
function toggleFS(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
addEventListener('keydown', e=>{ if(e.code==='KeyF') toggleFS(); });

/* ================= attract demo: 30초 무터치 시 게임 방법 자동 시연 ================= */
const IDLE_MS = 30000;
const $cap = document.getElementById('demoCap');
const $hand = document.getElementById('demoHand');
let demoActive=false, demoTimers=[], idleTimer=0;
function dT(fn, ms){ demoTimers.push(setTimeout(fn, ms)); }
function cap(text){
  $cap.textContent=text;
  $cap.classList.remove('on'); void $cap.offsetWidth; $cap.classList.add('on');
}
function moveHand(c){
  const r=c.el.getBoundingClientRect(), s=stage.getBoundingClientRect(), k=s.width/1920;
  $hand.style.left=((r.left-s.left)/k + r.width/(2*k) - 18)+'px';
  $hand.style.top =((r.top -s.top )/k + r.height/(2*k) + 6)+'px';
}
function demoPop(idx, typeId){
  const c=cells[idx];
  c.img.src=TYPES.find(t=>t.id===typeId).img;
  c.mole.classList.remove('hit','oops');
  requestAnimationFrame(()=>c.mole.classList.add('up'));
  sfx.pop();
  return c;
}
function demoRound(){
  if(!demoActive) return;
  cap('몬스터를 터치하면 점수 획득!');
  const c1=demoPop(5,'dracula'); moveHand(c1);
  dT(()=>{ $hand.style.transform='scale(.72)'; sfx.hitBad();
    c1.mole.classList.add('hit'); burst(c1.el,'#f3d9a7'); floatText(c1.el,'+300','var(--good)'); },1400);
  dT(()=>{ $hand.style.transform='scale(1)'; c1.mole.classList.remove('up','hit'); },1750);

  dT(()=>{ if(!demoActive) return;
    cap('퇴치 아이템을 터치하면 감점!');
    const c2=demoPop(10,'garlic'); moveHand(c2);
    dT(()=>{ $hand.style.transform='scale(.72)'; sfx.hitGood();
      c2.mole.classList.add('oops'); burst(c2.el,'#e8604c'); floatText(c2.el,'-100','var(--accent-deep)'); },1400);
    dT(()=>{ $hand.style.transform='scale(1)'; c2.mole.classList.remove('up','oops'); },1800);
  },3800);

  dT(()=>{ if(!demoActive) return;
    cap('제한 시간 60초, 최고 점수에 도전하세요!');
    [2,8,13].forEach((idx,i)=> dT(()=>{
      const c=demoPop(idx, ['werewolf','skull','dracula'][i]);
      dT(()=>c.mole.classList.remove('up'), 950);
    }, i*500));
  },7800);

  dT(demoRound, 11500);
}
function startDemo(){
  if(demoActive || playing || document.getElementById('gate')) return;
  demoActive=true;
  $ov.classList.remove('show');
  $hand.classList.add('on'); $hand.style.left='940px'; $hand.style.top='720px';
  demoRound();
}
function stopDemo(){
  clearTimeout(idleTimer);
  if(!demoActive) return;
  demoActive=false;
  demoTimers.forEach(clearTimeout); demoTimers=[];
  $cap.classList.remove('on'); $hand.classList.remove('on');
  cells.forEach(c=>{ c.mole.classList.remove('up','hit','oops'); c.busy=false; c.type=null; });
}
function resetIdle(){
  stopDemo();
  idleTimer=setTimeout(()=>{ if(!playing) startDemo(); }, IDLE_MS);
}
addEventListener('pointerdown', resetIdle, true);
addEventListener('keydown', resetIdle, true);
resetIdle();

/* 브라우저로 열면 첫 터치에 풀스크린 진입 (exe는 자체 풀스크린) */
const IS_ELECTRON = navigator.userAgent.includes('Electron');
document.addEventListener('pointerdown', ()=>{
  if(IS_ELECTRON || document.fullscreenElement) return;
  try{
    const p = document.documentElement.requestFullscreen();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
});

/* ================= 비밀번호 게이트 (최초 1회, 31과 동일 코드) ================= */
(function(){
  function _todayStr(){var d=new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');} function _dayCode(){var d=new Date();var m=String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');return m.split('').map(function(c){return(+c+1)%10;}).join('');} function _instantOK(){try{return new URLSearchParams(location.search).get('g')==='ins';}catch(e){return false;}}               // 다른 프로젝트와 동일. 바꾸면 기존 통과 기록 무효화.
  var KEY = "kiosk_daily";
  var gate = document.getElementById("gate");
  if(localStorage.getItem(KEY) === _todayStr() || _instantOK()){ gate.remove(); startDemo(); return; }   // 부팅 즉시 데모 시연
  var entry = "";
  var dots = gate.querySelectorAll(".gate-dots span");
  var msg = gate.querySelector(".gate-msg");
  function render(){ for(var i=0;i<dots.length;i++) dots[i].classList.toggle("on", i<entry.length); }
  function check(){
    if(entry.length < 4) return;
    if(entry === _dayCode()){
      try{ localStorage.setItem(KEY, _todayStr()); }catch(e){}
      gate.classList.add("ok");
      try{
        var el = document.documentElement;
        var p = (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
        if(p && p.catch) p.catch(function(){});
      }catch(e){}
      setTimeout(function(){ if(gate.parentNode) gate.remove(); startDemo(); }, 350);   // 통과 즉시 데모 시연
    }else{
      gate.classList.add("err"); msg.textContent = "비밀번호가 틀렸습니다";
      setTimeout(function(){ gate.classList.remove("err"); msg.textContent=""; entry=""; render(); }, 550);
    }
  }
  function press(k){
    sfx.tick();
    if(k === "del") entry = entry.slice(0, -1);
    else if(entry.length < 4) entry += k;
    render(); check();
  }
  var keys = gate.querySelectorAll(".gate-keys button");
  for(var i=0;i<keys.length;i++){
    keys[i].addEventListener("click", function(){ press(this.getAttribute("data-k")); });
  }
  window.addEventListener("keydown", function(e){
    if(!gate.parentNode) return;
    if(/^[0-9]$/.test(e.key)) press(e.key);
    else if(e.key === "Backspace") press("del");
  });
  render();
})();
</script>
