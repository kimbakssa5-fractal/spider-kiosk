<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>숨어있는 에너지를 찾아서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#fff8f3; }
  body { font-family:'Noto Sans KR', sans-serif; color:#3a3226; word-break:keep-all; }

  /* ---- 1920x1080 design canvas, scaled to fit ---- */
  #stage {
    position:absolute; left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin:center center;
    background:#fff8f3;
  }
  .dots-bg {
    position:absolute; inset:0;
    background-image:radial-gradient(#f3e3d3 7px, transparent 8px), radial-gradient(#eff5e3 6px, transparent 7px);
    background-size:170px 170px, 230px 230px;
    background-position:0 0, 85px 115px;
    opacity:.55;
  }

  .screen { position:absolute; inset:0; display:none; }
  .screen.on { display:block; }

  /* ---------- INTRO ---------- */
  #intro .panel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1150px; padding:70px 90px 60px;
    background:#fff; border-radius:44px;
    box-shadow:0 24px 60px rgba(90,60,30,.10);
    text-align:center;
  }
  .eyebrow {
    font-size:26px; font-weight:700; letter-spacing:.42em; color:#b9a893; text-indent:.42em;
    margin-bottom:18px;
  }
  h1.big {
    font-size:88px; font-weight:900; line-height:1.15; letter-spacing:-.02em; color:#3a3226;
  }
  h1.big em { font-style:normal; color:#e8604c; }
  .intro-desc { margin-top:34px; font-size:31px; font-weight:500; color:#7d7263; line-height:1.65; }
  .intro-desc b { color:#3a3226; font-weight:700; }

  .energy-strip {
    margin:44px auto 0; display:flex; flex-wrap:wrap; justify-content:center; gap:14px 16px; max-width:960px;
  }
  .energy-chip {
    display:flex; align-items:center; gap:10px;
    background:#fdf3ea; border-radius:999px; padding:10px 22px 10px 12px;
    font-size:23px; font-weight:700; color:#6e6355;
  }
  .energy-chip canvas { width:38px; height:38px; display:block; }

  .btn {
    display:inline-block; border:none; cursor:pointer; font-family:inherit;
    border-radius:999px; font-weight:900; letter-spacing:.02em;
  }
  .btn-primary {
    background:#e8604c; color:#fff; font-size:40px; padding:26px 96px;
    box-shadow:0 14px 30px rgba(232,96,76,.35);
    transition:transform .12s ease;
  }
  .btn-primary:active { transform:scale(.96); }
  .btn-ghost {
    background:#f4ece2; color:#7d7263; font-size:30px; padding:20px 60px;
  }
  #intro .btn-primary { margin-top:52px; }
  .intro-best {
    margin-top:34px; font-size:26px; font-weight:700; color:#b9a893; letter-spacing:.08em;
  }
  .intro-best b { color:#e8604c; font-size:30px; margin-left:10px; }
  .footer-caption {
    position:absolute; bottom:34px; left:0; right:0; text-align:center;
    font-size:22px; font-weight:900; letter-spacing:.5em; text-indent:.5em; color:#d9c8b4;
  }

  /* ---------- GAME ---------- */
  #game { display:none; }
  #game.on { display:flex; align-items:center; justify-content:center; gap:44px; }
  #fieldCard {
    position:relative; width:920px; height:980px;
    background:#fff; border-radius:40px;
    box-shadow:0 24px 60px rgba(90,60,30,.10);
    padding:20px; touch-action:none;
  }
  #fieldWrap { position:relative; width:880px; height:940px; border-radius:26px; overflow:hidden; background:#fffdf9; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #side { width:430px; display:flex; flex-direction:column; gap:22px; }
  .side-card {
    background:#fff; border-radius:32px; padding:28px 34px;
    box-shadow:0 18px 44px rgba(90,60,30,.09);
  }
  .side-label { font-size:21px; font-weight:900; letter-spacing:.3em; text-indent:.3em; color:#c5b6a2; text-align:center; }
  #scoreVal { margin-top:4px; font-size:74px; font-weight:900; color:#e8604c; text-align:center; line-height:1.1; font-variant-numeric:tabular-nums; }
  .best-row { margin-top:2px; display:flex; justify-content:center; gap:14px; align-items:baseline; }
  .best-row .side-label { letter-spacing:.14em; }
  #bestVal { font-size:30px; font-weight:900; color:#8d8172; font-variant-numeric:tabular-nums; }

  #ballsRow { display:flex; justify-content:center; gap:16px; margin-top:14px; }
  .ball-dot { width:30px; height:30px; border-radius:50%; background:#e8604c; box-shadow:inset 0 -4px 0 rgba(0,0,0,.12); transition:all .25s; }
  .ball-dot.off { background:#eee3d6; box-shadow:none; transform:scale(.8); }

  #checkTitle { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  #checkTitle .side-label { text-align:left; text-indent:0; letter-spacing:.18em; }
  #foundCount { font-size:26px; font-weight:900; color:#e8604c; }
  #checkList { display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; }
  .chk { display:flex; align-items:center; gap:11px; font-size:23px; font-weight:700; color:#c9bda9; transition:color .3s; padding:3px 0; }
  .chk .dot { width:20px; height:20px; border-radius:50%; background:#eee3d6; flex:none; transition:all .3s; }
  .chk.found { color:#3a3226; }
  .chk.found .dot { background:#59b95c; box-shadow:0 0 0 5px #dff1dc; }

  #gameBtns { display:flex; gap:14px; }
  #gameBtns .btn { flex:1; font-size:25px; padding:18px 10px; }

  /* ---------- RESULT ---------- */
  #result .panel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:980px; padding:76px 80px 64px; background:#fff; border-radius:44px;
    box-shadow:0 24px 60px rgba(90,60,30,.12); text-align:center;
  }
  #resultTitle { font-size:66px; font-weight:900; }
  #resultTitle em { font-style:normal; color:#e8604c; }
  #resultSub { margin-top:16px; font-size:28px; font-weight:500; color:#7d7263; }
  #resultScore { margin-top:38px; font-size:110px; font-weight:900; color:#e8604c; line-height:1; font-variant-numeric:tabular-nums; }
  #resultBest { margin-top:16px; font-size:26px; font-weight:700; color:#b9a893; }
  #newRecord {
    display:none; margin:22px auto 0; width:fit-content;
    background:#ffe9d8; color:#e8604c; font-weight:900; font-size:26px;
    border-radius:999px; padding:10px 34px;
  }
  #newRecord.on { display:block; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  #result .btns { margin-top:48px; display:flex; gap:20px; justify-content:center; }
  #result .btn-primary { font-size:34px; padding:22px 74px; }

  /* ---------- ATTRACT (demo) ---------- */
  #attractOverlay {
    position:absolute; inset:0; display:none; z-index:40; pointer-events:none;
  }
  #attractOverlay.on { display:block; }
  #attractCaption {
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    background:rgba(58,50,38,.82); color:#fff; font-size:30px; font-weight:700;
    padding:18px 46px; border-radius:999px; white-space:nowrap;
    backdrop-filter:blur(4px);
  }
  #joinBtn {
    position:absolute; bottom:70px; left:50%; transform:translateX(-50%);
    pointer-events:auto;
    background:#e8604c; color:#fff; border:none; cursor:pointer; font-family:inherit;
    font-size:44px; font-weight:900; border-radius:999px; padding:28px 100px;
    box-shadow:0 16px 40px rgba(232,96,76,.45);
    animation:blink 1.15s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity:.45; transform:translateX(-50%) scale(.97); } }

  /* ---------- PORTRAIT (폰 세로) ----------
     스테이지가 1080×1920로 바뀌고 .portrait가 붙는다 (JS fitStage) */
  #stage.portrait #intro .panel { width:1000px; padding:60px 50px 50px; }
  #stage.portrait h1.big { font-size:72px; }
  #stage.portrait .energy-strip { max-width:880px; }
  #stage.portrait #game.on { flex-direction:column; gap:24px; }
  #stage.portrait #side {
    width:920px; display:grid; grid-template-columns:1fr 1fr; gap:22px;
  }
  #stage.portrait #gameBtns { grid-column:1 / -1; }
  #stage.portrait #scoreVal { font-size:64px; }
  #stage.portrait #result .panel { width:920px; padding:60px 50px 50px; }
  #stage.portrait #resultTitle { font-size:56px; }
  #stage.portrait #resultScore { font-size:96px; }
  #stage.portrait #joinBtn { font-size:38px; padding:24px 80px; bottom:110px; }
  #stage.portrait #attractCaption { font-size:27px; top:110px; }

  /* ---------- GATE ---------- */
  #gate { z-index:100; background:#fff8f3; }
  #gate .panel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:640px; padding:64px 60px; background:#fff; border-radius:44px;
    box-shadow:0 24px 60px rgba(90,60,30,.10); text-align:center;
  }
  #gate h2 { font-size:40px; font-weight:900; }
  #gate p { margin-top:12px; font-size:24px; color:#9a8d7b; font-weight:500; }
  #pinDots { display:flex; justify-content:center; gap:26px; margin:40px 0 34px; }
  .pin-dot { width:30px; height:30px; border-radius:50%; background:#eee3d6; transition:background .15s; }
  .pin-dot.fill { background:#e8604c; }
  #pinPad { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  #pinPad button {
    font-family:inherit; font-size:38px; font-weight:900; color:#3a3226;
    background:#faf3ea; border:none; border-radius:24px; padding:22px 0; cursor:pointer;
  }
  #pinPad button:active { background:#f0e2d2; }
  #gate .panel.shake { animation:shake .4s; }
  @keyframes shake { 20%,60%{transform:translate(calc(-50% - 14px),-50%)} 40%,80%{transform:translate(calc(-50% + 14px),-50%)} }
</style>
</head>
<body>
<div id="stage">
  <div class="dots-bg"></div>

  <!-- ========== INTRO ========== -->
  <section id="intro" class="screen">
    <div class="panel">
      <div class="eyebrow">신·재생에너지 탐사 아케이드</div>
      <h1 class="big">숨어있는 <em>에너지</em>를 찾아서</h1>
      <div class="intro-desc">
        21세기는 신·재생에너지의 시대!<br>
        공을 튕겨 숨어있는 <b>11가지 에너지원</b>을 모두 찾아보세요.<br>
        <b>새싹</b>을 받으면 패들이 커지고, <b>기름</b>을 받으면 작아져요!
      </div>
      <div class="energy-strip" id="energyStrip"></div>
      <button class="btn btn-primary" id="startBtn">시 작 하 기</button>
      <div class="intro-best">최고점수 <b id="introBest">0</b></div>
    </div>
    <div class="footer-caption">BRAIN TRAINING ACADEMY</div>
  </section>

  <!-- ========== GAME ========== -->
  <section id="game" class="screen">
    <div id="fieldCard">
      <div id="fieldWrap"><canvas id="cv" width="880" height="940"></canvas></div>
    </div>
    <div id="side">
      <div class="side-card">
        <div class="side-label">점수</div>
        <div id="scoreVal">0</div>
        <div class="best-row"><span class="side-label">최고점수</span><span id="bestVal">0</span></div>
        <div id="ballsRow"></div>
      </div>
      <div class="side-card">
        <div id="checkTitle">
          <span class="side-label">에너지 수집</span>
          <span id="foundCount">0 / 11</span>
        </div>
        <div id="checkList"></div>
      </div>
      <div id="gameBtns">
        <button class="btn btn-ghost" id="restartBtn">다시 시작</button>
        <button class="btn btn-ghost" id="quitBtn">그만하기</button>
      </div>
    </div>
  </section>

  <!-- ========== RESULT ========== -->
  <section id="result" class="screen">
    <div class="panel">
      <div id="resultTitle"></div>
      <div id="resultSub"></div>
      <div id="resultScore">0</div>
      <div id="resultBest"></div>
      <div id="newRecord">🎉 신기록 달성!</div>
      <div class="btns">
        <button class="btn btn-primary" id="againBtn">다시 하기</button>
        <button class="btn btn-ghost" id="homeBtn">처음으로</button>
      </div>
    </div>
  </section>

  <!-- ========== ATTRACT OVERLAY ========== -->
  <div id="attractOverlay">
    <div id="attractCaption">공을 튕겨 에너지원을 찾아보세요!</div>
    <button id="joinBtn">게임 참여하기</button>
  </div>

  <!-- ========== GATE ========== -->
  <section id="gate" class="screen">
    <div class="panel" id="gatePanel">
      <h2>비밀번호를 입력하세요</h2>
      <p>관리자에게 문의해 주세요</p>
      <div id="pinDots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
      <div id="pinPad"></div>
    </div>
  </section>
</div>

<script>
'use strict';
/* =====================================================================
   숨어있는 에너지를 찾아서 — 신재생에너지 핀볼 (브레이크아웃) 키오스크
   원작: Macromedia Director "숨어있는 에너지를 찾아서" (data_src/main.dxr)
   ===================================================================== */

const LS_ACCESS = 'pinball33_access';
const LS_BEST   = 'pinball33_best';
const PIN_CODE  = '1412';

const FIELD_W = 880, FIELD_H = 940;
const BALL_R = 13, PADDLE_H = 26, PADDLE_Y = 878;
const PADDLE_BASE = 210, PADDLE_MIN = 120, PADDLE_MAX = 320, PADDLE_STEP = 22;
const START_BALLS = 4;
const SCORE_FIRST = 300, SCORE_REPEAT = 50, SCORE_CLEAR = 3000;
const SPEED_BASE = 8.5, SPEED_MAX = 14.5;

/* ------------------ 에너지원 정의 (11종) ------------------ */
const ENERGY = [
  { id:'sun',    name:'태양열',        chip:'#ffe3b3', x:128, y:158, r:56 },
  { id:'pv',     name:'태양광발전',    chip:'#cfe6ff', x:330, y:122, r:58 },
  { id:'wind',   name:'풍력',          chip:'#dff1ff', x:552, y:142, r:58 },
  { id:'h2',     name:'수소에너지',    chip:'#e6e0ff', x:762, y:158, r:54 },
  { id:'bio',    name:'바이오매스',    chip:'#e2f3d1', x:112, y:352, r:52 },
  { id:'fuel',   name:'연료전지',      chip:'#d9f2e6', x:308, y:308, r:50 },
  { id:'coal',   name:'석탄액화가스화', chip:'#e8e3de', x:528, y:330, r:52 },
  { id:'ocean',  name:'해양에너지',    chip:'#cce9f6', x:748, y:342, r:54 },
  { id:'hydro',  name:'소수력',        chip:'#d4ecf9', x:206, y:528, r:50 },
  { id:'geo',    name:'지열',          chip:'#ffdfd1', x:448, y:498, r:52 },
  { id:'waste',  name:'폐기물에너지',  chip:'#e5f0d4', x:688, y:520, r:50 },
];

/* =====================================================================
   에너지 아이콘 벡터 드로잉 (에셋 없이 캔버스로 직접 그림)
   drawIcon(ctx, id, s): 중심 (0,0), s = 기준 반지름
   ===================================================================== */
function drawIcon(ctx, id, s) {
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch(id) {

  case 'sun': { // 태양열: 웃는 해
    ctx.fillStyle = '#f7a440';
    for (let i=0;i<8;i++) {
      const a = i/8*Math.PI*2;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(s*.62,-s*.13); ctx.lineTo(s*.95,0); ctx.lineTo(s*.62,s*.13);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    const g = ctx.createRadialGradient(-s*.15,-s*.2,s*.05,0,0,s*.62);
    g.addColorStop(0,'#ffd166'); g.addColorStop(1,'#f7a440');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,s*.60,0,7); ctx.fill();
    ctx.fillStyle = '#8a5a1d';
    ctx.beginPath(); ctx.arc(-s*.2,-s*.08,s*.055,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc( s*.2,-s*.08,s*.055,0,7); ctx.fill();
    ctx.strokeStyle = '#8a5a1d'; ctx.lineWidth = s*.07;
    ctx.beginPath(); ctx.arc(0,s*.08,s*.22,Math.PI*.15,Math.PI*.85); ctx.stroke();
    ctx.fillStyle = 'rgba(240,110,90,.45)';
    ctx.beginPath(); ctx.arc(-s*.36,s*.08,s*.09,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc( s*.36,s*.08,s*.09,0,7); ctx.fill();
    break;
  }
  case 'pv': { // 태양광발전: 기울어진 태양광 패널
    ctx.save(); ctx.rotate(-.22);
    ctx.fillStyle = '#7d7263';
    ctx.fillRect(-s*.06, s*.1, s*.12, s*.5);
    ctx.fillStyle = '#2f6fb7';
    ctx.beginPath();
    ctx.moveTo(-s*.75,-s*.12); ctx.lineTo(s*.75,-s*.42); ctx.lineTo(s*.75,s*.06); ctx.lineTo(-s*.75,s*.36);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#bfd9f2'; ctx.lineWidth = s*.05;
    for (let i=1;i<3;i++) {
      const t = -s*.75 + i*(s*1.5/3);
      ctx.beginPath(); ctx.moveTo(t, -s*.12 - (t+s*.75)/(s*1.5)*s*.3 );
      ctx.lineTo(t, s*.36 - (t+s*.75)/(s*1.5)*s*.3); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(-s*.75,s*.12); ctx.lineTo(s*.75,-s*.18); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(s*.42,-s*.5,s*.14,0,7); ctx.fill();
    break;
  }
  case 'wind': { // 풍력: 풍차
    ctx.fillStyle = '#e9f4fb';
    ctx.beginPath(); ctx.arc(0,0,s*.72,0,7); ctx.fill();
    ctx.fillStyle = '#cfd8de';
    ctx.beginPath();
    ctx.moveTo(-s*.07,-s*.05); ctx.lineTo(s*.07,-s*.05); ctx.lineTo(s*.045,s*.66); ctx.lineTo(-s*.045,s*.66);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i=0;i<3;i++) {
      ctx.save(); ctx.rotate(i*Math.PI*2/3 - Math.PI/2);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(s*.16,-s*.28, s*.06,-s*.62);
      ctx.quadraticCurveTo(-s*.04,-s*.3, 0,0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c7d3da'; ctx.lineWidth = s*.02; ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#e8604c';
    ctx.beginPath(); ctx.arc(0,-s*.05,s*.09,0,7); ctx.fill();
    break;
  }
  case 'h2': { // 수소에너지: H₂ 분자
    ctx.strokeStyle = '#8f7ff0'; ctx.lineWidth = s*.12;
    ctx.beginPath(); ctx.moveTo(-s*.3,0); ctx.lineTo(s*.3,0); ctx.stroke();
    for (const dx of [-.38,.38]) {
      const g = ctx.createRadialGradient(dx*s-s*.08,-s*.08,s*.03,dx*s,0,s*.34);
      g.addColorStop(0,'#fff'); g.addColorStop(1,'#cfc4ff');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(dx*s,0,s*.32,0,7); ctx.fill();
      ctx.fillStyle = '#6a58d6';
      ctx.font = `900 ${s*.34}px 'Noto Sans KR'`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('H', dx*s, s*.02);
    }
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(s*.1,-s*.52,s*.07,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(-s*.3,-s*.44,s*.05,0,7); ctx.fill();
    break;
  }
  case 'bio': { // 바이오매스: 새싹 화분
    ctx.fillStyle = '#a9743f';
    ctx.beginPath();
    ctx.moveTo(-s*.42,s*.04); ctx.lineTo(s*.42,s*.04); ctx.lineTo(s*.3,s*.6); ctx.lineTo(-s*.3,s*.6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c98d54';
    ctx.fillRect(-s*.48,-s*.04,s*.96,s*.14);
    ctx.strokeStyle = '#4f9d3f'; ctx.lineWidth = s*.09;
    ctx.beginPath(); ctx.moveTo(0,s*.0); ctx.quadraticCurveTo(s*.02,-s*.3,0,-s*.52); ctx.stroke();
    ctx.fillStyle = '#67b955';
    ctx.beginPath();
    ctx.moveTo(0,-s*.5);
    ctx.quadraticCurveTo(-s*.5,-s*.62,-s*.42,-s*.24);
    ctx.quadraticCurveTo(-s*.18,-s*.14,0,-s*.5);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,-s*.5);
    ctx.quadraticCurveTo(s*.5,-s*.62,s*.42,-s*.24);
    ctx.quadraticCurveTo(s*.18,-s*.14,0,-s*.5);
    ctx.closePath(); ctx.fill();
    break;
  }
  case 'fuel': { // 연료전지: 배터리+번개
    ctx.fillStyle = '#37a37f';
    ctx.beginPath(); ctx.roundRect(-s*.44,-s*.5,s*.88,s*1.0,s*.14); ctx.fill();
    ctx.fillStyle = '#2b8265';
    ctx.fillRect(-s*.16,-s*.62,s*.32,s*.14);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.moveTo(s*.1,-s*.34); ctx.lineTo(-s*.2,s*.06); ctx.lineTo(-s*.02,s*.06);
    ctx.lineTo(-s*.1,s*.38); ctx.lineTo(s*.2,-s*.02); ctx.lineTo(s*.02,-s*.02);
    ctx.closePath(); ctx.fill();
    break;
  }
  case 'coal': { // 석탄액화가스화: 석탄 덩어리 + 가스 방울
    ctx.fillStyle = '#4b453e';
    ctx.beginPath();
    ctx.moveTo(-s*.5,s*.3); ctx.lineTo(-s*.34,-s*.12); ctx.lineTo(0,-s*.26);
    ctx.lineTo(s*.4,-s*.06); ctx.lineTo(s*.5,s*.34); ctx.lineTo(0,s*.52);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6a625a';
    ctx.beginPath();
    ctx.moveTo(-s*.34,-s*.12); ctx.lineTo(0,-s*.26); ctx.lineTo(s*.08,s*.06); ctx.lineTo(-s*.2,s*.14);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9fb6c9'; ctx.lineWidth = s*.06;
    ctx.fillStyle = 'rgba(159,182,201,.4)';
    for (const [bx,by,br] of [[-.2,-.5,.1],[.12,-.62,.13],[.4,-.44,.09]]) {
      ctx.beginPath(); ctx.arc(bx*s,by*s,br*s,0,7); ctx.fill(); ctx.stroke();
    }
    break;
  }
  case 'ocean': { // 해양에너지: 파도
    ctx.fillStyle = '#eaf6fd';
    ctx.beginPath(); ctx.arc(0,0,s*.72,0,7); ctx.fill();
    ctx.strokeStyle = '#2f8fd0'; ctx.lineWidth = s*.13;
    for (const dy of [-.16,.2]) {
      ctx.beginPath();
      ctx.moveTo(-s*.5,dy*s);
      ctx.quadraticCurveTo(-s*.25,(dy-.3)*s, 0,dy*s);
      ctx.quadraticCurveTo(s*.25,(dy+.3)*s, s*.5,dy*s);
      ctx.stroke();
    }
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(s*.34,-s*.44,s*.11,0,7); ctx.fill();
    break;
  }
  case 'hydro': { // 소수력: 물레방아
    ctx.strokeStyle = '#3b98d8'; ctx.lineWidth = s*.11;
    ctx.beginPath(); ctx.moveTo(-s*.62,s*.44); ctx.quadraticCurveTo(0,s*.6,s*.62,s*.44); ctx.stroke();
    ctx.fillStyle = '#b07c48';
    for (let i=0;i<8;i++) {
      ctx.save(); ctx.rotate(i/8*Math.PI*2);
      ctx.fillRect(-s*.055, -s*.6, s*.11, s*.28);
      ctx.restore();
    }
    ctx.strokeStyle = '#8a5f33'; ctx.lineWidth = s*.09;
    ctx.beginPath(); ctx.arc(0,0,s*.4,0,7); ctx.stroke();
    ctx.fillStyle = '#c98d54';
    ctx.beginPath(); ctx.arc(0,0,s*.16,0,7); ctx.fill();
    ctx.fillStyle = '#7fc3ec';
    ctx.beginPath(); ctx.arc(-s*.4,s*.32,s*.08,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(s*.34,s*.4,s*.06,0,7); ctx.fill();
    break;
  }
  case 'geo': { // 지열: 땅 + 김
    ctx.fillStyle = '#d97b4f';
    ctx.beginPath();
    ctx.moveTo(-s*.66,s*.5); ctx.quadraticCurveTo(0,-s*.1,s*.66,s*.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b95f3a';
    ctx.beginPath();
    ctx.moveTo(-s*.4,s*.5); ctx.quadraticCurveTo(0,s*.08,s*.4,s*.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f2c14e';
    ctx.beginPath(); ctx.arc(0,s*.5,s*.14,Math.PI,0); ctx.fill();
    ctx.strokeStyle = '#e8604c'; ctx.lineWidth = s*.08;
    for (const dx of [-.3,0,.3]) {
      ctx.beginPath();
      ctx.moveTo(dx*s, s*.02 + Math.abs(dx)*s*.4);
      ctx.quadraticCurveTo((dx-.1)*s,-s*.2 + Math.abs(dx)*s*.36, dx*s,-s*.4 + Math.abs(dx)*s*.36);
      ctx.stroke();
    }
    break;
  }
  case 'waste': { // 폐기물에너지: 재활용 화살표
    ctx.strokeStyle = '#6dab3c'; ctx.lineWidth = s*.13;
    ctx.fillStyle = '#6dab3c';
    for (let i=0;i<3;i++) {
      ctx.save(); ctx.rotate(i*Math.PI*2/3);
      ctx.beginPath(); ctx.arc(0,0,s*.46, -Math.PI/2+.25, -Math.PI/2+Math.PI*2/3-.35); ctx.stroke();
      const ea = -Math.PI/2+Math.PI*2/3-.35;
      const ex = Math.cos(ea)*s*.46, ey = Math.sin(ea)*s*.46;
      ctx.translate(ex,ey); ctx.rotate(ea+Math.PI/2);
      ctx.beginPath();
      ctx.moveTo(0,-s*.02); ctx.lineTo(s*.16,s*.2); ctx.lineTo(-s*.16,s*.2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    break;
  }
  }
  ctx.restore();
}

/* 타겟/칩 공용 아이콘 도장.
   ICON_SET 'a' = icon2.png 일러스트, 원 배경 없이 자유 테두리 그대로 (기본)
   ICON_SET 'b' = icon.png 원작 3D 렌더, 파스텔 원형 칩 안에 표시 (보존용)
   PNG 로드 전에는 벡터 폴백, 로드/웹폰트 완료 시 재도장 */
const ICON_SET = 'a';
const ICON_CIRCLE = ICON_SET === 'b';
const ICON_IMG = {};
function paintIcon(c, id, chip) {
  const px = c.width;
  const ctx = c.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,px,px);
  ctx.translate(px/2, px/2);
  if (ICON_CIRCLE) {
    ctx.fillStyle = chip;
    ctx.beginPath(); ctx.arc(0,0,px/2-2,0,7); ctx.fill();
  }
  const img = ICON_IMG[id];
  if (img) {
    const r = px/2 - 2;
    let s;
    if (ICON_CIRCLE) {
      // 원 안에 대각선이 들어가도록 축소(원형 범퍼 밖으로 삐져나오지 않게)
      s = (2*r*.94) / Math.hypot(img.width, img.height);
    } else {
      // 자유 테두리: 긴 변이 지름에 맞도록 (충돌원과 시각 크기 일치)
      s = (2*r*.96) / Math.max(img.width, img.height);
    }
    const w = img.width*s, h = img.height*s;
    ctx.drawImage(img, -w/2, -h/2, w, h);
  } else {
    drawIcon(ctx, id, px*.30);
  }
}
const allIconCanvases = [];
function makeIconCanvas(id, chip, px) {
  const c = document.createElement('canvas');
  c.width = c.height = px;
  paintIcon(c, id, chip);
  allIconCanvases.push({c, id, chip});
  return c;
}
/* 웹폰트('H' 글자 등) 로드 후 아이콘 재도장 */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(()=>allIconCanvases.forEach(({c,id,chip})=>paintIcon(c,id,chip)));
}
/* 원작 3D 아이콘 로드 → 도착한 것부터 재도장 */
for (const e of ENERGY) {
  const img = new Image();
  img.onload = ()=>{
    ICON_IMG[e.id] = img;
    allIconCanvases.forEach(({c,id,chip})=>{ if (id === e.id) paintIcon(c,id,chip); });
  };
  img.src = 'assets/' + ICON_SET + '/' + e.id + '.png';
}

/* 낙하 아이템 이미지: 새싹 잎(leaf.png) / 기름 캡슐(capsule.png) */
const LEAF_IMG = new Image();
LEAF_IMG.src = 'assets/leaf.png';
const CAPSULE_IMG = new Image();
CAPSULE_IMG.src = 'assets/capsule.png';

/* =====================================================================
   사운드 (WebAudio 신스)
   ===================================================================== */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type='sine', vol=.18, when=0, slide=0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t0+dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t0); o.stop(t0+dur+.02);
  },
  paddle()  { this.tone(220, .08, 'triangle', .22, 0, 80); },
  wall()    { this.tone(160, .05, 'sine', .1); },
  hit()     { this.tone(340, .07, 'triangle', .16, 0, 60); },
  collect() { [523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.2,i*.07)); },
  sprout()  { this.tone(880,.09,'sine',.2); this.tone(1320,.14,'sine',.18,.08); },
  oil()     { this.tone(220,.14,'sawtooth',.13,0,-90); this.tone(150,.2,'sawtooth',.11,.1,-60); },
  lose()    { this.tone(300,.5,'sawtooth',.12,0,-220); },
  clear()   { [523,659,784,1047,1319,1568].forEach((f,i)=>this.tone(f,.3,'triangle',.2,i*.12)); },
  over()    { [392,330,262].forEach((f,i)=>this.tone(f,.32,'triangle',.16,i*.18)); },
};

/* =====================================================================
   상태 / DOM
   ===================================================================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const screens = { gate:$('#gate'), intro:$('#intro'), game:$('#game'), result:$('#result') };
const cv = $('#cv'), ctx = cv.getContext('2d');
let best = +(localStorage.getItem(LS_BEST)||0);

function show(name) {
  for (const k in screens) screens[k].classList.toggle('on', k===name);
  $('#attractOverlay').classList.remove('on');
}

/* 스테이지 스케일: PC(가로) 1920×1080 / 폰(세로) 1080×1920 */
function fitStage() {
  const portrait = innerHeight > innerWidth;
  stage.classList.toggle('portrait', portrait);
  const W = portrait ? 1080 : 1920, H = portrait ? 1920 : 1080;
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';
  const s = Math.min(innerWidth/W, innerHeight/H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fitStage);
addEventListener('orientationchange', ()=>setTimeout(fitStage, 60));
fitStage();

/* =====================================================================
   게임 본체
   ===================================================================== */
const targets = ENERGY.map(e => ({ ...e, found:false, hitFlash:0, icon:makeIconCanvas(e.id, e.chip, e.r*2*2) }));
const chkEls = [];

const G = {
  running:false, demo:false,
  score:0, balls:START_BALLS, foundCount:0, laps:0,
  ball:{ x:FIELD_W/2, y:PADDLE_Y-BALL_R-PADDLE_H/2, vx:0, vy:0, docked:true, dockTime:0 },
  paddleX: FIELD_W/2, paddleW: PADDLE_BASE,
  pops:[],      // floating score texts
  parts:[],     // particles
  items:[],     // 낙하 아이템 (새싹=패들 커짐 / 기름=패들 작아짐)
  itemTimer: 6,
  speed: SPEED_BASE,
  time: 0,      // 공이 살아있는 동안 누적(가속 기준)
  shake:0,
  over:false,
};

function resetGame(demo=false) {
  G.demo = demo;
  G.score = 0; G.balls = START_BALLS; G.foundCount = 0; G.laps = 0;
  G.pops = []; G.parts = []; G.items = [];
  G.itemTimer = 6; G.speed = SPEED_BASE; G.time = 0; G.shake = 0; G.over = false;
  G.paddleX = FIELD_W/2; G.paddleW = PADDLE_BASE;
  for (const t of targets) { t.found = false; t.hitFlash = 0; }
  dockBall();
  updateHud();
  G.running = true;
}

function dockBall() {
  const b = G.ball;
  b.docked = true; b.dockTime = 0;
  b.x = G.paddleX; b.y = PADDLE_Y - PADDLE_H/2 - BALL_R - 2;
  b.vx = 0; b.vy = 0;
}

function launchBall() {
  const b = G.ball;
  if (!b.docked) return;
  b.docked = false;
  const a = -Math.PI/2 + (Math.random()*.5-.25);
  b.vx = Math.cos(a)*G.speed; b.vy = Math.sin(a)*G.speed;
  Sound.paddle();
}

function normalizeBall() {
  const b = G.ball;
  const sp = Math.hypot(b.vx,b.vy) || 1;
  b.vx = b.vx/sp*G.speed; b.vy = b.vy/sp*G.speed;
  // 수평 고착 방지: 최소 수직 성분 확보
  const minVy = G.speed*.34;
  if (Math.abs(b.vy) < minVy) {
    b.vy = (b.vy===0 ? -1 : Math.sign(b.vy)) * minVy;
    const rest = Math.sqrt(Math.max(0, G.speed*G.speed - b.vy*b.vy));
    b.vx = Math.sign(b.vx||1) * rest;
  }
}

function addPop(x,y,txt,color='#e8604c',size=30) {
  G.pops.push({x,y,txt,color,size,life:1});
}
function burst(x,y,color,n=14) {
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*5;
    G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,color,r:3+Math.random()*5});
  }
}

function hitTarget(t) {
  t.hitFlash = 1;
  if (!t.found) {
    t.found = true; G.foundCount++;
    G.score += SCORE_FIRST;
    addPop(t.x, t.y - t.r - 14, `+${SCORE_FIRST} ${t.name}!`, '#e8604c', 34);
    burst(t.x, t.y, '#f2a04c', 20);
    Sound.collect();
    if (G.foundCount >= ENERGY.length) { lapClear(); }
  } else {
    G.score += SCORE_REPEAT;
    addPop(t.x, t.y - t.r - 10, `+${SCORE_REPEAT}`, '#b9a893', 24);
    Sound.hit();
  }
  updateHud();
}

/* 11종 완성 → 보너스 후 체크리스트 리셋, 게임은 계속 (공이 out되어야 종료) */
function lapClear() {
  G.laps++;
  G.score += SCORE_CLEAR;
  addPop(FIELD_W/2, FIELD_H/2 - 60, `ALL CLEAR! +${SCORE_CLEAR.toLocaleString()}`, '#e8604c', 44);
  burst(FIELD_W/2, FIELD_H/2, '#e8604c', 40);
  Sound.clear();
  setTimeout(()=>{
    if (G.over) return;
    for (const t of targets) t.found = false;
    G.foundCount = 0;
    updateHud();
  }, 1200);
}

function loseBall() {
  if (G.over || G.ball.docked) return; // 서브스텝 중복 호출 방지
  Sound.lose();
  G.shake = 1;
  G.balls--;
  updateHud();
  if (G.balls <= 0) { G.balls = 0; endGame(); }
  dockBall(); // 게임오버여도 도킹해 두면 잔여 서브스텝이 안전
}

function endGame() {
  if (G.over) return;
  G.over = true; G.running = false;
  if (G.demo) { // 데모는 결과 화면 없이 재시작
    setTimeout(()=>{ if (G.demo) resetGame(true); }, 1600);
    return;
  }
  const isRecord = G.score > best;
  if (isRecord) { best = G.score; localStorage.setItem(LS_BEST, best); }
  const good = G.laps > 0;
  $('#resultTitle').innerHTML = good
    ? `<em>11가지 에너지</em>를 ${G.laps}번이나 모두 찾았어요!`
    : '아쉬워요, 다음에 다시!';
  $('#resultSub').textContent = good
    ? `이번 판에서 더 찾은 에너지 ${G.foundCount} / ${ENERGY.length}`
    : `찾은 에너지 ${G.foundCount} / ${ENERGY.length}`;
  $('#resultScore').textContent = G.score.toLocaleString();
  $('#resultBest').textContent = `최고점수 ${best.toLocaleString()}`;
  $('#newRecord').classList.toggle('on', isRecord);
  Sound.over();
  setTimeout(()=>show('result'), 700);
}

/* ------------------ HUD ------------------ */
function updateHud() {
  $('#scoreVal').textContent = G.score.toLocaleString();
  $('#bestVal').textContent = Math.max(best, G.score).toLocaleString();
  $('#foundCount').textContent = `${G.foundCount} / ${ENERGY.length}`;
  document.querySelectorAll('.ball-dot').forEach((el,i)=>el.classList.toggle('off', i >= G.balls));
  targets.forEach((t,i)=>chkEls[i].classList.toggle('found', t.found));
}

/* =====================================================================
   물리 & 렌더
   ===================================================================== */
let lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(2.5, (ts-lastT)/16.667 || 1); lastT = ts;
  if (G.running) step(dt);
  render();
}

function step(dt) {
  const b = G.ball;

  if (G.demo) demoDrive(dt);
  else keyboardPaddle(dt);

  if (b.docked) {
    b.x = G.paddleX;
    b.y = PADDLE_Y - PADDLE_H/2 - BALL_R - 2;
    b.dockTime += dt/60;
    if (b.dockTime > (G.demo? .8 : 3)) launchBall(); // 키오스크: 3초 후 자동 발사
  } else {
    // 공이 살아있는 동안 시간 누적 → 점점 가속
    G.time += dt/60;
    // 서브스텝(터널링 방지)
    const sub = Math.ceil(G.speed*dt / 6);
    for (let i=0;i<sub;i++) stepBall(dt/sub);
  }
  G.speed = Math.min(SPEED_MAX, SPEED_BASE + G.time*.04 + G.laps*.6);

  // 낙하 아이템: 새싹(패들 커짐) / 기름(패들 작아짐)
  G.itemTimer -= dt/60;
  if (G.itemTimer <= 0 && !b.docked) {
    G.itemTimer = 6 + Math.random()*5;
    // 가끔 기름 떼가 무리 지어 쏟아짐 (라운드가 오를수록 잦아짐 → 난이도 상승)
    const swarmChance = Math.min(.32, .15 + G.laps*.04);
    if (Math.random() < swarmChance) {
      const n = 4 + (Math.random()*3|0); // 4~6개
      const cx = 140 + Math.random()*(FIELD_W-280);
      for (let i=0;i<n;i++) {
        G.items.push({
          type:'oil',
          x: Math.max(40, Math.min(FIELD_W-40, cx + (Math.random()-.5)*340)),
          y: -34 - Math.random()*280,   // 시차를 두고 줄줄이 떨어짐
          t: Math.random(),
        });
      }
      addPop(FIELD_W/2, 150, '기름 비를 피하세요!', '#4b453e', 36);
      Sound.oil();
    } else {
      G.items.push({
        type: Math.random() < .55 ? 'sprout' : 'oil',
        x: 60+Math.random()*(FIELD_W-120), y:-34, t:0,
      });
    }
  }
  for (const s of G.items) {
    s.t += dt/60;
    if (s.type==='sprout') {
      // 나풀나풀: 좌우로 크게 흔들리며 천천히, 흔들림에 따라 낙하도 출렁
      s.y += (1.5 + .5*Math.cos(s.t*4.4))*dt;
      s.x += Math.sin(s.t*2.2)*2.6*dt;
    } else {
      // 꾸덕꾸덕: 끈적하게 스트레칭 박자에 맞춰 무겁게 뚝뚝
      s.y += (2.0 + 1.1*Math.max(0, Math.sin(s.t*4.2)))*dt;
    }
    // 패들로 받기
    if (s.y > PADDLE_Y - PADDLE_H/2 - 24 && s.y < PADDLE_Y + 26 &&
        Math.abs(s.x - G.paddleX) < G.paddleW/2 + 18) {
      s.dead = true;
      if (s.type==='sprout') {
        G.paddleW = Math.min(PADDLE_MAX, G.paddleW + PADDLE_STEP);
        addPop(s.x, s.y-30, '새싹! 패들 커짐', '#59b95c', 30);
        burst(s.x, s.y, '#67b955', 12);
        Sound.sprout();
      } else {
        G.paddleW = Math.max(PADDLE_MIN, G.paddleW - PADDLE_STEP);
        addPop(s.x, s.y-30, '기름! 패들 작아짐', '#4b453e', 30);
        burst(s.x, s.y, '#4b453e', 12);
        Sound.oil();
      }
      G.paddleX = Math.max(G.paddleW/2, Math.min(FIELD_W-G.paddleW/2, G.paddleX));
    }
  }
  G.items = G.items.filter(s=>!s.dead && s.y < FIELD_H+40);

  // 이펙트 감쇠
  for (const t of targets) t.hitFlash = Math.max(0, t.hitFlash - .06*dt);
  for (const p of G.pops) { p.life -= .016*dt; p.y -= .8*dt; }
  G.pops = G.pops.filter(p=>p.life>0);
  for (const p of G.parts) {
    p.life -= .025*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += .25*dt;
  }
  G.parts = G.parts.filter(p=>p.life>0);
  G.shake = Math.max(0, G.shake - .08*dt);
}

function stepBall(dt) {
  const b = G.ball;
  b.x += b.vx*dt; b.y += b.vy*dt;

  // 벽
  if (b.x < BALL_R)          { b.x = BALL_R; b.vx = Math.abs(b.vx); Sound.wall(); }
  if (b.x > FIELD_W-BALL_R)  { b.x = FIELD_W-BALL_R; b.vx = -Math.abs(b.vx); Sound.wall(); }
  if (b.y < BALL_R)          { b.y = BALL_R; b.vy = Math.abs(b.vy); Sound.wall(); }

  // 바닥 = 공 잃음
  if (b.y > FIELD_H + BALL_R*3) { loseBall(); return; }

  // 패들
  if (b.vy > 0 &&
      b.y + BALL_R >= PADDLE_Y - PADDLE_H/2 && b.y - BALL_R <= PADDLE_Y + PADDLE_H/2 &&
      Math.abs(b.x - G.paddleX) <= G.paddleW/2 + BALL_R*.6) {
    b.y = PADDLE_Y - PADDLE_H/2 - BALL_R;
    const off = (b.x - G.paddleX) / (G.paddleW/2);  // -1..1
    const ang = -Math.PI/2 + off * (Math.PI/3);      // 최대 60도
    b.vx = Math.cos(ang)*G.speed; b.vy = Math.sin(ang)*G.speed;
    Sound.paddle();
  }

  // 에너지 타겟 (원형 범퍼)
  for (const t of targets) {
    const dx = b.x - t.x, dy = b.y - t.y;
    const d = Math.hypot(dx,dy), min = t.r + BALL_R;
    if (d < min && d > 0.001) {
      const nx = dx/d, ny = dy/d;
      b.x = t.x + nx*min; b.y = t.y + ny*min;
      const dot = b.vx*nx + b.vy*ny;
      if (dot < 0) {
        b.vx -= 2*dot*nx; b.vy -= 2*dot*ny;
        // 범퍼 킥 + 약간의 랜덤
        b.vx += nx*.8 + (Math.random()-.5)*.6;
        b.vy += ny*.8;
        hitTarget(t);
      }
    }
  }
  normalizeBall();
}

/* ------------------ 데모(어트랙트) AI ------------------ */
let demoErr = 0, demoErrT = 0;
function demoDrive(dt) {
  const b = G.ball;
  demoErrT -= dt/60;
  if (demoErrT <= 0) { demoErrT = .8; demoErr = (Math.random()-.5)*70; }
  const targetX = (b.vy > 0 || b.docked) ? b.x + demoErr : FIELD_W/2 + demoErr;
  G.paddleX += (targetX - G.paddleX) * Math.min(1, .14*dt);
  G.paddleX = Math.max(G.paddleW/2, Math.min(FIELD_W-G.paddleW/2, G.paddleX));
}

/* ------------------ 렌더 ------------------ */
// 필드 배경 패턴(1회 프리렌더)
const bgCanvas = document.createElement('canvas');
bgCanvas.width = FIELD_W; bgCanvas.height = FIELD_H;
{
  const c = bgCanvas.getContext('2d');
  c.fillStyle = '#fffdf9'; c.fillRect(0,0,FIELD_W,FIELD_H);
  for (let y=0;y<FIELD_H;y+=110) for (let x=0;x<FIELD_W;x+=110) {
    c.fillStyle = ((x+y)/110)%2 ? '#faf1e6' : '#f6f4ea';
    c.beginPath(); c.arc(x+((y/110)%2?55:0), y, 5, 0, 7); c.fill();
  }
}

/* 영롱한 청록색 유리 구슬: 배경 굴절 + 광택 하이라이트 + 테두리 반사 */
function drawGlassBall(cx, cy, r) {
  ctx.save();

  // 그림자
  ctx.save();
  ctx.shadowColor = 'rgba(30,90,90,.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
  ctx.fillStyle = 'rgba(0,0,0,.001)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.restore();

  // 구슬 클립
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();

  // 바탕 청록 유리 (깊이감)
  const body = ctx.createRadialGradient(cx-r*.35, cy-r*.4, r*.1, cx+r*.15, cy+r*.25, r*1.25);
  body.addColorStop(0,   '#a9f7ef');
  body.addColorStop(.42, '#38d6cf');
  body.addColorStop(.78, '#12a6b4');
  body.addColorStop(1,   '#0b6d84');
  ctx.fillStyle = body;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);

  // 굴절: 아래쪽에 뒤집힌 배경을 살짝 비침 (렌즈 느낌)
  ctx.globalAlpha = .28;
  ctx.globalCompositeOperation = 'screen';
  const refr = ctx.createRadialGradient(cx+r*.2, cy+r*.55, r*.05, cx+r*.2, cy+r*.55, r*.9);
  refr.addColorStop(0, 'rgba(220,255,252,.9)');
  refr.addColorStop(1, 'rgba(220,255,252,0)');
  ctx.fillStyle = refr;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // 하단 가장자리 내부 반사(카우스틱) — 밝은 청록 초승달
  ctx.globalCompositeOperation = 'screen';
  const rim = ctx.createRadialGradient(cx, cy+r*.15, r*.55, cx, cy+r*.15, r);
  rim.addColorStop(0, 'rgba(120,255,240,0)');
  rim.addColorStop(.82, 'rgba(120,255,240,0)');
  rim.addColorStop(1, 'rgba(180,255,248,.85)');
  ctx.fillStyle = rim;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore(); // 클립 해제

  // 테두리 링
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(cx, cy, r-.7, 0, 7); ctx.stroke();

  // 상단 큰 하이라이트
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.ellipse(cx-r*.32, cy-r*.42, r*.30, r*.20, -.6, 0, 7); ctx.fill();
  // 작은 스파클
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.arc(cx+r*.28, cy-r*.28, r*.10, 0, 7); ctx.fill();
}

function render() {
  ctx.clearRect(0,0,FIELD_W,FIELD_H);
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random()-.5)*G.shake*10, (Math.random()-.5)*G.shake*10);
  ctx.drawImage(bgCanvas,0,0);

  // 타겟
  for (const t of targets) {
    ctx.save();
    ctx.translate(t.x, t.y);
    const k = 1 + t.hitFlash*.12;
    ctx.scale(k,k);
    ctx.shadowColor = 'rgba(90,60,30,.16)';
    ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
    ctx.drawImage(t.icon, -t.r, -t.r, t.r*2, t.r*2);
    ctx.shadowColor = 'transparent';
    if (t.found) {
      if (ICON_CIRCLE) { // 원형 칩 세트에서만 링 표시
        ctx.strokeStyle = '#59b95c'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(0,0,t.r-1,0,7); ctx.stroke();
      }
      // 체크 배지
      ctx.fillStyle = '#59b95c';
      ctx.beginPath(); ctx.arc(t.r*.66, -t.r*.66, 15, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(t.r*.66-6, -t.r*.66);
      ctx.lineTo(t.r*.66-1, -t.r*.66+5);
      ctx.lineTo(t.r*.66+7, -t.r*.66-5);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 낙하 아이템 (스케치 참조: 1_새싹아이콘_and_2_기름아이콘.jpg)
  for (const s of G.items) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.shadowColor = 'rgba(90,60,30,.15)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
    if (s.type === 'sprout') {
      // 새싹: leaf.png 이미지, 흔들림에 맞춰 낙엽처럼 기울며 나풀나풀
      ctx.rotate(Math.sin(s.t*2.2)*.5);
      if (LEAF_IMG.complete && LEAF_IMG.naturalWidth) {
        const h = 56, w = h * LEAF_IMG.width / LEAF_IMG.height;
        ctx.shadowColor='transparent';
        ctx.drawImage(LEAF_IMG, -w/2, -h/2, w, h);
      } else {
        ctx.fillStyle = '#5bbf7e';
        ctx.beginPath(); ctx.arc(0,0,20,0,7); ctx.fill();
      }
    } else {
      // 기름: capsule.png 이미지, 꾸덕하게 위아래 스트레칭(부피 보존)
      const st = 1 + .34*Math.sin(s.t*4.2);
      ctx.shadowColor='transparent';
      if (CAPSULE_IMG.complete && CAPSULE_IMG.naturalWidth) {
        const h = 62*st, w = (h*CAPSULE_IMG.width/CAPSULE_IMG.height)/st;
        ctx.drawImage(CAPSULE_IMG, -w/2, -h/2, w, h);
      } else {
        ctx.scale(1/Math.sqrt(st), st);
        ctx.fillStyle = '#3a352f';
        ctx.beginPath(); ctx.ellipse(0,0,12,22,0,0,7); ctx.fill();
      }
    }
    ctx.restore();
  }

  // 패들
  ctx.save();
  ctx.shadowColor = 'rgba(232,96,76,.35)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  const pg = ctx.createLinearGradient(0,PADDLE_Y-PADDLE_H/2,0,PADDLE_Y+PADDLE_H/2);
  pg.addColorStop(0,'#f07a63'); pg.addColorStop(1,'#e8604c');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.roundRect(G.paddleX-G.paddleW/2, PADDLE_Y-PADDLE_H/2, G.paddleW, PADDLE_H, PADDLE_H/2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath();
  ctx.roundRect(G.paddleX-G.paddleW/2+14, PADDLE_Y-PADDLE_H/2+5, G.paddleW-28, 6, 3);
  ctx.fill();

  // 공: 영롱한 청록색 유리 구슬
  const b = G.ball;
  drawGlassBall(b.x, b.y, BALL_R);

  // 발사 안내
  if (b.docked && !G.demo) {
    ctx.fillStyle = 'rgba(58,50,38,.55)';
    ctx.font = "700 26px 'Noto Sans KR'";
    ctx.textAlign = 'center';
    ctx.fillText('화면을 터치하면 공이 발사돼요', FIELD_W/2, PADDLE_Y-70);
  }

  // 파티클
  for (const p of G.parts) {
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 점수 팝업
  for (const p of G.pops) {
    ctx.globalAlpha = Math.min(1, p.life*2);
    ctx.font = `900 ${p.size}px 'Noto Sans KR'`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff';
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* =====================================================================
   입력
   ===================================================================== */
const fieldWrap = $('#fieldWrap');
function pointerToField(e) {
  const r = fieldWrap.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * FIELD_W;
}
fieldWrap.addEventListener('pointermove', e => {
  if (G.demo) return;
  G.paddleX = Math.max(G.paddleW/2, Math.min(FIELD_W-G.paddleW/2, pointerToField(e)));
});
fieldWrap.addEventListener('pointerdown', e => {
  if (G.demo) return;
  G.paddleX = Math.max(G.paddleW/2, Math.min(FIELD_W-G.paddleW/2, pointerToField(e)));
  launchBall();
});

/* 키보드 조작: ←/→ (또는 A/D) 패들 이동, Space/↑ 발사 */
const keyHeld = { left:false, right:false };
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') { keyHeld.left = true; e.preventDefault(); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { keyHeld.right = true; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (screens.game.classList.contains('on') && !G.demo) { launchBall(); e.preventDefault(); }
  }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keyHeld.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyHeld.right = false;
});
/* 키 입력에 따른 패들 이동은 step()에서 프레임 단위로 처리 */
function keyboardPaddle(dt) {
  if (G.demo) return;
  const spd = 15 * dt;
  if (keyHeld.left)  G.paddleX -= spd;
  if (keyHeld.right) G.paddleX += spd;
  if (keyHeld.left || keyHeld.right)
    G.paddleX = Math.max(G.paddleW/2, Math.min(FIELD_W-G.paddleW/2, G.paddleX));
}

/* =====================================================================
   화면 전환 / 어트랙트 / 게이트
   ===================================================================== */
function goIntro() {
  G.running = false; G.demo = false;
  $('#introBest').textContent = best.toLocaleString();
  show('intro');
}
function startGame() {
  Sound.ensure();
  resetGame(false);
  show('game');
}
function startDemo() {
  resetGame(true);
  show('game');
  $('#attractOverlay').classList.add('on');
}

$('#startBtn').addEventListener('click', startGame);
$('#againBtn').addEventListener('click', startGame);
$('#homeBtn').addEventListener('click', goIntro);
$('#restartBtn').addEventListener('click', ()=>{ if(!G.demo) resetGame(false); });
$('#quitBtn').addEventListener('click', goIntro);
// 참여 버튼은 pointerdown에서 즉시 시작 (window 캡처의 데모 해제보다 우선 처리됨)
$('#joinBtn').addEventListener('pointerdown', e=>{ e.stopPropagation(); Sound.ensure(); startGame(); });

/* ---- 유휴 감지 → 어트랙트 모드 ---- */
let idleT = 0;
setInterval(()=>{
  idleT++;
  const introOn = screens.intro.classList.contains('on');
  const resultOn = screens.result.classList.contains('on');
  if (idleT === 30 && introOn) startDemo();
  if (idleT === 20 && resultOn) goIntro();
}, 1000);
function anyInput(e) {
  idleT = 0;
  if (G.demo) {
    // 참여 버튼 터치는 자체 핸들러(startGame)가 처리하므로 데모 해제 생략
    if (e && e.target && e.target.id === 'joinBtn') return;
    goIntro();
  }
}
addEventListener('pointerdown', anyInput, true);
addEventListener('pointermove', ()=>{ idleT = 0; }, true);
addEventListener('keydown', anyInput, true);

/* ---- 풀스크린 ---- */
function goFull() {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
}
addEventListener('keydown', e=>{
  if (e.code === 'KeyF') {
    if (document.fullscreenElement) document.exitFullscreen(); else goFull();
  }
});
let firstTouch = true;
addEventListener('pointerdown', ()=>{
  Sound.ensure();
  if (firstTouch && localStorage.getItem(LS_ACCESS)) { goFull(); firstTouch = false; }
}, true);

/* ---- 비밀번호 게이트 ---- */
let pin = '';
function renderPin() {
  document.querySelectorAll('.pin-dot').forEach((el,i)=>el.classList.toggle('fill', i < pin.length));
}
{
  const pad = $('#pinPad');
  const keys = ['1','2','3','4','5','6','7','8','9','지움','0','확인'];
  for (const k of keys) {
    const btn = document.createElement('button');
    btn.textContent = k;
    btn.addEventListener('click', ()=>{
      Sound.ensure();
      if (k === '지움') pin = '';
      else if (k === '확인') checkPin();
      else if (pin.length < 4) { pin += k; if (pin.length===4) setTimeout(checkPin, 150); }
      renderPin();
    });
    pad.appendChild(btn);
  }
}
function checkPin() {
  if (pin === PIN_CODE) {
    localStorage.setItem(LS_ACCESS, '1');
    goFull();
    goIntro();
  } else {
    pin = ''; renderPin();
    const p = $('#gatePanel');
    p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
  }
}

/* =====================================================================
   초기화
   ===================================================================== */
{
  // 인트로 에너지 칩 + 체크리스트
  const strip = $('#energyStrip'), list = $('#checkList');
  for (const e of ENERGY) {
    const chip = document.createElement('div');
    chip.className = 'energy-chip';
    chip.appendChild(makeIconCanvas(e.id, e.chip, 76));
    chip.appendChild(document.createTextNode(e.name));
    strip.appendChild(chip);

    const chk = document.createElement('div');
    chk.className = 'chk';
    chk.innerHTML = `<span class="dot"></span><span>${e.name}</span>`;
    list.appendChild(chk);
    chkEls.push(chk);
  }
  // 남은 공 표시
  const row = $('#ballsRow');
  for (let i=0;i<START_BALLS;i++) {
    const d = document.createElement('div');
    d.className = 'ball-dot';
    row.appendChild(d);
  }
  $('#bestVal').textContent = best.toLocaleString();

  if (localStorage.getItem(LS_ACCESS)) goIntro();
  else show('gate');

  requestAnimationFrame(loop);
}
</script>
