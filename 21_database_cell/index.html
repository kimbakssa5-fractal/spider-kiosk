<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Database Wall · 미디어 월</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506;
    --card:#ffffff;
    --accent:#4da3ff;
    --heart:#ff4d6d;
    --ink:#0f1114;
    --muted:#8a93a0;
    --line:rgba(255,255,255,.08);
    --sans:'Noto Sans KR','Noto Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:var(--sans);color:#fff;user-select:none;-webkit-user-select:none;}
  /* 터치 키오스크: 마우스 커서 숨김(회전 디스플레이의 짜부러진 손가락 커서 등 숨김) */
  body.hide-cursor, body.hide-cursor *{cursor:none !important;}

  /* ─── 벽(Wall) : 세로 터치스크린 위를 흐르는 사진 필드 (3240×1920 = 1080×1920 ×3) ─── */
  #wall{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:
      radial-gradient(120% 100% at 50% -10%, #0c0e12 0%, #050506 60%, #000 100%);}
  #cols{position:absolute;inset:0;}
  .col{position:absolute;top:0;height:100%;will-change:transform;}
  .strip{position:absolute;top:0;left:0;width:100%;}
  .card{position:relative;width:100%;margin-bottom:var(--gap,10px);
    background:var(--card);border-radius:4px;overflow:hidden;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .25s ease, box-shadow .25s ease;}
  .card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;
    background:#e9edf2;}
  .card:hover{transform:scale(1.045);box-shadow:0 6px 22px rgba(77,163,255,.35);z-index:5;}
  .card .hb{position:absolute;right:5px;bottom:4px;font-size:11px;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.9);opacity:0;transition:opacity .2s;pointer-events:none;}
  .card:hover .hb{opacity:.9;}

  /* 스크린 사이 베젤 심(seam) */
  #seams{position:absolute;inset:0;pointer-events:none;z-index:6;display:flex;}
  #seams .screen{flex:1 1 0;position:relative;}
  #seams .screen + .screen{border-left:2px solid rgba(0,0,0,.55);
    box-shadow:inset 1px 0 0 rgba(255,255,255,.04);}
  #wall.noseam #seams{display:none;}

  /* ─── 상단 브랜드 / 하단 힌트 ─── */
  .brand{position:fixed;top:26px;right:34px;z-index:8;font-weight:300;font-size:22px;
    letter-spacing:.01em;color:#e9eef5;pointer-events:none;
    text-shadow:0 2px 12px rgba(0,0,0,.8);}
  .brand b{font-weight:800;}
  .brand .bar{display:inline-block;width:2px;height:20px;background:#fff;
    margin-left:10px;vertical-align:-3px;opacity:.85;}
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;
    font-size:14px;font-weight:400;color:rgba(255,255,255,.5);letter-spacing:.02em;
    pointer-events:none;transition:opacity .6s;animation:pulse 3.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.32}50%{opacity:.7}}

  /* ─── 확대 상세 오버레이 ─── */
  #overlay{position:fixed;inset:0;z-index:40;display:none;}
  #overlay.on{display:block;}
  /* 주변을 어둡게(스캐터가 보이도록 블러 없이) — 터치 지점만 스포트라이트 */
  #backdrop{position:absolute;inset:0;opacity:0;transition:opacity .45s;
    background:radial-gradient(circle at var(--fx,50%) var(--fy,42%),
      rgba(4,5,8,.35) 0%, rgba(3,4,6,.62) 34%, rgba(2,3,5,.82) 70%);}
  #overlay.on #backdrop{opacity:1;}

  /* 터치한 자리에 그대로 떠오르는 포커스 블록 (사진+메뉴 열 | 정보 패널) */
  #focus{position:fixed;left:0;top:0;z-index:45;display:flex;align-items:flex-start;gap:22px;
    max-width:96vw;opacity:0;transition:opacity .3s;pointer-events:none;}
  #overlay.on #focus{opacity:1;}
  #focus > *{pointer-events:auto;}
  #focus.left{flex-direction:row-reverse;}
  #focus.stack{flex-direction:column;align-items:center;gap:14px;}
  .pcol{display:flex;flex-direction:column;align-items:center;gap:14px;flex:0 0 auto;}
  .stage{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  #bigImg{display:block;border-radius:8px;object-fit:contain;background:#fff;
    box-shadow:0 30px 90px rgba(0,0,0,.75), 0 0 0 6px rgba(255,255,255,.9);}
  .stage.zoom{position:fixed;inset:0;max-width:none;z-index:60;background:rgba(0,0,0,.93);cursor:grab;}
  .stage.zoom #bigImg{width:auto!important;height:auto!important;
    max-width:96vw;max-height:94vh;border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.6);
    transform-origin:center;transition:transform .05s linear;}
  /* 전체화면 확대 중에만 뜨는 하단 닫기 버튼 (확대 오버레이 위 z70) */
  #zoomClose{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:70;display:none;
    align-items:center;gap:8px;padding:12px 24px;border-radius:44px;
    border:1px solid rgba(255,255,255,.16);background:rgba(18,20,25,.5);color:rgba(255,255,255,.82);
    font-family:inherit;font-size:15px;font-weight:500;letter-spacing:.01em;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 34px rgba(0,0,0,.45);}
  #zoomClose:hover{background:rgba(30,33,40,.66);color:#fff;}
  #overlay.zoomed #zoomClose{display:inline-flex;}

  /* 정보 패널 (포커스 사진 옆에 붙는 반투명 카드) */
  .panel{flex:0 0 auto;width:300px;max-width:88vw;color:#eef2f7;
    background:rgba(12,14,18,.72);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);}
  #focus.stack .panel{width:min(88vw,560px);}
  .panel .cat{font-size:12px;letter-spacing:.22em;color:var(--accent);font-weight:600;text-transform:uppercase;}
  .panel h2{font-size:26px;font-weight:700;line-height:1.25;margin:10px 0 6px;word-break:keep-all;}
  .panel .idx{font-size:13px;color:var(--muted);margin-bottom:18px;}
  .panel .desc{font-size:15px;line-height:1.75;color:#c7ceda;font-weight:300;
    max-height:30vh;overflow:auto;white-space:pre-wrap;word-break:keep-all;padding-right:6px;}
  .panel .desc.empty{color:#5b636f;font-style:italic;}

  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .act{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:40px;
    background:rgba(255,255,255,.07);border:1px solid var(--line);color:#eef2f7;
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:.18s;}
  .act:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);}
  .act:active{transform:scale(.96);}
  .act .ic{font-size:16px;line-height:1;}
  .act.like.liked{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.5);color:#ffdfe6;}
  .act.like.liked .ic{color:var(--heart);}
  .act .cnt{font-variant-numeric:tabular-nums;}

  /* ── 확대 사진 바로 아래 붙는 조작 바 ── */
  .touchbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    max-width:100%;padding:10px 15px;border-radius:70px;
    background:rgba(18,20,25,.92);border:1px solid var(--line);
    box-shadow:0 12px 40px rgba(0,0,0,.55);}
  .nav{width:56px;height:56px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:#fff;font-size:26px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.18s;}
  .nav:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);}
  .nav:active{transform:scale(.94);}
  .bar-sep{width:1px;height:34px;background:var(--line);flex:0 0 auto;}
  #close{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:40px;
    border:1px solid rgba(255,120,140,.4);background:rgba(255,77,109,.16);color:#ffe1e7;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:.18s;flex:0 0 auto;}
  #close .ic{font-size:17px;line-height:1;}
  #close:hover{background:rgba(255,77,109,.28);border-color:rgba(255,120,140,.7);}
  #close:active{transform:scale(.95);}

  /* ─── 관리자 편집 ─── */
  #admin-badge{position:fixed;top:26px;left:34px;z-index:8;display:none;
    font-size:12px;font-weight:700;letter-spacing:.16em;color:#0b0d10;background:var(--accent);
    padding:6px 12px;border-radius:20px;}
  #wall.admin ~ #admin-badge{display:block;}
  .gear{position:fixed;left:18px;bottom:16px;z-index:9;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:rgba(255,255,255,.4);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .gear:hover{background:rgba(255,255,255,.12);color:#fff;transform:rotate(45deg);}
  #fsBtn{bottom:56px;font-size:16px;}
  #fsBtn:hover{background:rgba(255,255,255,.12);color:#fff;transform:none;}
  body.fs #fsBtn{display:none;}   /* 이미 전체화면이면 버튼 숨김 */

  .edit{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);display:none;}
  .panel.editing .edit{display:block;}
  .panel.editing .desc,.panel.editing h2{display:none;}
  .edit label{display:block;font-size:12px;letter-spacing:.1em;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;}
  .edit input,.edit textarea{width:100%;font-family:inherit;font-size:15px;color:#fff;
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .edit input:focus,.edit textarea:focus{outline:none;border-color:var(--accent);}
  .edit textarea{min-height:120px;resize:vertical;line-height:1.6;}
  .edit .row{display:flex;gap:10px;margin-top:16px;}
  .edit .row .act.save{background:var(--accent);color:#08121f;border-color:transparent;font-weight:700;}
  .edit .exp{margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;}

  /* QR 공유 */
  #share{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(2,3,5,.8);backdrop-filter:blur(6px);}
  #share.on{display:flex;}
  .qrbox{background:#fff;color:#0f1114;border-radius:18px;padding:30px 30px 26px;text-align:center;
    width:340px;max-width:88vw;box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .qrbox h3{font-size:19px;font-weight:700;margin-bottom:4px;}
  .qrbox p{font-size:13px;color:#66707c;margin-bottom:18px;line-height:1.5;word-break:keep-all;}
  #qr{width:220px;height:220px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
  #qr img,#qr canvas{width:220px;height:220px;}
  .qrbox .lnk{font-size:12px;color:#8a93a0;word-break:break-all;line-height:1.4;}
  .qrbox .cls{margin-top:18px;background:#0f1114;color:#fff;border:none;border-radius:30px;
    padding:11px 24px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}

  #loading{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:var(--bg);color:#7b838f;font-weight:300;}
  #loading .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
    animation:bl 1s ease-in-out infinite;}
  @keyframes bl{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  #err{max-width:520px;text-align:center;font-size:14px;line-height:1.7;color:#9aa2ad;padding:0 20px;}

  /* 단축키(칸 수 등) 안내 토스트 */
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:82;
    padding:16px 30px;border-radius:44px;background:rgba(18,20,25,.86);color:#fff;
    font-size:22px;font-weight:600;letter-spacing:.02em;opacity:0;pointer-events:none;
    transition:opacity .18s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 14px 44px rgba(0,0,0,.5);}
  #toast.show{opacity:1;}

  /* 상단 숨김 단축키 터치영역 (높이 10px) */
  #hotzones{position:fixed;top:0;left:0;width:100%;height:10px;z-index:12;display:flex;}
  #hotzones .hz{flex:1 1 0;position:relative;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  #hotzones .hz span{opacity:0;font-size:24px;font-weight:800;color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none;transition:opacity .15s;}
  #hotzones .hz:active{background:rgba(255,255,255,.16);}     /* 숨김 상태에서도 눌림 피드백 */
  /* 관리자 모드: 빨강/파랑 교차 가이드 + 라벨 표시 */
  #wall.admin ~ #hotzones{height:60px;}
  #wall.admin ~ #hotzones .hz{border-right:1px solid rgba(255,255,255,.28);}
  #wall.admin ~ #hotzones .hz.even{background:rgba(214,40,40,.5);}
  #wall.admin ~ #hotzones .hz.odd{background:rgba(40,84,220,.5);}
  #wall.admin ~ #hotzones .hz span{opacity:1;}
  #hotzones .hz.sel span{color:var(--accent);}
  #wall.admin ~ #hotzones .hz.sel{outline:2px solid var(--accent);outline-offset:-2px;}

  @media (max-width:820px){
    .panel h2{font-size:21px;} .panel .desc{max-height:18vh;} .panel{padding:16px 18px;}
    .brand{font-size:17px;top:16px;right:18px;}
    .touchbar{gap:8px;padding:9px 12px;}
    .nav{width:48px;height:48px;font-size:22px;}
    .act{padding:10px 13px;font-size:13px;} #close{padding:11px 16px;font-size:14px;}
  }
</style>
</head>
<body>
  <div id="wall">
    <div id="cols"></div>
    <div id="seams"></div>
  </div>
  <!-- 상단 숨김 단축키 터치영역(1~9, q w e r t y u i o = TV당 1~18칸). 관리자 모드에서만 라벨 표시 -->
  <div id="hotzones"></div>
  <div id="admin-badge">● ADMIN</div>
  <div class="brand"><b>미디어</b> 월<span class="bar"></span></div>
  <div class="hint" id="hint">사진을 터치하면 확대되고 정보가 나타납니다</div>
  <div class="gear" id="gear" title="관리자">⚙</div>
  <div class="gear" id="fsBtn" title="전체화면 (F)">⛶</div>

  <!-- 확대 상세 -->
  <div id="overlay">
    <div id="backdrop"></div>
    <div id="focus">
      <!-- 사진 + 그 하단에 붙는 조작 메뉴 -->
      <div class="pcol">
        <div class="stage" id="stage"><img id="bigImg" alt=""></div>
        <div class="touchbar">
          <button class="nav" id="prev" aria-label="이전">‹</button>
          <div class="actions">
            <button class="act like" id="bLike"><span class="ic">♥</span><span class="cnt" id="likeCnt">0</span></button>
            <button class="act" id="bShare"><span class="ic">↗</span> 공유</button>
            <button class="act" id="bZoom"><span class="ic">⤢</span> 확대</button>
            <button class="act" id="bEdit" style="display:none"><span class="ic">✎</span> 편집</button>
          </div>
          <button class="nav" id="next" aria-label="다음">›</button>
          <span class="bar-sep"></span>
          <button id="close" aria-label="닫기"><span class="ic">✕</span> 닫기</button>
        </div>
      </div>
      <div class="panel" id="panel">
        <div class="cat">DATABASE</div>
        <h2 id="pTitle"></h2>
        <div class="idx" id="pIdx"></div>
        <div class="desc" id="pDesc"></div>
        <!-- 관리자 편집 폼 -->
        <div class="edit" id="editForm">
          <label>제목</label>
          <input id="eTitle" type="text" maxlength="80">
          <label>내용</label>
          <textarea id="eDesc" maxlength="1200"></textarea>
          <label>좋아요 (기준값)</label>
          <input id="eLikes" type="number" min="0" style="width:140px">
          <div class="row">
            <button class="act save" id="eSave">저장</button>
            <button class="act" id="eCancel">취소</button>
          </div>
          <div class="exp" id="eExport">모든 정보 info.json 내보내기</div>
        </div>
      </div>
    </div>
    <!-- 전체화면 확대 중에만 뜨는 하단 닫기 버튼 -->
    <button id="zoomClose" aria-label="확대 닫기">화면의 아무 곳을 누르면 창을 닫습니다</button>
  </div>

  <!-- QR 공유 -->
  <div id="share">
    <div class="qrbox">
      <h3>QR로 담아가기</h3>
      <p>휴대폰으로 QR을 스캔하면 이 사진과 정보를 볼 수 있어요.</p>
      <div id="qr"></div>
      <div class="lnk" id="qrlnk"></div>
      <button class="cls" id="qrClose">닫기</button>
    </div>
  </div>

  <div id="loading"><div class="dot"></div><div>데이터베이스를 불러오는 중…</div>
    <div id="err"></div></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   21_Database cell — 미디어 월 (Database Wall)
   database/ 폴더의 사진을 자동 배치·흐름, 터치 확대·정보, 관리자 편집
   ════════════════════════════════════════════════════════════ */
const ADMIN_PIN = '0000';          // 관리자 PIN (?admin=1 로도 진입)
const SCREENS   = 3;               // 세로 스크린 대수 (1080×1920 ×3 = 3240×1920, 75" TV 3대)
// TV 1대당 칸 수 단축키(순서 = 1~18칸): 1~9 그리고 상단 열 q w e r t y u i o
const COL_KEYS  = ['1','2','3','4','5','6','7','8','9','q','w','e','r','t','y','u','i','o'];
// 물리 키(e.code) 기준 매핑 — 한글 입력(IME) 상태에서도 동작하도록
const COL_CODES = {KeyQ:10,KeyW:11,KeyE:12,KeyR:13,KeyT:14,KeyY:15,KeyU:16,KeyI:17,KeyO:18};
function keyToPerScreen(e){
  if(COL_CODES[e.code]) return COL_CODES[e.code];            // q~o = 10~18
  const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || '');  // 1~9 (상단/넘패드)
  if(m) return +m[1];
  if(/^[1-9]$/.test(e.key)) return +e.key;                   // 최후 보루
  return 0;
}
const $ = s => document.querySelector(s);

const state = {
  photos: [], byId: {}, order: [],
  overrides: load('dbwall_overrides', {}),   // 관리자 편집 {id:{title,content,likes}}
  userLikes: load('dbwall_likes', {}),       // 방문자 좋아요 {id:delta}
  admin: false, cur: -1, fromEl: null, editing: false,
  touch: {x:0, y:0}, imgW: 0, imgH: 0,   // 터치 지점 · 확대 사진 표시크기
  perScreen: load('dbwall_perscreen', null),   // TV 1대당 칸 수(1~9, null=자동)
  speedMul: load('dbwall_speed', 1),           // 흐름 속도 배율(z=1, x=2, c=4)
};
function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ── 데이터 로드: manifest.json ← info.json ← localStorage ── */
async function boot(){
  let manifest;
  try{
    manifest = await (await fetch('manifest.json?_=' + Date.now())).json();
  }catch(e){
    $('#err').innerHTML = 'manifest.json 을 불러오지 못했습니다.<br>먼저 <b>python build_manifest.py</b> 를 실행하고, ' +
      '이 페이지를 <b>웹 서버(http)</b>로 열어주세요. (file:// 로는 동작하지 않습니다)';
    return;
  }
  let info = {};
  try{ info = await (await fetch('info.json?_=' + Date.now())).json(); }catch(e){}

  state.photos = (manifest.photos || []).map(p => {
    const o = state.overrides[p.id] || {};
    const i = (info && info[p.id]) || {};
    return {
      id: p.id, thumb: p.thumb, full: p.full, w: p.w||1, h: p.h||1,
      title:   o.title   ?? i.title   ?? p.title ?? p.id,
      content: o.content ?? i.content ?? p.content ?? '',
      likes:  +(o.likes   ?? i.likes   ?? p.likes ?? 0),
    };
  });
  state.photos.forEach(p => state.byId[p.id] = p);
  state.order = state.photos.map(p => p.id);

  if(!state.photos.length){ $('#err').textContent = 'database/ 폴더에 사진이 없습니다.'; return; }
  if(new URLSearchParams(location.search).get('admin') === '1') setAdmin(true);

  buildWall();
  $('#loading').style.display = 'none';
  startFlow();

  // QR 공유 링크로 들어온 경우 자동 확대
  const ph = new URLSearchParams(location.search).get('photo');
  if(ph && state.byId[ph]) setTimeout(() => openPhoto(ph, null), 300);
}

/* ══════════ 흐르는 벽 만들기 ══════════ */
const flow = { cols: [], raf: 0, last: 0, paused: false };

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildWall(){
  const wall = $('#cols'); wall.innerHTML = '';
  flow.cols = [];
  const W = innerWidth, H = innerHeight;
  const gap = Math.max(5, Math.round(W/300));
  // TV 1대당 칸 수: 단축키 1~9로 지정(state.perScreen) → 없으면 폭 기준 자동
  let nCols;
  if(state.perScreen){
    nCols = SCREENS * state.perScreen;                // 스크린 수 × TV당 칸 수 (심에 정확히 정렬)
  } else {
    const target = W < 700 ? 116 : 132;               // 목표 컬럼 폭(px) → 촘촘한 벽
    nCols = Math.max(4, Math.round(W / target));
  }
  const realColW = W / nCols;

  // 셔플된 사진을 여러 컬럼에 순환 배치
  let pool = shuffle(state.order);
  if(pool.length < nCols*8) pool = pool.concat(shuffle(state.order), shuffle(state.order), shuffle(state.order));
  let pi = 0;

  for(let c=0;c<nCols;c++){
    const col = document.createElement('div');
    col.className = 'col';
    col.style.left  = (c*realColW) + 'px';
    col.style.width = realColW + 'px';
    col.style.setProperty('--gap', gap+'px');
    const inner = Math.max(96, realColW - gap*1.4);
    const pad = (realColW - inner)/2;

    const strip = document.createElement('div');
    strip.className = 'strip';
    strip.style.padding = `0 ${pad}px`;

    // 한 사이클이 화면 높이보다 충분히 크도록 카드 채우기
    let hAcc = 0, guard = 0; const cardHs = [];
    while(hAcc < H*1.25 && guard++ < 400){
      const id = pool[pi++ % pool.length];
      const p = state.byId[id];
      const ch = Math.round(inner * (p.h/p.w));
      cardHs.push([id, ch]);
      hAcc += ch + gap;
    }
    const cycleH = hAcc;
    // 이음매 없는 무한 스크롤용 2회 복제
    for(let rep=0; rep<2; rep++){
      for(const [id, ch] of cardHs){
        strip.appendChild(makeCard(id, ch));
      }
    }
    col.appendChild(strip);
    wall.appendChild(col);

    flow.cols.push({
      strip, cycleH,
      offset: -Math.random()*cycleH,
      speed: 9 + Math.random()*14,          // px/s, 완만한 위로 흐름
    });
  }

  // 스크린 분할 심(seam) — 세로 스크린 SCREENS대
  const seams = $('#seams'); seams.innerHTML = '';
  for(let i=0;i<SCREENS;i++){ const s=document.createElement('div'); s.className='screen'; seams.appendChild(s); }
}

function makeCard(id, ch){
  const p = state.byId[id];
  const el = document.createElement('div');
  el.className = 'card';
  el.style.height = ch + 'px';
  el.dataset.id = id;
  const img = new Image();
  img.loading = 'lazy'; img.decoding = 'async';
  img.src = p.thumb; img.alt = p.title;
  el.appendChild(img);
  return el;
}

function startFlow(){
  cancelAnimationFrame(flow.raf);
  flow.last = performance.now();
  const step = (t) => {
    const dt = Math.min(0.05, (t - flow.last)/1000); flow.last = t;
    if(!flow.paused){
      const sp = state.speedMul;
      for(const c of flow.cols){
        c.offset -= c.speed*sp*dt;
        if(c.offset <= -c.cycleH) c.offset += c.cycleH;
        c.strip.style.transform = `translateY(${c.offset}px)`;
      }
    }
    flow.raf = requestAnimationFrame(step);
  };
  flow.raf = requestAnimationFrame(step);
}

let rzTmr;
addEventListener('resize', () => { clearTimeout(rzTmr); rzTmr = setTimeout(() => {
  buildWall(); flow.last = performance.now();
}, 220); });

/* TV 1대당 칸 수 지정(1~9칸, q w e r t y u i o=10~18칸). 같은 값 재입력 시 자동 복귀. */
function setPerScreen(n){
  state.perScreen = (state.perScreen === n) ? null : n;
  save('dbwall_perscreen', state.perScreen);
  buildWall(); flow.last = performance.now();
  markHotzone();
  toast(state.perScreen ? `TV 1대당 ${n}칸` : '칸 수 자동');
}
function markHotzone(){
  document.querySelectorAll('#hotzones .hz').forEach(c =>
    c.classList.toggle('sel', +c.dataset.val === state.perScreen));
}
/* 흐름 속도 배율(z=1, x=2, c=4) */
function setSpeed(m){
  state.speedMul = m; save('dbwall_speed', m);
  toast(m === 1 ? '기본 속도' : m + '배속');
}
/* 상단 숨김 단축키 터치영역 18칸(1~9, q w e r t y u i o) 생성 */
(function buildHotzones(){
  const hz = document.getElementById('hotzones'); if(!hz) return;
  for(let i=0;i<COL_KEYS.length;i++){
    const val = i + 1;                                   // 1~18
    const label = COL_KEYS[i];                            // 1~9, q~o
    const c = document.createElement('div');
    c.className = 'hz ' + (i % 2 ? 'odd' : 'even');
    c.dataset.val = val;
    c.innerHTML = '<span>' + label + '</span>';
    c.addEventListener('click', () => setPerScreen(val));
    hz.appendChild(c);
  }
  markHotzone();
})();
let toastTmr;
function toast(msg){
  let el = $('#toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTmr); toastTmr = setTimeout(() => el.classList.remove('show'), 1300);
}

/* ══════════ 카드 클릭 → 확대 ══════════ */
$('#cols').addEventListener('click', e => {
  const card = e.target.closest('.card'); if(!card) return;
  openPhoto(card.dataset.id, card);
});

function openPhoto(id, fromEl){
  const idx = state.order.indexOf(id); if(idx<0) return;
  state.cur = idx; state.fromEl = fromEl; flow.paused = true;

  // 터치 지점(카드 중심) 기록 → 그 자리에 확대
  const pt = touchPoint(fromEl);
  state.touch = pt;
  const fromRect = fromEl ? fromEl.getBoundingClientRect() : null;
  if(fromEl) fromEl.style.visibility = 'hidden';   // 원본 카드는 확대사진 뒤에서 숨김

  renderDetail();
  const ov = $('#overlay'); ov.classList.add('on');   // 먼저 표시해야 크기 측정이 정확
  ov.style.setProperty('--fx', (pt.x/innerWidth*100)+'%');
  ov.style.setProperty('--fy', (pt.y/innerHeight*100)+'%');
  layoutFocus();                                   // 사진+정보를 터치 자리에 배치
  $('#hint').style.opacity = 0;
  scatter(pt.x, pt.y, true);                        // 주변 카드 방사형으로 밀어내기(팝아웃)
  flipIn(fromRect);                                 // 카드 위치에서 자라나는 애니메이션
}

function touchPoint(fromEl){
  if(fromEl){ const r = fromEl.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
  return {x:innerWidth/2, y:innerHeight*0.42};
}

/* 확대 사진 + 정보 패널을 터치 지점에 배치(화면 밖으로 안 나가게 clamp) */
function layoutFocus(){
  const focus=$('#focus'), stage=$('#stage'), img=$('#bigImg'), panel=$('#panel');
  const W=innerWidth, H=innerHeight, M=22;
  const p = state.byId[state.order[state.cur]];
  const stack = W < 820;
  const maxW = stack ? Math.min(560, W*0.84) : Math.max(240, Math.min(560, W*0.42));
  const maxH = stack ? H*0.42 : H*0.62;
  let dw=maxW, dh=dw*p.h/p.w; if(dh>maxH){ dh=maxH; dw=dh*p.w/p.h; }
  dw=Math.round(dw); dh=Math.round(dh);
  state.imgW=dw; state.imgH=dh;
  img.style.width=dw+'px'; img.style.height=dh+'px';
  panel.style.width = stack ? Math.min(560, W*0.84)+'px' : '300px';

  const pt = state.touch;
  focus.classList.toggle('stack', stack);
  focus.classList.toggle('left', !stack && pt.x > W*0.52);   // 오른쪽 터치면 패널을 왼쪽에

  focus.style.left='0px'; focus.style.top='0px';             // 측정용
  const fr=focus.getBoundingClientRect(), pr=stage.getBoundingClientRect();
  const offX=(pr.left-fr.left)+pr.width/2, offY=(pr.top-fr.top)+pr.height/2;
  let left = pt.x - offX, top = pt.y - offY;
  left = Math.max(M, Math.min(left, W - fr.width - M));
  top  = Math.max(M, Math.min(top,  H - fr.height - M));
  focus.style.left=left+'px'; focus.style.top=top+'px';
}

/* 주변 카드 방사형 팝아웃 + 크기 그라데이션(가까운 사진일수록 크게) */
function scatter(cx, cy, on){
  const cards = document.querySelectorAll('#cols .card');
  const R = Math.min(innerWidth, innerHeight) * 0.55;   // 영향 반경
  const MAX = Math.min(innerWidth, innerHeight) * 0.5;  // 최대 밀어냄
  const GROW = 0.75;                                    // 가까운 주변 사진 최대 확대량
  cards.forEach(card => {
    if(!on){ card.style.transition=''; card.style.transitionDelay=''; card.style.transform=''; card.style.zIndex=''; return; }
    if(card === state.fromEl) return;                   // 확대된 원본은 그대로
    const r=card.getBoundingClientRect();
    const dx=(r.left+r.width/2)-cx, dy=(r.top+r.height/2)-cy;
    const d=Math.hypot(dx,dy)||1;
    const k=Math.exp(-d/R);                             // 0~1, 가까울수록 큼
    const m=MAX*k, ux=dx/d, uy=dy/d;
    card.style.transition='transform .6s cubic-bezier(.16,.9,.24,1)';
    card.style.transitionDelay=(Math.min(d,700)*0.00035)+'s';   // 거리 기반 물결 지연
    card.style.transform=`translate(${ux*m}px,${uy*m}px) scale(${1 + GROW*k})`;  // 가까울수록 확대
    card.style.zIndex = Math.round(k*100);              // 가까운(큰) 카드가 위로
  });
}

/* FLIP: 카드 위치/크기에서 확대 사진으로 자라나기 */
function flipIn(fromRect){
  const img = $('#bigImg');
  const run = () => {
    if(!fromRect) return;
    const last = img.getBoundingClientRect(); if(!last.width) return;
    const dx=fromRect.left-last.left, dy=fromRect.top-last.top;
    const sx=fromRect.width/last.width, sy=fromRect.height/last.height;
    img.animate(
      [{transformOrigin:'top left', transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity:.55},
       {transform:'none', opacity:1}],
      {duration:460, easing:'cubic-bezier(.2,.85,.25,1)'});
  };
  if(img.complete) run(); else img.onload = run;
}

function renderDetail(){
  const p = state.byId[state.order[state.cur]];
  $('#bigImg').src = p.full; $('#bigImg').alt = p.title;
  $('#pTitle').textContent = p.title;
  $('#pIdx').textContent = `${state.cur+1} / ${state.order.length}`;
  const d = $('#pDesc');
  if(p.content && p.content.trim()){ d.textContent = p.content; d.classList.remove('empty'); }
  else { d.textContent = '등록된 설명이 없습니다.'; d.classList.add('empty'); }
  // 좋아요
  const total = (p.likes||0) + (state.userLikes[p.id]||0);
  $('#likeCnt').textContent = total.toLocaleString();
  $('#bLike').classList.toggle('liked', !!state.userLikes[p.id]);
  // 편집 폼 초기화
  $('#panel').classList.remove('editing'); state.editing = false;
  $('#bEdit').style.display = state.admin ? 'inline-flex' : 'none';
  $('#eTitle').value = p.title; $('#eDesc').value = p.content||''; $('#eLikes').value = p.likes||0;
}

/* FLIP: 카드 위치에서 중앙으로 자라나는 확대 */
function flipIn(fromEl){
  const img = $('#bigImg');
  img.onload = img.complete ? run() : (img.onload = run);
  function run(){
    if(!fromEl) return;
    const first = fromEl.getBoundingClientRect();
    const last = img.getBoundingClientRect();
    if(!last.width) return;
    const dx = first.left - last.left, dy = first.top - last.top;
    const sx = first.width/last.width, sy = first.height/last.height;
    img.animate(
      [{transformOrigin:'top left', transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity:.6},
       {transform:'none', opacity:1}],
      {duration:440, easing:'cubic-bezier(.2,.8,.2,1)'});
  }
}

function closePhoto(){
  const ov = $('#overlay'); const img = $('#bigImg'); const fromEl = state.fromEl;
  exitZoom();
  scatter(0, 0, false);                      // 밀려났던 카드들 제자리로 복귀
  let closed = false;
  const done = () => {                       // 애니메이션 성공/실패와 무관하게 반드시 닫힘 보장
    if(closed) return; closed = true;
    ov.classList.remove('on'); flow.paused = false;
    if(fromEl) fromEl.style.visibility = '';  // 원본 카드 복원
    img.style.width=''; img.style.height='';
  };
  if(fromEl){
    const target = fromEl.getBoundingClientRect();
    const last = img.getBoundingClientRect();
    if(last.width && target.width){
      const dx = target.left - last.left, dy = target.top - last.top;
      const sx = target.width/last.width, sy = target.height/last.height;
      const a = img.animate(
        [{transform:'none', opacity:1},
         {transformOrigin:'top left', transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity:.4}],
        {duration:360, easing:'cubic-bezier(.4,0,.2,1)'});
      a.onfinish = done; a.oncancel = done;
      setTimeout(done, 400);                 // 탭 비활성/렌더러 지연 대비 안전망
      return;
    }
  }
  done();
}

function step(dir){
  state.cur = (state.cur + dir + state.order.length) % state.order.length;
  const img = $('#bigImg');
  renderDetail();
  layoutFocus();                             // 사진 비율이 달라져도 같은 자리에 다시 배치
  img.animate([{opacity:.2},{opacity:1}],{duration:300,easing:'ease'});
}

/* ══════════ 좋아요 / 공유 / 확대 ══════════ */
$('#bLike').addEventListener('click', () => {
  const p = state.byId[state.order[state.cur]];
  if(state.userLikes[p.id]){ delete state.userLikes[p.id]; }
  else { state.userLikes[p.id] = 1; }
  save('dbwall_likes', state.userLikes);
  const total = (p.likes||0) + (state.userLikes[p.id]||0);
  $('#likeCnt').textContent = total.toLocaleString();
  $('#bLike').classList.toggle('liked', !!state.userLikes[p.id]);
  if(state.userLikes[p.id]) burst($('#bLike'));
});
function burst(btn){
  const r = btn.getBoundingClientRect();
  for(let i=0;i<8;i++){
    const s=document.createElement('div'); s.textContent='♥';
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top}px;color:var(--heart);
      font-size:${12+Math.random()*10}px;pointer-events:none;z-index:99;`;
    document.body.appendChild(s);
    const a=(Math.random()-0.5)*90;
    s.animate([{transform:'translate(0,0)',opacity:1},
      {transform:`translate(${a}px,${-50-Math.random()*50}px)`,opacity:0}],
      {duration:700+Math.random()*400,easing:'ease-out'}).onfinish=()=>s.remove();
  }
}

/* 공유 → QR */
$('#bShare').addEventListener('click', () => {
  const p = state.byId[state.order[state.cur]];
  const url = location.origin + location.pathname + '?photo=' + p.id;
  $('#qrlnk').textContent = url;
  const box = $('#qr'); box.innerHTML='';
  makeQR(box, url);
  $('#share').classList.add('on');
});
$('#qrClose').addEventListener('click', () => $('#share').classList.remove('on'));
$('#share').addEventListener('click', e => { if(e.target.id==='share') $('#share').classList.remove('on'); });

function makeQR(box, url){
  // 1) qrcodejs CDN → 2) qrserver 이미지 API → 3) 링크만
  if(window.QRCode){ new QRCode(box, {text:url, width:220, height:220, correctLevel:QRCode.CorrectLevel.M}); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js';
  s.onload = () => { box.innerHTML=''; new QRCode(box, {text:url, width:220, height:220}); };
  s.onerror = () => {
    const img = new Image();
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
    img.onerror = () => box.innerHTML = '<div style="font-size:12px;color:#66707c">QR 생성 실패 — 아래 링크를 이용하세요</div>';
    box.appendChild(img);
  };
  document.head.appendChild(s);
}

/* 확대(줌/팬) — 전체화면 확대 시 하단 닫기 버튼 표시, 사진/빈곳 탭으로도 해제 */
const zoom = { on:false, scale:1, x:0, y:0, drag:false, px:0, py:0, downX:0, downY:0, moved:false };
function enterZoom(){ $('#stage').classList.add('zoom'); $('#overlay').classList.add('zoomed'); zoom.on=true; zoom.scale=1; applyZoom(); }
function exitZoom(){ $('#stage').classList.remove('zoom'); $('#overlay').classList.remove('zoomed'); resetZoom(); }
$('#bZoom').addEventListener('click', () => {
  $('#stage').classList.contains('zoom') ? exitZoom() : enterZoom();
});
$('#zoomClose').addEventListener('click', exitZoom);
function resetZoom(){ zoom.on=false; zoom.scale=1; zoom.x=0; zoom.y=0; $('#bigImg').style.transform=''; }
function applyZoom(){ $('#bigImg').style.transform = `translate(${zoom.x}px,${zoom.y}px) scale(${zoom.scale})`; }
$('#stage').addEventListener('wheel', e => {
  if(!zoom.on) return; e.preventDefault();
  zoom.scale = Math.min(6, Math.max(1, zoom.scale * (e.deltaY<0?1.12:0.89)));
  if(zoom.scale===1){ zoom.x=0; zoom.y=0; } applyZoom();
}, {passive:false});
$('#stage').addEventListener('pointerdown', e => {
  if(!zoom.on) return;
  zoom.downX=e.clientX; zoom.downY=e.clientY; zoom.moved=false;
  if(zoom.scale>1){ zoom.drag=true; zoom.px=e.clientX; zoom.py=e.clientY; $('#stage').style.cursor='grabbing'; }
});
addEventListener('pointermove', e => {
  if(!zoom.drag) return;
  if(Math.abs(e.clientX-zoom.downX)>6 || Math.abs(e.clientY-zoom.downY)>6) zoom.moved=true;
  zoom.x += e.clientX-zoom.px; zoom.y += e.clientY-zoom.py; zoom.px=e.clientX; zoom.py=e.clientY; applyZoom();
});
addEventListener('pointerup', e => {
  const wasDrag = zoom.drag; zoom.drag=false; if($('#stage')) $('#stage').style.cursor='grab';
  // 전체화면 확대 중 (드래그 아닌) 탭 → 확대 해제
  if(zoom.on && $('#stage').classList.contains('zoom') && !zoom.moved && !(wasDrag && zoom.moved)){
    const onStage = e.target && (e.target.id==='bigImg' || e.target.id==='stage');
    if(onStage){ exitZoom(); }
  }
});

/* ══════════ 관리자 ══════════ */
function setAdmin(on){
  state.admin = on;
  $('#wall').classList.toggle('admin', on);
  $('#admin-badge').style.display = on ? 'block' : 'none';
  if($('#overlay').classList.contains('on')) $('#bEdit').style.display = on?'inline-flex':'none';
}
$('#gear').addEventListener('click', () => {
  if(state.admin){ setAdmin(false); return; }
  const pin = prompt('관리자 PIN을 입력하세요');
  if(pin === ADMIN_PIN) setAdmin(true);
  else if(pin !== null) alert('PIN이 올바르지 않습니다.');
});
$('#bEdit').addEventListener('click', () => { $('#panel').classList.add('editing'); state.editing=true; $('#eTitle').focus(); });
$('#eCancel').addEventListener('click', () => { $('#panel').classList.remove('editing'); state.editing=false; });
$('#eSave').addEventListener('click', () => {
  const p = state.byId[state.order[state.cur]];
  p.title = $('#eTitle').value.trim() || p.title;
  p.content = $('#eDesc').value;
  p.likes = Math.max(0, parseInt($('#eLikes').value)||0);
  state.overrides[p.id] = { title:p.title, content:p.content, likes:p.likes };
  save('dbwall_overrides', state.overrides);
  $('#panel').classList.remove('editing'); state.editing=false;
  renderDetail();
});
$('#eExport').addEventListener('click', () => {
  // 모든 편집 내용을 info.json 형태로 내보내기 (배포 시 함께 올리면 전 기기 공통 적용)
  const out = {};
  state.photos.forEach(p => { out[p.id] = { title:p.title, content:p.content, likes:p.likes }; });
  const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'info.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
});

/* ══════════ 공통 컨트롤 ══════════ */
$('#close').addEventListener('click', closePhoto);
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
$('#backdrop').addEventListener('click', closePhoto);
addEventListener('keydown', e => {
  if($('#share').classList.contains('on')){ if(e.key==='Escape') $('#share').classList.remove('on'); return; }
  if(!$('#overlay').classList.contains('on')){
    // 칸 수: 1~9 = 1~9칸,  q w e r t y u i o = 10~18칸 (TV 1대당). 같은 값 재입력 시 자동 복귀.
    const n = keyToPerScreen(e);                   // 물리 키 기준(IME 무관)
    if(n) setPerScreen(n);
    else if(e.code==='KeyZ') setSpeed(1);          // 현재(기본) 속도
    else if(e.code==='KeyX') setSpeed(2);          // 2배속
    else if(e.code==='KeyC') setSpeed(4);          // 4배속
    else if(e.code==='KeyV') setSpeed(8);          // 8배속
    else if(e.code==='KeyB') setSpeed(16);         // 16배속
    else if(e.code==='KeyA' && e.shiftKey) setAdmin(!state.admin);  // Shift+A: 관리자
    else if(e.code==='KeyF' && e.shiftKey) toggleFS();             // Shift+F: 전체화면
    return;
  }
  if(state.editing) return;
  if(e.key==='Escape') { if($('#stage').classList.contains('zoom')){ exitZoom(); } else closePhoto(); }
  else if(e.key==='ArrowLeft') step(-1);
  else if(e.key==='ArrowRight') step(1);
});

/* ══════════ 자동 전체화면 ══════════ */
function isFS(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function requestFS(){
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(fn && !isFS()){ try{ const r = fn.call(el); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
}
function exitFS(){
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if(fn && isFS()){ try{ fn.call(document); }catch(e){} }
}
function toggleFS(){ isFS() ? exitFS() : requestFS(); }
$('#fsBtn').addEventListener('click', toggleFS);
['fullscreenchange','webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => document.body.classList.toggle('fs', isFS())));

// 링크를 열면 자동 전체화면: 로드 시 시도(대부분 차단됨) + 첫 사용자 동작에서 확실히 진입
requestFS();
['pointerdown','touchstart','keydown','click'].forEach(ev =>
  window.addEventListener(ev, requestFS, {once:true, capture:true}));

/* 마우스 커서 숨김 — 키오스크(?kiosk=1)는 항상 숨김, 그 외엔 4초 무동작 시 숨김.
   (회전 디스플레이에서 하드웨어 손가락/화살표 커서가 세로로 짜부러져 보이는 현상 대응) */
(function(){
  const kiosk = new URLSearchParams(location.search).get('kiosk') === '1';
  const hide = () => document.body.classList.add('hide-cursor');
  if(kiosk){ hide(); return; }
  let t; const show = () => { document.body.classList.remove('hide-cursor'); clearTimeout(t); t=setTimeout(hide, 4000); };
  show(); addEventListener('mousemove', show, {passive:true});
})();

boot();
</script>
