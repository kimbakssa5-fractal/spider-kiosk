<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Database Wall · 미디어 월</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506;
    --card:#ffffff;
    --accent:#4da3ff;
    --heart:#ff4d6d;
    --ink:#0f1114;
    --muted:#8a93a0;
    --line:rgba(255,255,255,.08);
    --sans:'Noto Sans KR','Noto Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:var(--sans);color:#fff;user-select:none;-webkit-user-select:none;}

  /* ─── 벽(Wall) : 5분할 터치스크린 위를 흐르는 사진 필드 ─── */
  #wall{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(120% 100% at 50% -10%, #0c0e12 0%, #050506 60%, #000 100%);}
  #cols{position:absolute;inset:0;}
  .col{position:absolute;top:0;height:100%;will-change:transform;}
  .strip{position:absolute;top:0;left:0;width:100%;}
  .card{position:relative;width:100%;margin-bottom:var(--gap,10px);
    background:var(--card);border-radius:4px;overflow:hidden;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .25s ease, box-shadow .25s ease;}
  .card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;
    background:#e9edf2;}
  .card:hover{transform:scale(1.045);box-shadow:0 6px 22px rgba(77,163,255,.35);z-index:5;}
  .card .hb{position:absolute;right:5px;bottom:4px;font-size:11px;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.9);opacity:0;transition:opacity .2s;pointer-events:none;}
  .card:hover .hb{opacity:.9;}

  /* 5개 스크린 사이 베젤 심(seam) */
  #seams{position:absolute;inset:0;pointer-events:none;z-index:6;display:flex;}
  #seams .screen{flex:1 1 0;position:relative;}
  #seams .screen + .screen{border-left:2px solid rgba(0,0,0,.55);
    box-shadow:inset 1px 0 0 rgba(255,255,255,.04);}
  #wall.noseam #seams{display:none;}

  /* ─── 상단 브랜드 / 하단 힌트 ─── */
  .brand{position:fixed;top:26px;right:34px;z-index:8;font-weight:300;font-size:22px;
    letter-spacing:.01em;color:#e9eef5;pointer-events:none;
    text-shadow:0 2px 12px rgba(0,0,0,.8);}
  .brand b{font-weight:800;}
  .brand .bar{display:inline-block;width:2px;height:20px;background:#fff;
    margin-left:10px;vertical-align:-3px;opacity:.85;}
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;
    font-size:14px;font-weight:400;color:rgba(255,255,255,.5);letter-spacing:.02em;
    pointer-events:none;transition:opacity .6s;animation:pulse 3.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.32}50%{opacity:.7}}

  /* ─── 확대 상세 오버레이 ─── */
  #overlay{position:fixed;inset:0;z-index:40;display:none;}
  #overlay.on{display:block;}
  #backdrop{position:absolute;inset:0;background:rgba(2,3,5,.82);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .4s;}
  #overlay.on #backdrop{opacity:1;}

  .detail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:38px;padding:4vh 6vw 132px;}
  .stage{position:relative;flex:0 1 auto;max-width:60vw;max-height:78vh;display:flex;
    align-items:center;justify-content:center;}
  #bigImg{max-width:60vw;max-height:78vh;border-radius:8px;object-fit:contain;
    background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.7);}
  .stage.zoom{position:fixed;inset:0;max-width:none;z-index:60;background:rgba(0,0,0,.92);cursor:grab;}
  .stage.zoom #bigImg{max-width:100vw;max-height:100vh;border-radius:0;box-shadow:none;
    transform-origin:center;transition:transform .05s linear;}

  /* 정보 패널 */
  .panel{flex:0 0 340px;max-width:36vw;color:#eef2f7;opacity:0;transform:translateY(14px);
    transition:opacity .45s .1s, transform .45s .1s;}
  #overlay.on .panel{opacity:1;transform:none;}
  .panel .cat{font-size:12px;letter-spacing:.22em;color:var(--accent);font-weight:600;text-transform:uppercase;}
  .panel h2{font-size:30px;font-weight:700;line-height:1.25;margin:10px 0 6px;word-break:keep-all;}
  .panel .idx{font-size:13px;color:var(--muted);margin-bottom:18px;}
  .panel .desc{font-size:15px;line-height:1.75;color:#c7ceda;font-weight:300;
    max-height:30vh;overflow:auto;white-space:pre-wrap;word-break:keep-all;padding-right:6px;}
  .panel .desc.empty{color:#5b636f;font-style:italic;}

  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .act{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:40px;
    background:rgba(255,255,255,.07);border:1px solid var(--line);color:#eef2f7;
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:.18s;}
  .act:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);}
  .act:active{transform:scale(.96);}
  .act .ic{font-size:16px;line-height:1;}
  .act.like.liked{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.5);color:#ffdfe6;}
  .act.like.liked .ic{color:var(--heart);}
  .act .cnt{font-variant-numeric:tabular-nums;}

  /* ── 하단 터치 조작 바 (키 작은 어린이 배려: 모든 조작을 화면 맨 아래로) ── */
  .touchbar{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);
    z-index:65;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    max-width:94vw;padding:11px 16px;border-radius:70px;
    background:rgba(18,20,25,.9);border:1px solid var(--line);
    box-shadow:0 12px 40px rgba(0,0,0,.55);opacity:0;transition:opacity .4s .08s, transform .4s;}
  #overlay.on .touchbar{opacity:1;transform:translateX(-50%) translateY(0);}
  .nav{width:56px;height:56px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:#fff;font-size:26px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.18s;}
  .nav:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);}
  .nav:active{transform:scale(.94);}
  .bar-sep{width:1px;height:34px;background:var(--line);flex:0 0 auto;}
  #close{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:40px;
    border:1px solid rgba(255,120,140,.4);background:rgba(255,77,109,.16);color:#ffe1e7;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:.18s;flex:0 0 auto;}
  #close .ic{font-size:17px;line-height:1;}
  #close:hover{background:rgba(255,77,109,.28);border-color:rgba(255,120,140,.7);}
  #close:active{transform:scale(.95);}

  /* ─── 관리자 편집 ─── */
  #admin-badge{position:fixed;top:26px;left:34px;z-index:8;display:none;
    font-size:12px;font-weight:700;letter-spacing:.16em;color:#0b0d10;background:var(--accent);
    padding:6px 12px;border-radius:20px;}
  #wall.admin ~ #admin-badge{display:block;}
  .gear{position:fixed;left:18px;bottom:16px;z-index:9;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:rgba(255,255,255,.4);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .gear:hover{background:rgba(255,255,255,.12);color:#fff;transform:rotate(45deg);}

  .edit{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);display:none;}
  .panel.editing .edit{display:block;}
  .panel.editing .desc,.panel.editing h2{display:none;}
  .edit label{display:block;font-size:12px;letter-spacing:.1em;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;}
  .edit input,.edit textarea{width:100%;font-family:inherit;font-size:15px;color:#fff;
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .edit input:focus,.edit textarea:focus{outline:none;border-color:var(--accent);}
  .edit textarea{min-height:120px;resize:vertical;line-height:1.6;}
  .edit .row{display:flex;gap:10px;margin-top:16px;}
  .edit .row .act.save{background:var(--accent);color:#08121f;border-color:transparent;font-weight:700;}
  .edit .exp{margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;}

  /* QR 공유 */
  #share{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(2,3,5,.8);backdrop-filter:blur(6px);}
  #share.on{display:flex;}
  .qrbox{background:#fff;color:#0f1114;border-radius:18px;padding:30px 30px 26px;text-align:center;
    width:340px;max-width:88vw;box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .qrbox h3{font-size:19px;font-weight:700;margin-bottom:4px;}
  .qrbox p{font-size:13px;color:#66707c;margin-bottom:18px;line-height:1.5;word-break:keep-all;}
  #qr{width:220px;height:220px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
  #qr img,#qr canvas{width:220px;height:220px;}
  .qrbox .lnk{font-size:12px;color:#8a93a0;word-break:break-all;line-height:1.4;}
  .qrbox .cls{margin-top:18px;background:#0f1114;color:#fff;border:none;border-radius:30px;
    padding:11px 24px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}

  #loading{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:var(--bg);color:#7b838f;font-weight:300;}
  #loading .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
    animation:bl 1s ease-in-out infinite;}
  @keyframes bl{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  #err{max-width:520px;text-align:center;font-size:14px;line-height:1.7;color:#9aa2ad;padding:0 20px;}

  @media (max-width:820px){
    .detail{flex-direction:column;gap:14px;padding:3vh 4vw 120px;}
    #bigImg{max-width:92vw;max-height:46vh;} .stage{max-width:92vw;max-height:46vh;}
    .panel{flex:0 0 auto;max-width:92vw;width:92vw;}
    .panel h2{font-size:23px;} .panel .desc{max-height:20vh;}
    .brand{font-size:17px;top:16px;right:18px;}
    .touchbar{gap:8px;bottom:16px;padding:9px 12px;}
    .nav{width:48px;height:48px;font-size:22px;}
    .act{padding:10px 13px;font-size:13px;} #close{padding:11px 16px;font-size:14px;}
  }
</style>
</head>
<body>
  <div id="wall">
    <div id="cols"></div>
    <div id="seams"></div>
  </div>
  <div id="admin-badge">● ADMIN</div>
  <div class="brand"><b>미디어</b> 월<span class="bar"></span></div>
  <div class="hint" id="hint">사진을 터치하면 확대되고 정보가 나타납니다</div>
  <div class="gear" id="gear" title="관리자">⚙</div>

  <!-- 확대 상세 -->
  <div id="overlay">
    <div id="backdrop"></div>
    <div class="detail">
      <div class="stage" id="stage"><img id="bigImg" alt=""></div>
      <div class="panel" id="panel">
        <div class="cat">DATABASE</div>
        <h2 id="pTitle"></h2>
        <div class="idx" id="pIdx"></div>
        <div class="desc" id="pDesc"></div>
        <!-- 관리자 편집 폼 -->
        <div class="edit" id="editForm">
          <label>제목</label>
          <input id="eTitle" type="text" maxlength="80">
          <label>내용</label>
          <textarea id="eDesc" maxlength="1200"></textarea>
          <label>좋아요 (기준값)</label>
          <input id="eLikes" type="number" min="0" style="width:140px">
          <div class="row">
            <button class="act save" id="eSave">저장</button>
            <button class="act" id="eCancel">취소</button>
          </div>
          <div class="exp" id="eExport">모든 정보 info.json 내보내기</div>
        </div>
      </div>
    </div>
    <!-- 하단 터치 조작 바 : 이전 · 좋아요/공유/확대/편집 · 다음 · 닫기 -->
    <div class="touchbar">
      <button class="nav" id="prev" aria-label="이전">‹</button>
      <div class="actions">
        <button class="act like" id="bLike"><span class="ic">♥</span><span class="cnt" id="likeCnt">0</span></button>
        <button class="act" id="bShare"><span class="ic">↗</span> 공유</button>
        <button class="act" id="bZoom"><span class="ic">⤢</span> 확대</button>
        <button class="act" id="bEdit" style="display:none"><span class="ic">✎</span> 편집</button>
      </div>
      <button class="nav" id="next" aria-label="다음">›</button>
      <span class="bar-sep"></span>
      <button id="close" aria-label="닫기"><span class="ic">✕</span> 닫기</button>
    </div>
  </div>

  <!-- QR 공유 -->
  <div id="share">
    <div class="qrbox">
      <h3>QR로 담아가기</h3>
      <p>휴대폰으로 QR을 스캔하면 이 사진과 정보를 볼 수 있어요.</p>
      <div id="qr"></div>
      <div class="lnk" id="qrlnk"></div>
      <button class="cls" id="qrClose">닫기</button>
    </div>
  </div>

  <div id="loading"><div class="dot"></div><div>데이터베이스를 불러오는 중…</div>
    <div id="err"></div></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   21_Database cell — 미디어 월 (Database Wall)
   database/ 폴더의 사진을 자동 배치·흐름, 터치 확대·정보, 관리자 편집
   ════════════════════════════════════════════════════════════ */
const ADMIN_PIN = '0000';          // 관리자 PIN (?admin=1 로도 진입)
const $ = s => document.querySelector(s);

const state = {
  photos: [], byId: {}, order: [],
  overrides: load('dbwall_overrides', {}),   // 관리자 편집 {id:{title,content,likes}}
  userLikes: load('dbwall_likes', {}),       // 방문자 좋아요 {id:delta}
  admin: false, cur: -1, fromEl: null, editing: false,
};
function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ── 데이터 로드: manifest.json ← info.json ← localStorage ── */
async function boot(){
  let manifest;
  try{
    manifest = await (await fetch('manifest.json?_=' + Date.now())).json();
  }catch(e){
    $('#err').innerHTML = 'manifest.json 을 불러오지 못했습니다.<br>먼저 <b>python build_manifest.py</b> 를 실행하고, ' +
      '이 페이지를 <b>웹 서버(http)</b>로 열어주세요. (file:// 로는 동작하지 않습니다)';
    return;
  }
  let info = {};
  try{ info = await (await fetch('info.json?_=' + Date.now())).json(); }catch(e){}

  state.photos = (manifest.photos || []).map(p => {
    const o = state.overrides[p.id] || {};
    const i = (info && info[p.id]) || {};
    return {
      id: p.id, thumb: p.thumb, full: p.full, w: p.w||1, h: p.h||1,
      title:   o.title   ?? i.title   ?? p.title ?? p.id,
      content: o.content ?? i.content ?? p.content ?? '',
      likes:  +(o.likes   ?? i.likes   ?? p.likes ?? 0),
    };
  });
  state.photos.forEach(p => state.byId[p.id] = p);
  state.order = state.photos.map(p => p.id);

  if(!state.photos.length){ $('#err').textContent = 'database/ 폴더에 사진이 없습니다.'; return; }
  if(new URLSearchParams(location.search).get('admin') === '1') setAdmin(true);

  buildWall();
  $('#loading').style.display = 'none';
  startFlow();

  // QR 공유 링크로 들어온 경우 자동 확대
  const ph = new URLSearchParams(location.search).get('photo');
  if(ph && state.byId[ph]) setTimeout(() => openPhoto(ph, null), 300);
}

/* ══════════ 흐르는 벽 만들기 ══════════ */
const flow = { cols: [], raf: 0, last: 0, paused: false };

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildWall(){
  const wall = $('#cols'); wall.innerHTML = '';
  flow.cols = [];
  const W = innerWidth, H = innerHeight;
  const gap = Math.max(5, Math.round(W/300));
  const target = W < 700 ? 116 : 132;                 // 목표 컬럼 폭(px) → 촘촘한 벽
  const nCols = Math.max(4, Math.round(W / target));
  const realColW = W / nCols;

  // 셔플된 사진을 여러 컬럼에 순환 배치
  let pool = shuffle(state.order);
  if(pool.length < nCols*8) pool = pool.concat(shuffle(state.order), shuffle(state.order), shuffle(state.order));
  let pi = 0;

  for(let c=0;c<nCols;c++){
    const col = document.createElement('div');
    col.className = 'col';
    col.style.left  = (c*realColW) + 'px';
    col.style.width = realColW + 'px';
    col.style.setProperty('--gap', gap+'px');
    const inner = Math.max(96, realColW - gap*1.4);
    const pad = (realColW - inner)/2;

    const strip = document.createElement('div');
    strip.className = 'strip';
    strip.style.padding = `0 ${pad}px`;

    // 한 사이클이 화면 높이보다 충분히 크도록 카드 채우기
    let hAcc = 0, guard = 0; const cardHs = [];
    while(hAcc < H*1.25 && guard++ < 400){
      const id = pool[pi++ % pool.length];
      const p = state.byId[id];
      const ch = Math.round(inner * (p.h/p.w));
      cardHs.push([id, ch]);
      hAcc += ch + gap;
    }
    const cycleH = hAcc;
    // 이음매 없는 무한 스크롤용 2회 복제
    for(let rep=0; rep<2; rep++){
      for(const [id, ch] of cardHs){
        strip.appendChild(makeCard(id, ch));
      }
    }
    col.appendChild(strip);
    wall.appendChild(col);

    flow.cols.push({
      strip, cycleH,
      offset: -Math.random()*cycleH,
      speed: 9 + Math.random()*14,          // px/s, 완만한 위로 흐름
    });
  }

  // 5분할 스크린 심
  const seams = $('#seams'); seams.innerHTML = '';
  for(let i=0;i<5;i++){ const s=document.createElement('div'); s.className='screen'; seams.appendChild(s); }
}

function makeCard(id, ch){
  const p = state.byId[id];
  const el = document.createElement('div');
  el.className = 'card';
  el.style.height = ch + 'px';
  el.dataset.id = id;
  const img = new Image();
  img.loading = 'lazy'; img.decoding = 'async';
  img.src = p.thumb; img.alt = p.title;
  el.appendChild(img);
  return el;
}

function startFlow(){
  cancelAnimationFrame(flow.raf);
  flow.last = performance.now();
  const step = (t) => {
    const dt = Math.min(0.05, (t - flow.last)/1000); flow.last = t;
    if(!flow.paused){
      for(const c of flow.cols){
        c.offset -= c.speed*dt;
        if(c.offset <= -c.cycleH) c.offset += c.cycleH;
        c.strip.style.transform = `translateY(${c.offset}px)`;
      }
    }
    flow.raf = requestAnimationFrame(step);
  };
  flow.raf = requestAnimationFrame(step);
}

let rzTmr;
addEventListener('resize', () => { clearTimeout(rzTmr); rzTmr = setTimeout(() => {
  buildWall(); flow.last = performance.now();
}, 220); });

/* ══════════ 카드 클릭 → 확대 ══════════ */
$('#cols').addEventListener('click', e => {
  const card = e.target.closest('.card'); if(!card) return;
  openPhoto(card.dataset.id, card);
});

function openPhoto(id, fromEl){
  const idx = state.order.indexOf(id); if(idx<0) return;
  state.cur = idx; state.fromEl = fromEl; flow.paused = true;
  renderDetail();
  const ov = $('#overlay'); ov.classList.add('on');
  $('#hint').style.opacity = 0;
  flipIn(fromEl);
}

function renderDetail(){
  const p = state.byId[state.order[state.cur]];
  $('#bigImg').src = p.full; $('#bigImg').alt = p.title;
  $('#pTitle').textContent = p.title;
  $('#pIdx').textContent = `${state.cur+1} / ${state.order.length}`;
  const d = $('#pDesc');
  if(p.content && p.content.trim()){ d.textContent = p.content; d.classList.remove('empty'); }
  else { d.textContent = '등록된 설명이 없습니다.'; d.classList.add('empty'); }
  // 좋아요
  const total = (p.likes||0) + (state.userLikes[p.id]||0);
  $('#likeCnt').textContent = total.toLocaleString();
  $('#bLike').classList.toggle('liked', !!state.userLikes[p.id]);
  // 편집 폼 초기화
  $('#panel').classList.remove('editing'); state.editing = false;
  $('#bEdit').style.display = state.admin ? 'inline-flex' : 'none';
  $('#eTitle').value = p.title; $('#eDesc').value = p.content||''; $('#eLikes').value = p.likes||0;
}

/* FLIP: 카드 위치에서 중앙으로 자라나는 확대 */
function flipIn(fromEl){
  const img = $('#bigImg');
  img.onload = img.complete ? run() : (img.onload = run);
  function run(){
    if(!fromEl) return;
    const first = fromEl.getBoundingClientRect();
    const last = img.getBoundingClientRect();
    if(!last.width) return;
    const dx = first.left - last.left, dy = first.top - last.top;
    const sx = first.width/last.width, sy = first.height/last.height;
    img.animate(
      [{transformOrigin:'top left', transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity:.6},
       {transform:'none', opacity:1}],
      {duration:440, easing:'cubic-bezier(.2,.8,.2,1)'});
  }
}

function closePhoto(){
  const ov = $('#overlay'); const img = $('#bigImg'); const fromEl = state.fromEl;
  $('#stage').classList.remove('zoom'); resetZoom();
  let closed = false;
  const done = () => {                       // 애니메이션 성공/실패와 무관하게 반드시 닫힘 보장
    if(closed) return; closed = true;
    ov.classList.remove('on'); flow.paused = false; $('#panel').style='';
  };
  if(fromEl){
    const first = fromEl.getBoundingClientRect();
    const last = img.getBoundingClientRect();
    if(last.width){
      const dx = first.left - last.left, dy = first.top - last.top;
      const sx = first.width/last.width, sy = first.height/last.height;
      $('#panel').style.transition='opacity .2s'; $('#panel').style.opacity=0;
      const a = img.animate(
        [{transform:'none'},{transformOrigin:'top left',transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:.4}],
        {duration:340, easing:'cubic-bezier(.4,0,.2,1)'});
      a.onfinish = done; a.oncancel = done;
      setTimeout(done, 380);                 // 탭 비활성/렌더러 지연 시 onfinish 미발생 대비 안전망
      return;
    }
  }
  done();
}

function step(dir){
  state.cur = (state.cur + dir + state.order.length) % state.order.length;
  state.fromEl = null;
  const img = $('#bigImg');
  img.animate([{opacity:.15},{opacity:1}],{duration:280,easing:'ease'});
  renderDetail();
}

/* ══════════ 좋아요 / 공유 / 확대 ══════════ */
$('#bLike').addEventListener('click', () => {
  const p = state.byId[state.order[state.cur]];
  if(state.userLikes[p.id]){ delete state.userLikes[p.id]; }
  else { state.userLikes[p.id] = 1; }
  save('dbwall_likes', state.userLikes);
  const total = (p.likes||0) + (state.userLikes[p.id]||0);
  $('#likeCnt').textContent = total.toLocaleString();
  $('#bLike').classList.toggle('liked', !!state.userLikes[p.id]);
  if(state.userLikes[p.id]) burst($('#bLike'));
});
function burst(btn){
  const r = btn.getBoundingClientRect();
  for(let i=0;i<8;i++){
    const s=document.createElement('div'); s.textContent='♥';
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top}px;color:var(--heart);
      font-size:${12+Math.random()*10}px;pointer-events:none;z-index:99;`;
    document.body.appendChild(s);
    const a=(Math.random()-0.5)*90;
    s.animate([{transform:'translate(0,0)',opacity:1},
      {transform:`translate(${a}px,${-50-Math.random()*50}px)`,opacity:0}],
      {duration:700+Math.random()*400,easing:'ease-out'}).onfinish=()=>s.remove();
  }
}

/* 공유 → QR */
$('#bShare').addEventListener('click', () => {
  const p = state.byId[state.order[state.cur]];
  const url = location.origin + location.pathname + '?photo=' + p.id;
  $('#qrlnk').textContent = url;
  const box = $('#qr'); box.innerHTML='';
  makeQR(box, url);
  $('#share').classList.add('on');
});
$('#qrClose').addEventListener('click', () => $('#share').classList.remove('on'));
$('#share').addEventListener('click', e => { if(e.target.id==='share') $('#share').classList.remove('on'); });

function makeQR(box, url){
  // 1) qrcodejs CDN → 2) qrserver 이미지 API → 3) 링크만
  if(window.QRCode){ new QRCode(box, {text:url, width:220, height:220, correctLevel:QRCode.CorrectLevel.M}); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js';
  s.onload = () => { box.innerHTML=''; new QRCode(box, {text:url, width:220, height:220}); };
  s.onerror = () => {
    const img = new Image();
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
    img.onerror = () => box.innerHTML = '<div style="font-size:12px;color:#66707c">QR 생성 실패 — 아래 링크를 이용하세요</div>';
    box.appendChild(img);
  };
  document.head.appendChild(s);
}

/* 확대(줌/팬) */
const zoom = { on:false, scale:1, x:0, y:0, drag:false, px:0, py:0 };
$('#bZoom').addEventListener('click', () => {
  const st = $('#stage');
  if(st.classList.contains('zoom')){ st.classList.remove('zoom'); resetZoom(); }
  else { st.classList.add('zoom'); zoom.on=true; zoom.scale=1; applyZoom(); }
});
function resetZoom(){ zoom.on=false; zoom.scale=1; zoom.x=0; zoom.y=0; $('#bigImg').style.transform=''; }
function applyZoom(){ $('#bigImg').style.transform = `translate(${zoom.x}px,${zoom.y}px) scale(${zoom.scale})`; }
$('#stage').addEventListener('wheel', e => {
  if(!zoom.on) return; e.preventDefault();
  zoom.scale = Math.min(6, Math.max(1, zoom.scale * (e.deltaY<0?1.12:0.89)));
  if(zoom.scale===1){ zoom.x=0; zoom.y=0; } applyZoom();
}, {passive:false});
$('#stage').addEventListener('pointerdown', e => {
  if(!zoom.on||zoom.scale<=1) return; zoom.drag=true; zoom.px=e.clientX; zoom.py=e.clientY; $('#stage').style.cursor='grabbing';
});
addEventListener('pointermove', e => {
  if(!zoom.drag) return; zoom.x += e.clientX-zoom.px; zoom.y += e.clientY-zoom.py; zoom.px=e.clientX; zoom.py=e.clientY; applyZoom();
});
addEventListener('pointerup', () => { zoom.drag=false; if($('#stage')) $('#stage').style.cursor='grab'; });

/* ══════════ 관리자 ══════════ */
function setAdmin(on){
  state.admin = on;
  $('#wall').classList.toggle('admin', on);
  $('#admin-badge').style.display = on ? 'block' : 'none';
  if($('#overlay').classList.contains('on')) $('#bEdit').style.display = on?'inline-flex':'none';
}
$('#gear').addEventListener('click', () => {
  if(state.admin){ setAdmin(false); return; }
  const pin = prompt('관리자 PIN을 입력하세요');
  if(pin === ADMIN_PIN) setAdmin(true);
  else if(pin !== null) alert('PIN이 올바르지 않습니다.');
});
$('#bEdit').addEventListener('click', () => { $('#panel').classList.add('editing'); state.editing=true; $('#eTitle').focus(); });
$('#eCancel').addEventListener('click', () => { $('#panel').classList.remove('editing'); state.editing=false; });
$('#eSave').addEventListener('click', () => {
  const p = state.byId[state.order[state.cur]];
  p.title = $('#eTitle').value.trim() || p.title;
  p.content = $('#eDesc').value;
  p.likes = Math.max(0, parseInt($('#eLikes').value)||0);
  state.overrides[p.id] = { title:p.title, content:p.content, likes:p.likes };
  save('dbwall_overrides', state.overrides);
  $('#panel').classList.remove('editing'); state.editing=false;
  renderDetail();
});
$('#eExport').addEventListener('click', () => {
  // 모든 편집 내용을 info.json 형태로 내보내기 (배포 시 함께 올리면 전 기기 공통 적용)
  const out = {};
  state.photos.forEach(p => { out[p.id] = { title:p.title, content:p.content, likes:p.likes }; });
  const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'info.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
});

/* ══════════ 공통 컨트롤 ══════════ */
$('#close').addEventListener('click', closePhoto);
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
$('#backdrop').addEventListener('click', closePhoto);
addEventListener('keydown', e => {
  if($('#share').classList.contains('on')){ if(e.key==='Escape') $('#share').classList.remove('on'); return; }
  if(!$('#overlay').classList.contains('on')){
    if(e.key.toLowerCase()==='a') setAdmin(!state.admin);   // 관리자 토글 단축키
    return;
  }
  if(state.editing) return;
  if(e.key==='Escape') { if($('#stage').classList.contains('zoom')){ $('#stage').classList.remove('zoom'); resetZoom(); } else closePhoto(); }
  else if(e.key==='ArrowLeft') step(-1);
  else if(e.key==='ArrowRight') step(1);
});

boot();
</script>
